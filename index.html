/* Оба списка строятся из PRICING, а не из литералов в разметке: цель — все 15
   тарифов Vibe+, и держать их копию в HTML значило бы завести третий источник цен. */
function fillPlanSelects(){
  /* ОБА СЕЛЕКТОРА ГРУППИРУЮТСЯ ОДИНАКОВО — по ёмкости тира.
     Раньше группировка была только у цели и означала «есть ли пара в Essentials»;
     после официальной выгрузки пара есть у всех пятнадцати, и такой критерий
     схлопнулся бы в одну группу. А текущий тарифов стало пятнадцать вместо семи,
     и плоским списком он уже не читается. Поэтому граница одна и та же, по местам,
     и подписи одни и те же в обоих списках. На расчёт группировка не влияет. */
  const grouped = (list, label, selected) => {
    const small = list.filter(v => !(seatsOf(v.plan) > SELECT_GROUP_SEATS));
    const big   = list.filter(v =>   seatsOf(v.plan) > SELECT_GROUP_SEATS);
    const opt = v => `<option value="${v.plan}"${v.plan===selected?" selected":""}>${label(v)}</option>`;
    return `<optgroup label="${t("ui.grpMatched")}">${small.map(opt).join("")}</optgroup>`
         + `<optgroup label="${t("ui.grpEnterprise")}">${big.map(opt).join("")}</optgroup>`;
  };

  const cur = document.getElementById("ess-sel");
  if(cur){
    /* ВСЕ пятнадцать опубликованных тиров Essentials + «ещё нет Битрикс24».
       Ёмкость показываем прямо в подписи: без неё «Enterprise 500» и
       «Enterprise 5000» на беглый взгляд читаются одинаково. Пункт «нет Битрикс24»
       стоит ВНЕ групп: это не тир и в шкалу мест не попадает. */
    const list = essentialsList();
    cur.innerHTML =
      grouped(list, r => r.seats ? `${r.plan} — ${t("ui.seatsUpTo", {n: fmtInt(r.seats)})}` : r.plan, essPlan)
      + `<option value="${NO_B24}"${essPlan===NO_B24?" selected":""}>${t("ui.planNone")}</option>`;
  }
  const tgt = document.getElementById("tgt-sel");
  if(tgt){
    resolveTarget();      /* иначе подсветится первый пункт, а не выбранная цель */
    tgt.innerHTML = grouped(PRICING.vibePlus[CUR] || [],
                            v => `${v.plan} — ${fmtMoney(v.annual)}`, tgtPlanName);
  }
  const hint = document.getElementById("tgt-hint");
  if(hint){
    hint.innerHTML = tgtAuto
      ? t("ui.tgtAuto")
      : `${t("ui.tgtManual")} <button type="button" class="svc-jump" id="tgt-reset">${t("ui.tgtReset")}</button>`;
  }
}
/* Partner contact block — values live in `partner`, so a language or currency
   switch repaints labels without clearing what the partner typed. */
/* startDate и scopeNote — поля ЛИСТА ПРЕДЛОЖЕНИЯ (P16). Живут вместе с контактами
   партнёра, потому что это то же самое по природе: данные партнёра, а не расчёт, и
   хранятся в его браузере тем же localStorage.
   ДАТА СВОБОДНОЙ СТРОКОЙ, а не полем даты. Партнёр в переговорной пишет «early Q1»,
   «two weeks after signature», «March 2027» — календарный выбор заставил бы его
   назвать конкретное число, которого он ещё не знает, и документ выглядел бы
   точнее, чем есть. Пустое поле печатается как «to be agreed», а не как выдуманная
   дата. */
const PARTNER_FIELDS = ["company","person","email","phone","site","logo","startDate","scopeNote"];
const PT_LS = "vibecalc_partner_v1";
const partner = {};
/* Returns false when the browser refused to store (quota). The caller has to know:
   a silently dropped save means the partner's logo is gone after a reload, and we
   would be showing a logo we cannot keep. */
const savePartner = () => {
  try{ localStorage.setItem(PT_LS, JSON.stringify(partner)); return true; }
  catch(e){ return false; }
};

/* LOGO UPLOAD — limits, and why a file is shrunk instead of refused.
   A partner exports a logo from their brand kit; that file is routinely 1-3 MB.
   Refusing it puts a wall in front of the very first step, so we resize and
   re-encode in the browser instead, and only report a problem when even that is
   not enough. The original file on disk is never touched.
     LOGO_MAX_PX     — a logo is drawn at ~34px in the header and up to 150px in a
                       report; 600px is generous even for a 2x screen.
     LOGO_STORE_MAX  — what we agree to keep as a data URI in localStorage.
     LOGO_INPUT_MAX  — sanity guard: past this we do not even try to decode, or a
                       phone photo would freeze the tab. */
const LOGO_MAX_PX     = 600;
const LOGO_STORE_MAX  = 200 * 1024;
const LOGO_INPUT_MAX  = 12 * 1024 * 1024;
const b64Bytes = uri => Math.round((uri.length - (uri.indexOf(",") + 1)) * 3 / 4);
/* "0 KB" for a 300-byte file reads like a failure. One decimal below 10 KB. */
const kbText = b => b < 10240 ? (b / 1024).toFixed(1) : String(Math.round(b / 1024));

function buildPartner(){
  const g = document.getElementById("pt-grid");
  if(!g) return;
  g.innerHTML = PARTNER_FIELDS.map(k=> k === "scopeNote" ? `
    <div class="field b24x-scope-field">
      <label for="pt-scopeNote">${t("pt.scopeNote")}</label>
      <textarea class="b24x-input pt-in" id="pt-scopeNote" data-pt="scopeNote" rows="3"
                placeholder="${t("pt.scopeNotePlaceholder")}">${(partner.scopeNote||"").replace(/</g,"&lt;")}</textarea>
      <span class="hint">${t("pt.scopeNoteHint")}</span>
    </div>` : k === "startDate" ? `
    <div class="field">
      <label for="pt-startDate">${t("pt.startDate")}</label>
      <div class="in-wrap">
        <input class="b24x-input pt-in" id="pt-startDate" data-pt="startDate" type="text"
               placeholder="${t("pt.startDatePlaceholder")}"
               value="${(partner.startDate||"").replace(/"/g,"&quot;")}">
      </div>
      <span class="hint">${t("pt.startDateHint")}</span>
    </div>` : k === "logo" ? `
    <div class="field b24x-logo-field">
      <label for="pt-logo">${t("pt.logo")}</label>
      <!-- ДВА СПОСОБА, НЕ КОНКУРИРУЮЩИЕ: ссылка | or | файл.
           Ровно три ребёнка у .field — столько строк даёт ему subgrid в
           brand-ext.css. Четвёртый и пятый ребёнок схлопывались в одну строку
           с третьим, из-за чего кнопка загрузки лежала поверх подсказки. -->
      <div class="b24x-logo-ways">
        <div class="in-wrap">
          <input class="b24x-input pt-in" id="pt-logo" data-pt="logo" type="text"
                 placeholder="${t("pt.logoPlaceholder")}"
                 value="${/^data:/.test(partner.logo||"") ? "" : (partner.logo||"").replace(/"/g,"&quot;")}">
        </div>
        <span class="b24x-logo-or">${t("pt.logoOr")}</span>
        <label class="b24x-file b24x-file--btn">
          <input type="file" id="pt-logo-file" accept="image/png,image/jpeg,image/svg+xml,image/webp">
          <span>${t("pt.logoUpload")}</span>
        </label>
      </div>
      <div class="b24x-logo-foot">
        <div class="b24x-logo-preview" id="pt-logo-preview" hidden>
          <img id="pt-logo-thumb" alt="">
          <button type="button" class="b24x-logo-clear" id="pt-logo-clear">${t("pt.logoClear")}</button>
        </div>
        <span class="hint" id="pt-logo-hint">${t("pt.logoHint")}</span>
      </div>
    </div>` : `
    <div class="field">
      <label for="pt-${k}">${t("pt."+k)}</label>
      <div class="in-wrap">
        <input class="b24x-input pt-in" id="pt-${k}" data-pt="${k}"
               type="${k==="email"?"email":k==="site"?"url":"text"}"
               value="${(partner[k]||"").replace(/"/g,"&quot;")}">
      </div>
    </div>`).join("");

  g.querySelectorAll(".pt-in").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      partner[inp.dataset.pt] = inp.value;
      savePartner();
      /* Предупреждение о пустых контактах должно гаснуть по мере заполнения, а
         не ждать следующего пересчёта: партнёр печатает и сразу видит результат. */
      renderPartnerWarning();
      if(inp.dataset.pt === "logo") applyPartnerLogo();
    });
  });

  const file = document.getElementById("pt-logo-file");
  if(file) file.addEventListener("change", ()=> handleLogoFile(file));

  const clear = document.getElementById("pt-logo-clear");
  if(clear) clear.addEventListener("click", ()=>{
    partner.logo = "";
    savePartner();
    const url = document.getElementById("pt-logo"); if(url) url.value = "";
    const f = document.getElementById("pt-logo-file"); if(f) f.value = "";
    applyPartnerLogo();
    /* Иначе на пустом поле продолжает висеть ошибка от предыдущего файла. */
    logoSay("pt.logoHint");
  });

  applyPartnerLogo();
}

/* ---- LOGO FILE: shrink, then store ---------------------------------------
   Order of the checks is the order of the honest answers. Every exit says what
   is wrong with THIS file, because "too big" told the partner nothing about what
   to do next. */
function logoSay(key, params, isError){
  const hint = document.getElementById("pt-logo-hint");
  if(!hint) return;
  hint.textContent = t(key, params);
  hint.classList.toggle("logo-err", !!isError);
}

/* Draw into a canvas at no more than LOGO_MAX_PX on the long side, then walk an
   encoder ladder from lossless to lossy and stop at the first result that fits.
   PNG goes first so a flat logo with transparency stays pixel-exact; WebP steps
   in only when PNG cannot fit, which in practice means a photographic logo. */
function shrinkImage(img){
  const long = Math.max(img.naturalWidth, img.naturalHeight);
  const k = long > LOGO_MAX_PX ? LOGO_MAX_PX / long : 1;
  const w = Math.max(1, Math.round(img.naturalWidth  * k));
  const h = Math.max(1, Math.round(img.naturalHeight * k));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const cx = c.getContext("2d");
  cx.imageSmoothingQuality = "high";
  cx.drawImage(img, 0, 0, w, h);
  let smallest = null;
  for (const [type, q] of [["image/png", undefined], ["image/webp", 0.92],
                           ["image/webp", 0.85], ["image/webp", 0.75]]) {
    let uri;
    try { uri = c.toDataURL(type, q); } catch(e){ continue; }
    if (uri.indexOf("data:" + type) !== 0) continue;      // type not supported
    const bytes = b64Bytes(uri);
    if (!smallest || bytes < smallest.bytes) smallest = {uri, bytes, w};
    if (bytes <= LOGO_STORE_MAX) return {uri, bytes, w, fits: true};
  }
  return smallest ? {...smallest, fits: false} : null;
}

/* info = {px, bytes, resized, forStorage}. The message names the REAL reason the
   file changed: pixels alone (the reports never need more than LOGO_MAX_PX) or
   storage (the original would not fit in localStorage). Saying "so it fits your
   storage" about a 25 KB file that fitted all along is exactly the kind of
   message this rewrite is meant to remove. */
function storeLogo(uri, info){
  partner.logo = uri;
  const url = document.getElementById("pt-logo");
  if(url) url.value = "";                       // the file wins over the link
  const kept = savePartner();
  applyPartnerLogo();
  const p = {px: info.px, kb: kbText(info.bytes)};
  /* SVG не имеет пиксельного размера как факта — сообщение про px для него
     бессмысленно, поэтому у него своя строка без размера. */
  if(kept && info.px == null && !info.resized){
    logoSay("pt.logoReadySvg", {kb: p.kb});
    return;
  }
  if(!kept)              logoSay("pt.logoStoreFull", null, true);
  else if(info.forStorage) logoSay("pt.logoShrunk", p);
  else if(info.resized)    logoSay("pt.logoScaled", p);
  else                     logoSay("pt.logoReady",  p);
}

function handleLogoFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const ext = (f.name.split(".").pop() || "file").toLowerCase();
  const done = () => { input.value = ""; };     // same file can be picked again

  const isSvg = f.type === "image/svg+xml" || ext === "svg";
  if(!/^image\//.test(f.type) && !isSvg){
    logoSay("pt.logoNotImage", {type: f.type || ext}, true);
    return done();
  }
  if(f.size > LOGO_INPUT_MAX){
    logoSay("pt.logoHuge", {mb: (f.size/1048576).toFixed(1),
                            maxmb: Math.round(LOGO_INPUT_MAX/1048576)}, true);
    return done();
  }

  const fr = new FileReader();
  fr.onerror = () => { logoSay("pt.logoBroken", {ext}, true); done(); };
  fr.onload = () => {
    const uri = String(fr.result);
    /* SVG is markup, not pixels: there is nothing to resample. Either it fits or
       it carries an embedded bitmap, and then the honest answer is to say so. */
    if(isSvg){
      const bytes = b64Bytes(uri);
      if(bytes > LOGO_STORE_MAX){
        logoSay("pt.logoSvgTooBig", {kb: kbText(bytes),
                                     max: Math.round(LOGO_STORE_MAX/1024)}, true);
        return done();
      }
      storeLogo(uri, {px: null, bytes, resized: false, forStorage: false});
      return done();
    }
    const img = new Image();
    img.onerror = () => { logoSay("pt.logoBroken", {ext}, true); done(); };
    img.onload = () => {
      const asIs = b64Bytes(uri);
      if(img.naturalWidth <= LOGO_MAX_PX && img.naturalHeight <= LOGO_MAX_PX
         && asIs <= LOGO_STORE_MAX){
        storeLogo(uri, {px: img.naturalWidth, bytes: asIs,
                        resized: false, forStorage: false});   // keep it untouched
        return done();
      }
      const small = shrinkImage(img);
      if(!small){ logoSay("pt.logoBroken", {ext}, true); return done(); }
      if(!small.fits){
        logoSay("pt.logoStillTooBig", {px: small.w, kb: kbText(small.bytes),
                                       max: Math.round(LOGO_STORE_MAX/1024)}, true);
        return done();
      }
      storeLogo(small.uri, {px: small.w, bytes: small.bytes, resized: true,
                            forStorage: asIs > LOGO_STORE_MAX});
      done();
    };
    img.src = uri;
  };
  fr.readAsDataURL(f);
}

/* ---------- СВЕТЛОТА ЗНАКА ПАРТНЁРА ----------------------------------------
   Логотип у партнёра ОДИН, а печатается он и на светлых страницах отчёта, и на
   тёмно-синей обложке с закрывающей страницей. Тёмный знак на navy пропадает.
   Второй файл не просим — это барьер на входе, и половина всё равно загрузит
   один вариант. Вместо этого отчёт кладёт знак на подложку, а цвет подложки
   зависит от того, тёмный знак или светлый: белая под тёмным, тёмная под белым.
   Решает не человек, а замер: средняя относительная светимость (WCAG-формула,
   sRGB -> линейное) по НЕПРОЗРАЧНЫМ пикселям, взвешенная по альфе. Прозрачный
   фон вокруг знака в счёт не идёт — иначе логотип на прозрачном фоне мерился бы
   как «светлый» просто потому, что его мало.
   Три исхода, и третий важен не меньше первых двух:
     "dark"  — знак тёмный или цветной -> белая подложка;
     "light" — знак светлый -> тёмная подложка;
     null    — измерить не удалось -> подложки НЕТ, поведение как до правки.
   null бывает на ссылке с чужого домена: canvas опечатан, getImageData бросает,
   а crossOrigin="anonymous" без CORS-заголовков просто не даёт загрузить. Гадать
   в этом случае нельзя: белая подложка под белым знаком спрятала бы знак,
   который до правки был виден. */
const LOGO_LIGHT_L = 0.55;      /* выше этой светимости знак считаем светлым */
let logoInkFor = null;          /* для какого src уже посчитано / считается */

function measureLogoInk(src, done){
  if(!src){ done(null); return; }
  const img = new Image();
  img.onerror = () => done(null);
  img.onload = () => {
    try{
      const BOX = 64;           /* мерить светлоту по 64px достаточно и быстро */
      const k = Math.min(BOX / img.naturalWidth, BOX / img.naturalHeight) || 1;
      const w = Math.max(1, Math.round(img.naturalWidth  * Math.min(k, 1)));
      const h = Math.max(1, Math.round(img.naturalHeight * Math.min(k, 1)));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const cx = c.getContext("2d", {willReadFrequently:true});
      cx.drawImage(img, 0, 0, w, h);
      const d = cx.getImageData(0, 0, w, h).data;
      const lin = v => { v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
      let lum = 0, alpha = 0;
      for(let i = 0; i < d.length; i += 4){
        const a = d[i+3] / 255;
        if(a < 0.1) continue;
        lum += a * (0.2126*lin(d[i]) + 0.7152*lin(d[i+1]) + 0.0722*lin(d[i+2]));
        alpha += a;
      }
      if(alpha < 1){ done(null); return; }        /* нечего мерить */
      done(lum / alpha > LOGO_LIGHT_L ? "light" : "dark");
    }catch(e){ done(null); }                      /* чужой домен: canvas опечатан */
  };
  img.crossOrigin = "anonymous";                  /* даёт шанс ссылке с CORS */
  img.src = src;
}

/* Paint the partner mark wherever it belongs, or hide it so no gap is left.
   Never touches the Bitrix24 lockup. */
function applyPartnerLogo(){
  const src = (partner.logo || "").trim();
  /* Светлота считается ЗДЕСЬ: это единственная точка, через которую проходит
     любая смена логотипа — загрузка файла, вставка ссылки, восстановление из
     localStorage и открытие сохранённого расчёта. Замер асинхронный (нужно
     декодировать картинку), поэтому сравниваем src: если за это время логотип
     сменили, старый ответ выбрасываем. */
  if(src !== logoInkFor){
    logoInkFor = src;
    partner.logoInk = null;
    measureLogoInk(src, ink => {
      if(src !== logoInkFor) return;
      partner.logoInk = ink;
      savePartner();
    });
  }
  ["hdr-partner-logo","foot-partner-logo"].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(src){ el.src = src; el.alt = partner.company ? partner.company + " logo" : "Partner logo"; el.hidden = false; }
    else { el.removeAttribute("src"); el.hidden = true; }
  });
  const prev = document.getElementById("pt-logo-preview");
  const thumb = document.getElementById("pt-logo-thumb");
  if(prev && thumb){
    /* hidden has to be CLEARED on every new source, not only set. A broken link
       typed before the upload fires onerror below, which hides the thumb; without
       this the preview then stayed an empty box with a lone "remove" next to it,
       even though the uploaded file was perfectly good. */
    if(src){ thumb.src = src; thumb.hidden = false; prev.hidden = false; }
    else { thumb.removeAttribute("src"); thumb.hidden = false; prev.hidden = true; }
  }
  /* a broken link should not leave a dead image icon next to the lockup */
  ["hdr-partner-logo","foot-partner-logo","pt-logo-thumb"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onerror = () => { el.hidden = true; if(id==="pt-logo-thumb"){
      const p=document.getElementById("pt-logo-preview"); if(p) p.hidden = true; } };
  });
}

  fillPlanSelects();
  recompute();
});
document.getElementById("burden").addEventListener("input", e=>{
  burdenPct = onNumInput(e.target); recompute();
});
document.getElementById("days").addEventListener("input", e=>{
  const n = onNumInput(e.target);
  daysMonth = n > 0 ? n : C.DAYS_MONTH;   // 0 days would divide by zero
  recompute();
});
document.getElementById("show-rev").addEventListener("change", e=>{
  SHOW_REVENUE = e.target.checked;
  buildScenarios();   // revOnly fields appear/disappear with the switch
  recompute();
});
/* РЕЖИМ РЕАЛИЗАЦИИ. Пересчёт полный, а не refreshTotals: множитель меняет и
   слагаемые в раскрытии внутри карточек, и суммы, и оба предохранителя.
   Кнопки не перерисовываются — переключается только aria-pressed, потому что
   имена в них уже стоят от applyStatic. */
function setRealisation(id){
  if(!REALISATION.some(r=>r.id === id)) return;
  realisationId = id;
  paintRealisation();
  recompute();
}
/* Имя кнопки зависит от её data-real, а не от одного ключа, поэтому data-i18n на
   ней не работает и подписи ставятся здесь. Отсюда же — вызов после смены языка:
   applyStatic() эти кнопки не видит.
   Подсказка перечисляет доли всех трёх режимов и от выбранного не зависит —
   перерисовывать её не нужно. Строку в сводке рисует renderSummary. */
function paintRealisation(){
  document.querySelectorAll("#sw-real button").forEach(b=>{
    b.textContent = t("ui.realMode." + b.dataset.real);
    b.setAttribute("aria-pressed", String(b.dataset.real === realisationId));
  });
}
document.getElementById("sw-real").addEventListener("click", e=>{
  const b = e.target.closest("button[data-real]");
  if(b) setRealisation(b.dataset.real);
});
document.getElementById("dl-state").addEventListener("click", downloadState);

/* ---- ПРЕСЕТЫ ПО ПРОФИЛЮ КЛИЕНТА (P11) ----
   Пресет ДЕЙСТВУЕТ ЧЕРЕЗ ТЕ ЖЕ ГАЛОЧКИ, что и рука партнёра: снимает всё и ставит
   отметки списком. Никакого второго пути выбора сценария в модели не появляется —
   значит охваты, автозаполнение, пометки про агентов, предохранители и режим
   реализации ведут себя ровно так же, как при ручном выборе. Проверять отдельно
   нечего, потому что отдельного механизма нет.
   Значения полей не трогаются вовсе: см. вывод у PRESETS. */
function buildPresets(){
  const row = document.getElementById("preset-row");
  if(!row) return;
  row.innerHTML = PRESETS.map(p=>
    `<button type="button" class="b24x-btn-ghost" data-preset="${p.id}">${
      t("ui.preset" + p.id.charAt(0).toUpperCase() + p.id.slice(1))}</button>`).join("")
    + `<button type="button" class="b24x-btn-ghost b24x-preset-clear" data-preset="__clear"
        >${t("ui.presetClear")}</button>`;
}
function presetMsg(key, params){
  const el = document.getElementById("preset-msg");
  if(!el) return;
  el.textContent = t(key, params); el.hidden = false;
}
function setSelection(ids){
  /* Снимаем всё и ставим нужное ТЕМ ЖЕ путём, каким это делает человек: через
     состояние выбора и полную перерисовку. Значения полей остаются на месте —
     сценарий, снятый и возвращённый, приходит со своими числами. */
  scenarios.forEach(sc=> state[sc.id].selected = ids.includes(sc.id));
  buildScenarios();
  buildServices();
  recompute();
}
document.getElementById("preset-row").addEventListener("click", e=>{
  const b = e.target.closest("[data-preset]");
  if(!b) return;
  if(b.dataset.preset === "__clear"){
    setSelection([]);
    presetMsg("ui.presetCleared");
    return;
  }
  const p = PRESETS.find(x=>x.id === b.dataset.preset);
  if(!p) return;
  setSelection(p.ids);
  /* Печатаем СОСТАВ, а не «мы подобрали»: партнёр обязан увидеть, что именно
     отмечено, и решить сам. Порядок — экранный, как в списке сценариев. */
  const names = scenarios.filter(sc=> p.ids.includes(sc.id))
    .map(sc=> t(`sc.${sc.id}.title`)).join("; ");
  presetMsg("ui.presetPicked", {names});
});

/* ---- ССЫЛКА НА РАСЧЁТ: копирование ---- */
document.getElementById("copy-link").addEventListener("click", async ()=>{
  const msg = document.getElementById("link-msg");
  const box = document.getElementById("link-box");
  const out = document.getElementById("link-out");
  const withPartner = document.getElementById("link-mine").checked;
  let url;
  try { url = await buildLink({withPartner}); }
  catch(e){ msg.hidden = false; msg.textContent = t("ui.linkBad", {why: e.message}); return; }
  out.value = url;
  box.hidden = false;
  /* Буфер обмена требует защищённого контекста: из file:// он недоступен, и это не
     ошибка, а свойство браузера. Тогда показываем поле и просим скопировать оттуда,
     а не молчим и не делаем вид, что скопировали. */
  let copied = false;
  try {
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(url); copied = true;
    }
  } catch(e){ copied = false; }
  if(!copied){ out.focus(); out.select(); }
  msg.hidden = false;
  msg.textContent = t(copied ? "ui.linkCopied" : "ui.linkManual", {n: fmtInt(url.length)})
    + (url.length > LINK_WARN_LEN ? " " + t("ui.linkLong", {n: fmtInt(url.length)}) : "");
});

/* ---- ССЫЛКА НА РАСЧЁТ: открытие ----
   Стоит ПОСЛЕ загрузки страницы и после первого рендера: восстановление идёт через
   тот же applyLoadedState, что и файл, а он ожидает уже собранный интерфейс.
   Хеш НЕ вычищается: обновление страницы должно давать тот же расчёт. */
async function restoreFromHash(){
  const h = String(location.hash || "").replace(/^#/, "");
  if(!h) return;
  const msg = document.getElementById("load-msg");
  const show = (key, params, bad) => { if(msg){ msg.textContent = t(key, params); msg.hidden = false;
                                                msg.classList.toggle("logo-err", !!bad); } };
  /* Чужой формат ссылки — отказ с внятным текстом. Префикс несёт свою версию, и
     ссылка из будущего не должна тихо не сработать. */
  /* НЕ НАШ ХЕШ — МОЛЧИМ. В странице есть обычные якоря (#top, #summary, #scenarios),
     и открытая по такому якорю ссылка не должна встречать читателя красной ошибкой.
     Ругаемся только на то, что ПОХОЖЕ на ссылку с расчётом: префикс s<цифры>. */
  const m = /^s(\d+)\.(.*)$/.exec(h);
  if(!m) return;
  if(!m[2]){ show("ui.linkBad", {why: "the link carries no data — it was cut"}, true); return; }
  if(+m[1] !== LINK_V){
    show("ui.linkBad", {why: `link format v${m[1]}, this calculator reads v${LINK_V}`}, true); return;
  }
  let st;
  try { st = JSON.parse(await unzip(b64urlDec(m[2]))); }
  catch(e){ show("ui.linkBad", {why: "the packed data is damaged or truncated"}, true); return; }
  const problem = stateVersionProblem(st);
  if(problem){ show("ui.linkBad", {why: t(problem)}, true); return; }
  const full = applyLoadedState(st);
  const n = st.restore ? st.restore.scenarios.length : 0;
  show(full ? "ui.linkRestored" : "ui.linkRestoredPartial",
       {n: fmtInt(n), plan: (st.restore && st.restore.plan && st.restore.plan.tgtPlanName) || "—"});
}
document.getElementById("pdf-client").addEventListener("click", ()=> reportToPdf());
document.getElementById("load-state").addEventListener("change", e=> loadStateFile(e.target));

/* ---- boot ---- */
COMPANY.forEach(c=> company[c.k] = c.def);
PARTNER_FIELDS.forEach(k=> partner[k] = "");
try{ Object.assign(partner, JSON.parse(localStorage.getItem(PT_LS)) || {}); }catch(e){}
document.getElementById("burden").value = String(C.BURDEN_PCT);
document.getElementById("days").value = String(C.DAYS_MONTH);
document.getElementById("show-rev").checked = SHOW_REVENUE;
applyStatic();
paintRealisation();
buildPresets();
buildCompany();
buildPartner();
Object.keys(AUTOFILL).forEach(applyCompany);
scenarios.forEach(applyCoverage);   // headcount x coverage, before the first render
buildScenarios();
buildServices();     /* пустое состояние шага 4: «выберите сценарии в шаге 3» */
/* NOTHING is selected on first load — same as the original.
   This is the author's first line of defence against double counting: the partner
   must consciously pick each scenario, so the opening screen never shows a total
   nobody chose. Do not pre-select scenarios here. */
recompute();

/* ССЫЛКА НА РАСЧЁТ — ПОСЛЕДНИМ ШАГОМ ЗАГРУЗКИ. После recompute(), потому что
   applyLoadedState рассчитывает на собранный интерфейс: он ищет поля карточек и
   перекрашивает переключатели. Асинхронно — распаковка идёт через
   DecompressionStream. Ошибку глотать нельзя: она печатается в ту же строку, что
   и результат загрузки файла. */
/* ССЫЛКА, ВСТАВЛЕННАЯ В АДРЕСНУЮ СТРОКУ УЖЕ ОТКРЫТОЙ СТРАНИЦЫ, перезагрузки не
   вызывает — меняется только хеш. Слушаем и восстанавливаем; на обычные якоря
   restoreFromHash не реагирует и молчит. */
window.addEventListener("hashchange", ()=> restoreFromHash().catch(()=>{}));
restoreFromHash().catch(e=>{
  const msg = document.getElementById("load-msg");
  if(msg){ msg.hidden = false; msg.classList.add("logo-err");
           msg.textContent = t("ui.linkBad", {why: e.message}); }
});
</script>
