/* =============================================================================
   CLIENT-BUILD AUDIT — общий для терминала и браузера.
   Клиенту достаётся ОДНА итоговая строка внедрения. Разбивка по сценариям и любая
   страница, помеченная как партнёрская копия, — дело только партнёра.
   Возвращает находки, а не падает: build-report.mjs отказывается писать файл,
   браузер отказывается печатать.
   ========================================================================== */
/* Audit the VISIBLE TEXT, not the markup. Auditing raw HTML gives false positives:
   CSS declarations contain `margin:` and `gap:`, and class names contain `gap-rows`,
   none of which a client can read. So strip <style> blocks, then attributes, then tags. */
function visibleText(doc) {
  return doc
    .replace(/<style[\s\S]*?<\/style>/gi, " ")
    .replace(/<script[\s\S]*?<\/script>/gi, " ")
    .replace(/<[a-z][^>]*>/gi, m => m.replace(/\s+[a-z-]+\s*=\s*("[^"]*"|'[^']*')/gi, "")) // drop attributes
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ")
    .replace(/\s+/g, " ");
}


function auditClient(doc, P, money) {
  const hay = visibleText(doc).toLowerCase();
  const banned = [
    ["itemised partner fees",   /my services/],
    ["unpriced-scenario marker",/not quoted/],
    ["partner copy marking",    /partner copy/],
    ["internal-use marking",    /internal use only/],
  ];
  const hits = banned.filter(([, re]) => re.test(hay)).map(([label]) => label);

  return hits;
}
/* ===== END GENERATED ===== */

/* =============================================================================
   PDF ИЗ БРАУЗЕРА — обе сборки, без установки чего-либо.

   ПОЧЕМУ ПЕЧАТЬ, А НЕ БИБЛИОТЕКА. Кит печатный по своей природе: @page A4 с
   нулевыми полями, .page ровно 210x297mm, разрывы страниц. Печатный движок
   браузера превращает это в PDF с настоящим текстом — выделяемым, ищущимся, с
   фирменным Montserrat. Библиотека дала бы либо растр (html2canvas: мутный
   текст, поехавшие разрывы, +200 КБ), либо ручную раскладку (pdf-lib), то есть
   ВТОРУЮ вёрстку отчёта — ровно то, чего нельзя допускать: версии разъедутся.
   Цена выбора одна и она честная: пользователь выбирает «Сохранить как PDF» в
   диалоге печати. Записать файл на диск без диалога статическая страница не
   может в принципе.

   Разметку строит buildReport() — СГЕНЕРИРОВАННАЯ копия того же модуля, которым
   пользуется scripts/build-report.mjs. Отличается только окружение: в терминале
   логотипы и кит идут data URI, здесь — относительными путями.
   ========================================================================== */
function reportAssets(){
  return {
    lockupDark:  "assets/logo-partner-h.png",
    lockupWhite: "assets/logo-partner-h-white.png",
    /* Печатная производная кита: вариативный Montserrat вместо семи статических
       файлов, которых у партнёра нет, и иконки на вендоренные копии.
       Генерируется scripts/embed-report.mjs. */
    styleTags: `<link rel="stylesheet" href="assets/bitrix24-kit-print.css">`,
    /* Отчёт живёт в iframe: без <base> относительные пути разрешались бы от
       about:blank и ни один логотип не загрузился бы. */
    baseHref: location.href.replace(/[?#].*$/, "").replace(/[^/]*$/, ""),
  };
}

function pdfSay(msgKey, params){
  const box = document.getElementById("pdf-err");
  const txt = document.getElementById("pdf-err-text");
  if(!box || !txt) return;
  if(!msgKey){ box.hidden = true; return; }
  txt.textContent = t(msgKey, params);
  box.hidden = false;
}

function reportToPdf(mode){
  pdfSay(null);
  const model = computeModel();
  if(!model.any){ pdfSay("ui.pdfNoScenarios"); return; }

  const st = reportState();
  const {html, hits} = buildReport(st, {mode, assets: reportAssets()});

  /* Тот же аудит, что в терминале, и та же реакция по смыслу: клиентскую сборку
     с партнёрскими данными не печатаем вообще. Правило одно на два потребителя. */
  if(mode === "client" && hits.length){
    pdfSay("ui.pdfRefused", {what: hits.join(", ")});
    return;
  }

  const frame = document.createElement("iframe");
  frame.setAttribute("aria-hidden", "true");
  frame.title = mode === "partner" ? "Partner report" : "Client report";
  /* Не display:none: скрытый фрейм в части браузеров не раскладывается и печать
     уходит пустой. Уводим за край экрана, оставляя реальный размер листа. */
  frame.style.cssText = "position:fixed; left:-10000px; top:0; width:210mm; height:297mm; border:0;";
  document.body.appendChild(frame);

  const doc = frame.contentDocument;
  doc.open(); doc.write(html); doc.close();

  /* Дождаться ВСЕГО, что влияет на раскладку листа. Замерено: без ожидания
     таблицы стилей первое нажатие уходило в печать по неоформленному документу —
     лист выходил 202x57mm вместо 210x297mm. readyState после document.write уже
     "complete", хотя <link> ещё в пути, поэтому ориентироваться на него нельзя. */
  const waitStyles = () => new Promise(res => {
    const link = doc.querySelector('link[rel="stylesheet"]');
    if(!link || link.sheet) return res();
    let done = false;
    const finish = () => { if(!done){ done = true; res(); } };
    link.addEventListener("load", finish, {once:true});
    link.addEventListener("error", finish, {once:true});
    setTimeout(finish, 8000);            /* страховка: печатать, а не висеть */
  });
  const waitImages = () => Promise.all([...doc.images].map(img =>
    img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })));

  const print = async () => {
    await waitStyles();
    await waitImages();
    /* Печать до загрузки шрифта даёт подстановочный шрифт в PDF. */
    try { await frame.contentWindow.document.fonts.ready; } catch(e){}
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    try {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    } catch(e){
      /* Совсем старый браузер — открываем отчёт отдельной вкладкой, печать вручную. */
      const w = window.open("", "_blank");
      if(w){ w.document.open(); w.document.write(html); w.document.close(); }
    }
    /* Диалог печати держит документ: удаляем фрейм с запасом, а не сразу. */
    setTimeout(() => frame.remove(), 120000);
  };
  if(doc.readyState === "complete") print(); else frame.onload = print;
}

/* ---- сохранить / открыть расчёт (вспомогательное, не отчёт) ---------------- */
/* Возвращает true, если файл нёс блок restore и восстановлено ВСЁ введённое.
   false — файл старого формата: вернулись выбор, охват и цены услуг, а числа
   внутри сценариев пересчитаются из данных о компании. Об этом говорим прямо,
   а не делаем вид, что вернулось всё. */
function applyLoadedState(st){
  const R = st.restore && st.restore.version === 1 ? st.restore : null;

  const co = (R && R.company) || st.company;
  if(co) Object.keys(company).forEach(k=>{ if(co[k] != null) company[k] = co[k]; });

  const days = R ? R.daysMonth : (st.economics && st.economics.daysMonth);
  const burd = R ? R.burdenPct : (st.economics && st.economics.burdenPct);
  if(days) daysMonth = days;
  if(burd != null) burdenPct = burd;

  const pt = (R && R.partner) || st.partner;
  if(pt) PARTNER_FIELDS.forEach(k=>{ if(pt[k] != null) partner[k] = pt[k]; });
  savePartner();

  /* Сегменты сбрасываются вместе с выбором. Без этого добавленные в текущей
     сессии сегменты переживали загрузку файла: строка сценария в файле могла
     их не нести (старый формат) или сценарий мог быть в файле не выбран — и
     старые сегменты оставались в state, продолжая участвовать в расчёте и
     уезжая в следующий экспорт. Загрузка обязана давать ровно то, что в файле. */
  scenarios.forEach(sc=>{ state[sc.id].selected = false; state[sc.id].segments = []; });
  const svc = {};
  const rows = R ? R.scenarios : (st.items || []);
  rows.forEach(row=>{
    const sc = scenarios.find(x=>x.id === row.id);
    if(!sc) return;
    const stt = state[sc.id];
    stt.selected = true;
    if(row.coverage != null) stt.coverage = row.coverage;
    if(row.values)   stt.values   = {...stt.values, ...row.values};
    if(row.dirty)    stt.dirty    = {...row.dirty};
    if(row.segments) stt.segments = row.segments.map(seg=>({...seg}));
    if(row.service != null) svc[String(sc.id)] = row.service;
  });
  try{ localStorage.setItem(SVC_LS, JSON.stringify(svc)); }catch(e){}

  if(R && R.plan){
    essPlan     = R.plan.essPlan || essPlan;
    tgtPlanName = R.plan.tgtPlanName || tgtPlanName;
    tgtAuto     = !!R.plan.tgtAuto;
  } else if(st.plan){
    const fromName = String(st.plan.from || "");
    essPlan = fromName === t("ui.planNone") ? NO_B24
            : ((PRICING.essentials[CUR]||[]).some(r=>r.plan === fromName) ? fromName : essPlan);
    if(st.plan.to && (PRICING.vibePlus[CUR]||[]).some(v=>v.plan === st.plan.to)){
      tgtPlanName = st.plan.to;
      const m = mapFor(essPlan);
      tgtAuto = !!(m && m.to === st.plan.to);
    }
  }

  const rev = R ? R.showRevenue : st.showRevenue;
  if(rev != null){
    SHOW_REVENUE = !!rev;
    const cb = document.getElementById("show-rev"); if(cb) cb.checked = SHOW_REVENUE;
  }
  document.getElementById("burden").value = String(burdenPct);
  document.getElementById("days").value = String(daysMonth);

  /* Автозаполнение не должно затирать восстановленное: applyCompany() уважает
     dirty-флаги, а они пришли из файла — поэтому порядок такой и rerenderAll
     после установки значений. */
  rerenderAll();
  buildServices();
  recompute();
  return !!R;
}

function loadStateFile(input){
  const f = input.files && input.files[0];
  const msg = document.getElementById("load-msg");
  const show = (key, params) => { if(msg){ msg.textContent = t(key, params); msg.hidden = false;
                                            msg.classList.toggle("logo-err", key === "ui.loadBad"); } };
  if(!f) return;
  const fr = new FileReader();
  fr.onerror = () => { show("ui.loadBad", {why: "file could not be read"}); input.value = ""; };
  fr.onload = () => {
    let st;
    try { st = JSON.parse(String(fr.result)); }
    catch(e){ show("ui.loadBad", {why: "not valid JSON"}); input.value = ""; return; }
    if(!st || !Array.isArray(st.items) || !st.company){
      show("ui.loadBad", {why: "no scenarios or company block"}); input.value = ""; return;
    }
    const full = applyLoadedState(st);
    show(full ? "ui.loadOk" : "ui.loadOkPartial",
         {n: (st.restore ? st.restore.scenarios.length : st.items.length),
          plan: (st.plan && st.plan.to) || "—"});
    input.value = "";
  };
  fr.readAsText(f);
}

function downloadState(){
  const blob = new Blob([JSON.stringify(reportState(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "calc-state.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* Partner service-cost field — delegated so it survives re-render.
   MUST call refreshTotals(), never recompute(): the field lives inside #res-N
   and a full recompute rewrites that block, eating the keystroke (phase-2 bug).
   An empty field is saved as "not quoted", not as 0. */
document.addEventListener("input", e=>{

  if(!el.classList || !el.classList.contains("svc-in")) return;
  if(el.value.trim() === ""){ svcSave(el.dataset.svc, ""); }
  else { svcSave(el.dataset.svc, onNumInput(el)); }
  /* У одного сценария теперь ДВА поля: в карточке и в таблице шага 4. Второе
     обновляем из состояния, но никогда то, в котором сейчас курсор, — иначе

/* Оба списка строятся из PRICING, а не из литералов в разметке: цель — все 15

function fillPlanSelects(){
  const cur = document.getElementById("ess-sel");
  if(cur){
    /* ВСЕ опубликованные тиры Essentials + «ещё нет Битрикс24». Раньше список
       строился по карте миграции — четыре пункта, и клиента на Enterprise-1000
       выбрать было нельзя вообще. Ёмкость показываем прямо в подписи: без неё
       «Enterprise» и «Enterprise-500» читаются как одно и то же. */
    const list = PRICING.essentials[CUR] || [];
    cur.innerHTML = list.map(r=>{
        const label = r.seats ? `${r.plan} — ${t("ui.seatsUpTo", {n: fmtInt(r.seats)})}` : r.plan;
        return `<option value="${r.plan}"${r.plan===essPlan?" selected":""}>${label}</option>`;
      }).join("")
      + `<option value="${NO_B24}"${essPlan===NO_B24?" selected":""}>${t("ui.planNone")}</option>`;
  }
  const tgt = document.getElementById("tgt-sel");
  if(tgt){
    resolveTarget();      /* иначе подсветится первый пункт, а не выбранная цель */
    /* 15 позиций читаются только сгруппированными: четыре тарифа, у которых есть
       пара в Essentials, и отдельно Enterprise от 500 пользователей. */
    const list = PRICING.vibePlus[CUR] || [];
    const matched = list.filter(v=> isMatchedTier(v.plan));
    const big = list.filter(v=> !isMatchedTier(v.plan));
    const opt = v => `<option value="${v.plan}"${v.plan===tgtPlanName?" selected":""}>`
                   + `${v.plan} — ${fmtMoney(v.annual)}</option>`;
    tgt.innerHTML =
      `<optgroup label="${t("ui.grpMatched")}">${matched.map(opt).join("")}</optgroup>` +
      `<optgroup label="${t("ui.grpEnterprise")}">${big.map(opt).join("")}</optgroup>`;
  }
  const hint = document.getElementById("tgt-hint");
  if(hint){
    hint.innerHTML = tgtAuto
      ? t("ui.tgtAuto")
      : `${t("ui.tgtManual")} <button type="button" class="svc-jump" id="tgt-reset">${t("ui.tgtReset")}</button>`;
  }
}
/* Partner contact block — values live in `partner`, so a language or currency
   switch repaints labels without clearing what the partner typed. */
const PARTNER_FIELDS = ["company","person","email","phone","site","logo"];
const PT_LS = "vibecalc_partner_v1";
const partner = {};
/* Returns false when the browser refused to store (quota). The caller has to know:
   a silently dropped save means the partner's logo is gone after a reload, and we
   would be showing a logo we cannot keep. */
const savePartner = () => {
  try{ localStorage.setItem(PT_LS, JSON.stringify(partner)); return true; }
  catch(e){ return false; }
};

/* LOGO UPLOAD — limits, and why a file is shrunk instead of refused.
   A partner exports a logo from their brand kit; that file is routinely 1-3 MB.
   Refusing it puts a wall in front of the very first step, so we resize and
   re-encode in the browser instead, and only report a problem when even that is
   not enough. The original file on disk is never touched.
     LOGO_MAX_PX     — a logo is drawn at ~34px in the header and up to 150px in a
                       report; 600px is generous even for a 2x screen.
     LOGO_STORE_MAX  — what we agree to keep as a data URI in localStorage.
     LOGO_INPUT_MAX  — sanity guard: past this we do not even try to decode, or a
                       phone photo would freeze the tab. */
const LOGO_MAX_PX     = 600;
const LOGO_STORE_MAX  = 200 * 1024;
const LOGO_INPUT_MAX  = 12 * 1024 * 1024;
const b64Bytes = uri => Math.round((uri.length - (uri.indexOf(",") + 1)) * 3 / 4);
/* "0 KB" for a 300-byte file reads like a failure. One decimal below 10 KB. */
const kbText = b => b < 10240 ? (b / 1024).toFixed(1) : String(Math.round(b / 1024));

function buildPartner(){
  const g = document.getElementById("pt-grid");
  if(!g) return;
  g.innerHTML = PARTNER_FIELDS.map(k=> k === "logo" ? `
    <div class="field b24x-logo-field">
      <label for="pt-logo">${t("pt.logo")}</label>
      <!-- ДВА СПОСОБА, НЕ КОНКУРИРУЮЩИЕ: ссылка | or | файл.
           Ровно три ребёнка у .field — столько строк даёт ему subgrid в
           brand-ext.css. Четвёртый и пятый ребёнок схлопывались в одну строку
           с третьим, из-за чего кнопка загрузки лежала поверх подсказки. -->
      <div class="b24x-logo-ways">
        <div class="in-wrap">
          <input class="b24x-input pt-in" id="pt-logo" data-pt="logo" type="text"
                 placeholder="${t("pt.logoPlaceholder")}"
                 value="${/^data:/.test(partner.logo||"") ? "" : (partner.logo||"").replace(/"/g,"&quot;")}">
        </div>
        <span class="b24x-logo-or">${t("pt.logoOr")}</span>
        <label class="b24x-file b24x-file--btn">
          <input type="file" id="pt-logo-file" accept="image/png,image/jpeg,image/svg+xml,image/webp">
          <span>${t("pt.logoUpload")}</span>
        </label>
      </div>
      <div class="b24x-logo-foot">
        <div class="b24x-logo-preview" id="pt-logo-preview" hidden>
          <img id="pt-logo-thumb" alt="">
          <button type="button" class="b24x-logo-clear" id="pt-logo-clear">${t("pt.logoClear")}</button>
        </div>
        <span class="hint" id="pt-logo-hint">${t("pt.logoHint")}</span>
      </div>
    </div>` : `
    <div class="field">
      <label for="pt-${k}">${t("pt."+k)}</label>
      <div class="in-wrap">
        <input class="b24x-input pt-in" id="pt-${k}" data-pt="${k}"
               type="${k==="email"?"email":k==="site"?"url":"text"}"
               value="${(partner[k]||"").replace(/"/g,"&quot;")}">
      </div>
    </div>`).join("");

  g.querySelectorAll(".pt-in").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      partner[inp.dataset.pt] = inp.value;
      savePartner();
      if(inp.dataset.pt === "logo") applyPartnerLogo();
    });
  });

  const file = document.getElementById("pt-logo-file");
  if(file) file.addEventListener("change", ()=> handleLogoFile(file));

  const clear = document.getElementById("pt-logo-clear");
  if(clear) clear.addEventListener("click", ()=>{
    partner.logo = "";
    savePartner();
    const url = document.getElementById("pt-logo"); if(url) url.value = "";
    const f = document.getElementById("pt-logo-file"); if(f) f.value = "";
    applyPartnerLogo();
    /* Иначе на пустом поле продолжает висеть ошибка от предыдущего файла. */
    logoSay("pt.logoHint");
  });

  applyPartnerLogo();
}

/* ---- LOGO FILE: shrink, then store ---------------------------------------
   Order of the checks is the order of the honest answers. Every exit says what
   is wrong with THIS file, because "too big" told the partner nothing about what
   to do next. */
function logoSay(key, params, isError){
  const hint = document.getElementById("pt-logo-hint");
  if(!hint) return;
  hint.textContent = t(key, params);
  hint.classList.toggle("logo-err", !!isError);
}

/* Draw into a canvas at no more than LOGO_MAX_PX on the long side, then walk an
   encoder ladder from lossless to lossy and stop at the first result that fits.
   PNG goes first so a flat logo with transparency stays pixel-exact; WebP steps
   in only when PNG cannot fit, which in practice means a photographic logo. */
function shrinkImage(img){
  const long = Math.max(img.naturalWidth, img.naturalHeight);
  const k = long > LOGO_MAX_PX ? LOGO_MAX_PX / long : 1;
  const w = Math.max(1, Math.round(img.naturalWidth  * k));
  const h = Math.max(1, Math.round(img.naturalHeight * k));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const cx = c.getContext("2d");
  cx.imageSmoothingQuality = "high";
  cx.drawImage(img, 0, 0, w, h);
  let smallest = null;
  for (const [type, q] of [["image/png", undefined], ["image/webp", 0.92],
                           ["image/webp", 0.85], ["image/webp", 0.75]]) {
    let uri;
    try { uri = c.toDataURL(type, q); } catch(e){ continue; }
    if (uri.indexOf("data:" + type) !== 0) continue;      // type not supported
    const bytes = b64Bytes(uri);
    if (!smallest || bytes < smallest.bytes) smallest = {uri, bytes, w};
    if (bytes <= LOGO_STORE_MAX) return {uri, bytes, w, fits: true};
  }
  return smallest ? {...smallest, fits: false} : null;
}

/* info = {px, bytes, resized, forStorage}. The message names the REAL reason the
   file changed: pixels alone (the reports never need more than LOGO_MAX_PX) or
   storage (the original would not fit in localStorage). Saying "so it fits your
   storage" about a 25 KB file that fitted all along is exactly the kind of
   message this rewrite is meant to remove. */
function storeLogo(uri, info){
  partner.logo = uri;
  const url = document.getElementById("pt-logo");
  if(url) url.value = "";                       // the file wins over the link
  const kept = savePartner();
  applyPartnerLogo();
  const p = {px: info.px, kb: kbText(info.bytes)};
  /* SVG не имеет пиксельного размера как факта — сообщение про px для него
     бессмысленно, поэтому у него своя строка без размера. */
  if(kept && info.px == null && !info.resized){
    logoSay("pt.logoReadySvg", {kb: p.kb});
    return;
  }
  if(!kept)              logoSay("pt.logoStoreFull", null, true);
  else if(info.forStorage) logoSay("pt.logoShrunk", p);
  else if(info.resized)    logoSay("pt.logoScaled", p);
  else                     logoSay("pt.logoReady",  p);
}

function handleLogoFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const ext = (f.name.split(".").pop() || "file").toLowerCase();
  const done = () => { input.value = ""; };     // same file can be picked again

  const isSvg = f.type === "image/svg+xml" || ext === "svg";
  if(!/^image\//.test(f.type) && !isSvg){
    logoSay("pt.logoNotImage", {type: f.type || ext}, true);
    return done();
  }
  if(f.size > LOGO_INPUT_MAX){
    logoSay("pt.logoHuge", {mb: (f.size/1048576).toFixed(1),
                            maxmb: Math.round(LOGO_INPUT_MAX/1048576)}, true);
    return done();
  }

  const fr = new FileReader();
  fr.onerror = () => { logoSay("pt.logoBroken", {ext}, true); done(); };
  fr.onload = () => {
    const uri = String(fr.result);
    /* SVG is markup, not pixels: there is nothing to resample. Either it fits or
       it carries an embedded bitmap, and then the honest answer is to say so. */
    if(isSvg){
      const bytes = b64Bytes(uri);
      if(bytes > LOGO_STORE_MAX){
        logoSay("pt.logoSvgTooBig", {kb: kbText(bytes),
                                     max: Math.round(LOGO_STORE_MAX/1024)}, true);
        return done();
      }
      storeLogo(uri, {px: null, bytes, resized: false, forStorage: false});
      return done();
    }
    const img = new Image();
    img.onerror = () => { logoSay("pt.logoBroken", {ext}, true); done(); };
    img.onload = () => {
      const asIs = b64Bytes(uri);
      if(img.naturalWidth <= LOGO_MAX_PX && img.naturalHeight <= LOGO_MAX_PX
         && asIs <= LOGO_STORE_MAX){
        storeLogo(uri, {px: img.naturalWidth, bytes: asIs,
                        resized: false, forStorage: false});   // keep it untouched
        return done();
      }
      const small = shrinkImage(img);
      if(!small){ logoSay("pt.logoBroken", {ext}, true); return done(); }
      if(!small.fits){
        logoSay("pt.logoStillTooBig", {px: small.w, kb: kbText(small.bytes),
                                       max: Math.round(LOGO_STORE_MAX/1024)}, true);
        return done();
      }
      storeLogo(small.uri, {px: small.w, bytes: small.bytes, resized: true,
                            forStorage: asIs > LOGO_STORE_MAX});
      done();
    };
    img.src = uri;
  };
  fr.readAsDataURL(f);
}

/* Paint the partner mark wherever it belongs, or hide it so no gap is left.
   Never touches the Bitrix24 lockup. */
function applyPartnerLogo(){
  const src = (partner.logo || "").trim();
  ["hdr-partner-logo","foot-partner-logo"].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(src){ el.src = src; el.alt = partner.company ? partner.company + " logo" : "Partner logo"; el.hidden = false; }
    else { el.removeAttribute("src"); el.hidden = true; }
  });
  const prev = document.getElementById("pt-logo-preview");
  const thumb = document.getElementById("pt-logo-thumb");
  if(prev && thumb){
    /* hidden has to be CLEARED on every new source, not only set. A broken link
       typed before the upload fires onerror below, which hides the thumb; without
       this the preview then stayed an empty box with a lone "remove" next to it,
       even though the uploaded file was perfectly good. */
    if(src){ thumb.src = src; thumb.hidden = false; prev.hidden = false; }
    else { thumb.removeAttribute("src"); thumb.hidden = false; prev.hidden = true; }
  }
  /* a broken link should not leave a dead image icon next to the lockup */
  ["hdr-partner-logo","foot-partner-logo","pt-logo-thumb"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onerror = () => { el.hidden = true; if(id==="pt-logo-thumb"){
      const p=document.getElementById("pt-logo-preview"); if(p) p.hidden = true; } };
  });
}
