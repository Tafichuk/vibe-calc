<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Value Calculator — Bitrix24</title>
<link rel="stylesheet" href="css/brand-ext.css">
<style>
@font-face{ font-family:'Montserrat'; font-weight:100 900; font-style:normal;
  src:url("assets/fonts/Montserrat-VariableFont_wght.ttf") format('truetype-variations');
  font-display:swap; }

:root{
  --b24-cyan:#2FC7F7; --b24-blue:#409EEF; --b24-deep:#0066A1; --b24-green:#BDF300;
  --b24-grad-brand:linear-gradient(135deg,#2FC7F7 0%,#409EEF 100%);
  --b24-deep-2:#004E7C;
  --b24p-deep:#063883; --b24p-light:#EFFBFF; --b24p-green:#BDF300;
  --b24p-deep-2:#04213F; --b24p-deep-hi:#0A63A6;
  --b24-grad-partner-navy:radial-gradient(130% 130% at 45% 30%,#0A63A6 0%,#005E98 28%,#00457C 54%,#063159 78%,#04213F 100%);
  --b24-grad-partner-light:linear-gradient(160deg,#F6FDFF 0%,#EFFBFF 55%,#DBF2FC 100%);
  --b24-lime:var(--b24-green); --b24-lime-ink:var(--b24-deep);
  --b24-page-cool:#F4FAFE; --b24-page-sky:#DCF2FE; --b24-card:#E9F5FD;
  --b24-card-2:#DDEEFB; --b24-white:#FFFFFF; --b24-line:#C8E6F6; --b24-dashed:#6EC0EC;
  --b24-text:#143A57; --b24-text-mute:#5E86A3; --b24-on-navy:#FFFFFF; --b24-on-navy-soft:#B9E2F7;
  --b24-r-card:22px; --b24-r-inner:16px; --b24-r-tile:14px; --b24-r-pill:999px;
  --b24-s1:4px; --b24-s2:8px; --b24-s3:12px; --b24-s4:16px; --b24-s5:20px;
  --b24-s6:24px; --b24-s8:32px; --b24-s10:40px; --b24-s12:48px; --b24-s16:64px;
  --b24-shadow-card:0 10px 30px rgba(0,102,161,.12);
  --b24-shadow-navy:0 14px 34px rgba(0,78,124,.30);
  --b24-font-display:'Montserrat',system-ui,'Segoe UI',Arial,sans-serif;
  --b24-font-body:'Montserrat',system-ui,'Segoe UI',Arial,sans-serif;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:76px;
  scroll-padding-bottom:calc(var(--b24x-navbar-h, 96px) + var(--b24-s5))}
body{
  margin:0; font-family:var(--b24-font-body); color:var(--b24-text);
  background:var(--b24-page-cool); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px; margin:0 auto; padding:0 var(--b24-s6)}
section{scroll-margin-top:76px}

:focus-visible{outline:3px solid var(--b24-cyan); outline-offset:2px; border-radius:6px}

.hdr{position:sticky; top:0; z-index:40; background:var(--b24-white);
  border-bottom:1px solid var(--b24-line); box-shadow:0 2px 10px rgba(0,102,161,.10)}
.hdr-in{display:flex; align-items:center; gap:var(--b24-s5); padding:var(--b24-s3) 0}
.hdr-sp{flex:1}
.switch{display:inline-flex; background:var(--b24-card); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-pill); padding:3px}
.switch button{
  appearance:none; border:0; background:transparent; cursor:pointer;
  font:600 13px/1 var(--b24-font-body); color:var(--b24-text-mute);
  padding:8px 14px; border-radius:var(--b24-r-pill);
}
.switch button[aria-pressed="true"]{background:var(--b24-white); color:var(--b24p-deep);
  box-shadow:0 1px 3px rgba(0,102,161,.18)}
.sw-lab{font:600 12px/1 var(--b24-font-body); color:var(--b24-text-mute);
  text-transform:uppercase; letter-spacing:.06em; margin-right:var(--b24-s2)}
.real-strip .field{gap:var(--b24-s2)}
.real-strip .switch{align-self:flex-start; flex-wrap:wrap}
.real-strip .hint{max-width:88ch}
@media (max-width:560px){ .real-strip .switch{width:100%}
  .real-strip .switch button{flex:1 1 auto} }

.hero{background:var(--b24-grad-partner-navy); color:var(--b24-on-navy);
  padding:var(--b24-s12) 0 var(--b24-s10)}
.hero h1{font:800 clamp(30px,4.2vw,50px)/1.12 var(--b24-font-display); margin:0 0 var(--b24-s4);
  letter-spacing:-.01em; max-width:26ch}
.hero p{margin:0; color:var(--b24-on-navy-soft); font-size:17px; max-width:70ch}

section{padding:var(--b24-s12) 0}
.sec-h{font:700 13px/1 var(--b24-font-body); text-transform:uppercase; letter-spacing:.1em;
  color:var(--b24-deep); margin:0 0 var(--b24-s3)}
.sec-h--accent{display:inline-block; background:var(--b24-green);
  color:var(--b24-lime-ink); border-radius:var(--b24-r-pill); padding:6px 14px}
h2{font:700 clamp(20px,2.4vw,28px)/1.2 var(--b24-font-display); margin:0 0 var(--b24-s6);
  color:var(--b24p-deep)}
.note-line{font-size:13.5px; color:var(--b24-text); margin:0 0 var(--b24-s6); max-width:80ch}

.card{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); box-shadow:var(--b24-shadow-card); padding:var(--b24-s6)}
.grid-co{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--b24-s5) var(--b24-s5)}
@media (max-width:860px){ .grid-co{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .grid-co{grid-template-columns:1fr} }

.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:13px; font-weight:600; color:var(--b24-text)}
.field .hint{font-size:12px; color:var(--b24-text)}
.in-wrap{position:relative; display:flex; align-items:center}
.in-wrap[hidden]{display:none}
.in-wrap input{width:100%}
.in-wrap .suf{position:absolute; right:14px; font-size:12.5px; color:var(--b24-text);
  pointer-events:none; font-weight:600}
.in-wrap input{padding-right:64px}
.in-wrap[data-suf="calls"] input, .in-wrap[data-suf="ops"] input,
.in-wrap[data-suf="enq"] input, .in-wrap[data-suf="lookups"] input,
.in-wrap[data-suf="bookings"] input, .in-wrap[data-suf="docs"] input,
.in-wrap[data-suf="meetings"] input{padding-right:100px}
.field .err{display:none; font-size:12px; color:var(--b24x-error-ink); font-weight:600}
.field.invalid .err{display:block}
body[data-mode="quick"] main > section:not(#quick){display:none}
body[data-mode="quick"] .navbar{display:none}
body:not([data-mode="quick"]) #quick{display:none}
.b24x-q-card{padding:var(--b24-s7)}
.b24x-q-fields{display:grid; gap:var(--b24-s5);
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.b24x-q-out{display:grid; gap:var(--b24-s5); margin:var(--b24-s7) 0 var(--b24-s5);
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  padding:var(--b24-s6) 0; border-top:1px solid var(--b24-line);
  border-bottom:1px solid var(--b24-line)}
.b24x-q-fig{display:flex; flex-direction:column; gap:6px}
.b24x-q-n{font:700 34px/1.05 var(--b24-font-display); color:var(--b24p-deep);
  font-variant-numeric:tabular-nums}
.b24x-q-l{font-size:13px; color:var(--b24-text)}
.b24x-q-cta{display:flex; flex-wrap:wrap; gap:var(--b24-s3); align-items:center;
  margin-top:var(--b24-s6)}
.b24x-preset-card{margin-bottom:var(--b24-s6)}
.b24x-preset-row{display:flex; flex-wrap:wrap; gap:var(--b24-s2); margin-top:var(--b24-s3)}
.b24x-preset-row .b24x-preset-clear{margin-left:auto}
@media (max-width:640px){ .b24x-preset-row .b24x-preset-clear{margin-left:0} }
.b24x-print-check{border:1px solid var(--b24-line); border-radius:var(--b24-r-inner);
  padding:10px 12px; background:var(--b24-card)}
.b24x-print-check b{color:var(--b24-deep); font-weight:700}
.b24x-scope-field{grid-column:1/-1}
.b24x-scope-field textarea{width:100%; resize:vertical; min-height:76px;
  font:inherit; line-height:1.45; padding:10px 12px}
.est-btn{border:0; font:inherit; cursor:pointer; text-transform:inherit; letter-spacing:inherit}
.est:not(.est--check){text-decoration:underline dotted; text-underline-offset:3px;
  text-decoration-thickness:1px}
.est-btn:hover{text-decoration:underline; text-underline-offset:3px}
.est-btn:focus-visible{outline:2px solid var(--b24-cyan); outline-offset:1px}
.est{display:inline-block; background:none; color:var(--b24-text);
  padding:2px 4px; font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:.05em; margin-left:6px; vertical-align:1px}
.est--check{color:var(--b24x-warning-ink); border-radius:var(--b24-r-pill);
  padding:2px 8px; box-shadow:inset 0 0 0 1px var(--b24x-warning-ink)}

.rev-toggle{display:flex; align-items:center; gap:10px; cursor:pointer;
  font-size:13px; font-weight:600; color:var(--b24-text); min-height:48px}
.rev-toggle input{width:20px; height:20px; accent-color:var(--b24-deep); cursor:pointer}
.btn-primary{appearance:none; border:0; cursor:pointer; background:var(--b24p-deep);
  color:var(--b24-white); border-radius:var(--b24-r-pill); padding:13px 26px;
  font:700 14px var(--b24-font-body)}
.btn-primary:hover{background:var(--b24p-deep-hi)}
.svc-in{width:130px; text-align:right}
.svc-in::placeholder{font-size:12px; font-weight:500}
.cov-row{display:flex; gap:var(--b24-s5); align-items:flex-start; flex-wrap:wrap;
  background:var(--b24-page-cool); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-inner); padding:var(--b24-s4); margin-top:var(--b24-s4)}
.cov-hint{margin:0; font-size:12.5px; color:var(--b24-text); flex:1; min-width:240px}
.cov-hint--none{background:var(--b24-page-cool); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-inner); padding:var(--b24-s3) var(--b24-s4);
  margin-top:var(--b24-s4)}
.cov-in{width:90px; text-align:right}
.overlap-warn{grid-column:1/-1; display:flex; gap:var(--b24-s3); align-items:flex-start;
  background:var(--b24x-warning-surface); color:var(--b24x-warning-ink);
  border:1px solid currentColor; border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-top:var(--b24-s4); font-size:13.5px}
.overlap-warn img{width:20px; height:20px; flex:0 0 auto; margin-top:1px}
.overlap-note{grid-column:1/-1; background:transparent; color:var(--b24-on-navy-soft);
  border:1px solid rgba(255,255,255,.28); border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-top:var(--b24-s4); font-size:13px}
.overlap-note b{color:var(--b24-on-navy); font-weight:600}
.warn-src{display:block; margin-top:var(--b24-s2); font-size:12px; opacity:.82}
.sum-invalid{display:flex; gap:var(--b24-s3); align-items:flex-start;
  background:var(--b24x-warning-surface); color:var(--b24x-warning-ink);
  border:1px solid currentColor; border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-bottom:var(--b24-s4); font-size:13.5px}
.sum-invalid img{width:20px; height:20px; flex:0 0 auto; margin-top:1px}
.hdr .switch[hidden], .hdr .sw-lab[hidden]{display:none}

.sc{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); box-shadow:var(--b24-shadow-card);
  margin-bottom:var(--b24-s5); overflow:hidden}
.sc-top{display:flex; gap:var(--b24-s4); padding:var(--b24-s5) var(--b24-s6);
  align-items:flex-start; cursor:pointer}
.sc-top:hover{background:var(--b24-page-cool)}

.sc.on{box-shadow:0 0 0 2px var(--b24-cyan), var(--b24-shadow-card)}
.sc.on .sc-top{background:var(--b24-card)}
.sc.on .sc-top:hover{background:var(--b24-card-2)}
.sc-num{flex:0 0 auto; min-width:26px; height:26px; padding:0 7px; border-radius:var(--b24-r-pill);
  background:var(--b24-card); color:var(--b24-deep); font:800 13px/26px var(--b24-font-display);
  text-align:center; margin-top:1px}
.sc.on .sc-num{background:var(--b24-green); color:var(--b24-lime-ink)}
.sc-cb{flex:0 0 auto; margin-top:3px; width:22px; height:22px; accent-color:var(--b24-deep)}
.sc-ttl{flex:1}
.sc-ttl h3{margin:0 0 4px; font:700 17px/1.3 var(--b24-font-display); color:var(--b24p-deep)}
.sc-ttl p{margin:0; font-size:13.5px; color:var(--b24-text)}
.sc-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--b24-s3)}
.tag{background:var(--b24-card); color:var(--b24-deep); border-radius:var(--b24-r-pill);
  padding:3px 10px; font-size:11.5px; font-weight:700;
  box-shadow:inset 0 0 0 1px var(--b24-line)}
.tag--plan{background:transparent; color:var(--b24-deep);
  box-shadow:inset 0 0 0 1px var(--b24-deep)}
.tag--est{background:transparent; color:var(--b24x-warning-ink);
  box-shadow:inset 0 0 0 1px var(--b24x-warning-ink)}
.tag-link{align-self:center; font-size:11.5px; font-weight:700;
  color:var(--b24-deep); text-decoration:none}
.tag-link:hover{text-decoration:underline}
.tag-link:focus-visible{outline:2px solid var(--b24-cyan); outline-offset:2px;
  border-radius:var(--b24-r-inner)}
.sc-body{display:none; padding:0 var(--b24-s6) var(--b24-s6); border-top:1px solid var(--b24-line)}
.sc.on .sc-body{display:block}
.res-note{font-size:12.5px; color:var(--b24-text-mute); margin-top:var(--b24-s2)}
.sc-note{background:var(--b24-card); border-radius:var(--b24-r-inner);
  padding:var(--b24-s3) var(--b24-s4); font-size:12.5px; margin:var(--b24-s4) 0 0}
.sc-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
  gap:var(--b24-s5); margin-top:var(--b24-s5)}
@media (max-width:860px){ .sc-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .sc-grid{grid-template-columns:1fr} }
.seg{border:1px dashed var(--b24-dashed); border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-top:var(--b24-s4)}
.seg-h{font-size:12px; font-weight:700; color:var(--b24-deep); text-transform:uppercase;
  letter-spacing:.06em; margin-bottom:var(--b24-s3);
  display:flex; align-items:center; justify-content:space-between; gap:var(--b24-s3)}
.btn-add{appearance:none; background:transparent; border:1px dashed var(--b24-dashed);
  color:var(--b24-deep); border-radius:var(--b24-r-pill); padding:8px 16px;
  font:600 13px var(--b24-font-body); cursor:pointer; margin-top:var(--b24-s4)}
.btn-add:hover{background:var(--b24-card)}

.res{margin-top:var(--b24-s5); border-top:1px solid var(--b24-line); padding-top:var(--b24-s4)}
.res-row{display:flex; justify-content:space-between; gap:var(--b24-s4);
  padding:7px 0; font-size:13.5px; border-bottom:1px solid var(--b24-page-cool)}
.res-row:last-child{border-bottom:0}
.res-row .lbl{color:var(--b24-text)}
.res-row .val{font-weight:700; color:var(--b24p-deep); white-space:nowrap}
.res-row .val.rev{color:var(--b24-deep)}
.bd{background:var(--b24-page-cool); border-radius:var(--b24-r-inner);
  padding:var(--b24-s3) var(--b24-s4); font-size:12.5px; margin-bottom:var(--b24-s3)}
.bd div{display:flex; justify-content:space-between; gap:var(--b24-s4); padding:2px 0}
.int-in{width:120px; text-align:right}
.info-btn{appearance:none; background:transparent; border:0; cursor:pointer; padding:2px;
  color:var(--b24-deep); width:22px; height:22px; vertical-align:-5px}
.info-btn svg{width:16px; height:16px}

.sum{background:var(--b24-grad-partner-navy); color:var(--b24-on-navy);
  border-radius:var(--b24-r-card); padding:var(--b24-s8); box-shadow:var(--b24-shadow-navy)}
.sum h2{color:var(--b24-on-navy); margin-bottom:var(--b24-s5)}
.sum-grid{display:grid; grid-template-columns:1fr auto auto; gap:10px var(--b24-s6); align-items:center}
.sum-grid .h{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--b24-on-navy-soft); text-align:right}
.sum-grid .h:first-child{text-align:left}
.sum-grid .lbl{font-size:14px}
.sum-grid .num{text-align:right; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums}
.sum-line{grid-column:1/-1; height:1px; background:rgba(255,255,255,.22); margin:var(--b24-s3) 0}
.fullrow{grid-column:1/-1; display:flex; justify-content:space-between; gap:var(--b24-s4);
  font-size:14px; align-items:baseline}
.fullrow .v{font-weight:700; white-space:nowrap}
.fullrow.net{font-size:17px; font-weight:800}
.verdict{grid-column:1/-1; display:flex; gap:var(--b24-s3); align-items:flex-start;
  background:var(--b24-green); color:var(--b24-lime-ink); border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-top:var(--b24-s4); font-size:14px; font-weight:600}
.verdict img{width:20px; height:20px; flex:0 0 auto; margin-top:1px}
.verdict.neg{background:rgba(255,255,255,.14); color:var(--b24-on-navy);
  border:1px solid rgba(255,255,255,.28)}
.sum .empty{color:var(--b24-on-navy-soft); font-size:14px}
.fot-meaning{grid-column:1/-1; font-size:12.5px; color:var(--b24-on-navy-soft);
  margin:-2px 0 var(--b24-s2); max-width:78ch}
.fot-real b{color:var(--b24-on-navy); font-weight:700}
.hint.logo-err{color:var(--b24x-warning-ink); font-weight:600}
.qual{grid-column:1/-1; font-size:13px; color:var(--b24-on-navy-soft); margin-top:var(--b24-s3)}

.tr-grid{display:grid; grid-template-columns:1fr auto 1fr; gap:var(--b24-s5); align-items:stretch}
.tr-col{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); padding:var(--b24-s5)}
.tr-col.to{background:var(--b24-grad-partner-light); border-color:var(--b24-dashed)}
.tr-k{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--b24-text-mute); margin-bottom:6px}
.tr-name{font:700 18px/1.25 var(--b24-font-display); color:var(--b24p-deep); margin-bottom:var(--b24-s3)}
.tr-price{font:800 26px/1 var(--b24-font-display); color:var(--b24p-deep);
  font-variant-numeric:tabular-nums}
.tr-per{font-size:12.5px; color:var(--b24-text); margin-top:4px}
.tr-arrow{display:flex; align-items:center; justify-content:center; color:var(--b24-deep)}
.tr-arrow svg{width:30px; height:30px}
.tr-rows{margin-top:var(--b24-s4); border-top:1px solid var(--b24-line); padding-top:var(--b24-s3)}
.tr-rows div{display:flex; justify-content:space-between; gap:var(--b24-s4); font-size:13px; padding:3px 0}
.tr-rows b{color:var(--b24p-deep)}
.partner-only{display:inline-flex; align-items:center; gap:6px; background:var(--b24-green);
  color:var(--b24-lime-ink); border-radius:var(--b24-r-pill); padding:3px 10px;
  font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em}
.gap-card{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); padding:var(--b24-s5); margin-top:var(--b24-s5)}
.gap-rows{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:var(--b24-s4); margin-top:var(--b24-s4)}
.gap-box{background:var(--b24-page-cool); border-radius:var(--b24-r-inner); padding:var(--b24-s4)}
.gap-n{font:800 24px/1 var(--b24-font-display); color:var(--b24p-deep)}
.gap-l{font-size:12.5px; color:var(--b24-text); margin-top:6px}
.ai-list{list-style:none; margin:var(--b24-s4) 0 0; padding:0; display:grid; gap:10px}
.ai-list li{display:flex; gap:10px; align-items:flex-start; font-size:13.5px}
.ai-list img{width:18px; height:18px; flex:0 0 auto; margin-top:2px}

.warn{background:var(--b24x-warning-surface); color:var(--b24x-warning-ink);
  border:1px solid currentColor; border-radius:var(--b24-r-inner);
  padding:var(--b24-s3) var(--b24-s4); font-size:13px; font-weight:600;
  display:flex; gap:10px; align-items:flex-start; margin-bottom:var(--b24-s5)}
.warn img{width:18px; height:18px; flex:0 0 auto; margin-top:1px}
.warn[hidden]{display:none}
.warn-list{margin:var(--b24-s2) 0 0; padding-left:18px; font-weight:500}
.warn-list li{margin:2px 0}

.br-text{display:block; width:100%; height:auto; min-height:340px;
  padding:var(--b24-s4); font:13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  resize:vertical; white-space:pre; overflow-wrap:normal; overflow-x:auto}
.br-in{display:block; width:100%; height:auto; min-height:260px;
  padding:var(--b24-s4); font:13px/1.6 var(--b24-font-body); resize:vertical}
.br-sub{max-width:520px}
.br-back{margin-top:var(--b24-s8); border-top:1px solid var(--b24-line);
  padding-top:var(--b24-s6)}
.br-back h3{margin:0 0 var(--b24-s2); font:700 16px/1.3 var(--b24-font-display)}
.br-rev{margin-top:var(--b24-s5); display:grid; grid-template-columns:auto 1fr auto;
  gap:var(--b24-s2) var(--b24-s4); align-items:baseline; font-size:13.5px}
.br-rev .n{font-weight:700; color:var(--b24-text-mute); font-variant-numeric:tabular-nums}
.br-rev .v{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.br-rev .v--none{color:var(--b24-text-mute); font-weight:600}
.br-rev .v--many{color:var(--b24x-warning-ink)}
.br-rev--dim .q{color:var(--b24-text-mute)}
@media (max-width:560px){
  .br-rev{grid-template-columns:auto 1fr; }
  .br-rev .v{grid-column:2; }
}

.navbar{position:sticky; bottom:0; z-index:30; background:var(--b24-grad-partner-navy);
  color:var(--b24-on-navy); box-shadow:0 -8px 24px rgba(0,78,124,.24)}
.navbar-in{display:flex; align-items:center; gap:var(--b24-s3) var(--b24-s5);
  padding:var(--b24-s3) var(--b24-s6); flex-wrap:wrap}
.navbar .cnt{font-size:13px; color:var(--b24-on-navy-soft); font-weight:600}

.nav-tot{display:flex; align-items:flex-end; gap:var(--b24-s2) var(--b24-s4);
  flex-wrap:wrap; min-width:0}
.nav-k{font-size:12.5px; font-weight:600; color:var(--b24-on-navy-soft); align-self:center}
.nav-fig{display:flex; flex-direction:column; gap:2px; min-width:0}
.nav-fig i{font-style:normal; font:700 10.5px/1.2 var(--b24-font-body);
  letter-spacing:.09em; text-transform:uppercase; color:var(--b24-on-navy-soft)}
.nav-fig b{background:var(--b24-green); color:var(--b24-lime-ink);
  border-radius:var(--b24-r-pill); padding:2px 12px; white-space:nowrap;
  font:800 22px/1.3 var(--b24-font-display); font-variant-numeric:tabular-nums;
  display:inline-block}
.nav-fig .l-long{display:none}

@media (max-width:560px){
  .navbar-in{gap:var(--b24-s1) var(--b24-s3); padding:var(--b24-s2) var(--b24-s6)}
  .hdr-sp{display:none}
  .nav-tot{display:contents}
  .navbar .cnt{flex:0 1 auto; font-size:11px; line-height:1.3}
  .nav-k{display:inline; order:-1; font-size:11px; line-height:1.3}
  .nav-fig .l-short{display:inline}
  .nav-fig .l-long{display:none}
  .nav-fig{flex-direction:row; align-items:baseline; gap:6px}
  .nav-fig i{font-size:9px; letter-spacing:.05em}
  .nav-fig b{font-size:17px; padding:1px 9px; line-height:1.3}
  .nav-fig--wide{flex:1 1 100%}
  .nav-fig--wide .l-short{display:none}
  .nav-fig--wide .l-long{display:inline}
}

.ov{position:fixed; inset:0; background:rgba(4,33,63,.55); display:flex;
  align-items:center; justify-content:center; padding:var(--b24-s5); z-index:60}
.ov[hidden]{display:none}
.mdl{background:var(--b24-white); border-radius:var(--b24-r-card); max-width:560px;
  width:100%; padding:var(--b24-s8); position:relative; max-height:85vh; overflow:auto}
.mdl h3{margin:0 0 var(--b24-s3); font:700 20px var(--b24-font-display); color:var(--b24p-deep)}
.mdl p{margin:0; font-size:14px}
.mdl-x{position:absolute; top:12px; right:12px; appearance:none; background:var(--b24-card);
  border:0; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:20px;
  color:var(--b24-deep); line-height:1}

main.wrap{padding-bottom:calc(var(--b24x-navbar-h, 96px) + var(--b24-s5))}
.foot{padding:var(--b24-s8) 0 var(--b24-s10); font-size:12.5px; color:var(--b24-text)}


@media (max-width:820px){
  .tr-grid{grid-template-columns:1fr}
  .tr-arrow{transform:rotate(90deg)}
  .sum-grid{grid-template-columns:1fr auto}
  .sum-grid .h.year,.sum-grid .num.year{display:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <div class="b24x-cobrand">
      <a class="b24x-cobrand__b24" href="#top"><img src="assets/logo-partner-h.png" alt="Bitrix24 Partners"></a>
      <img class="b24x-cobrand__partner" id="hdr-partner-logo" alt="" hidden>
    </div>
    <div class="hdr-sp"></div>
    <span class="sw-lab" data-i18n="ui.lang" hidden></span>
    <div class="switch" id="sw-lang" role="group" hidden>
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
    </div>
    <span class="sw-lab" data-i18n="ui.cur" hidden></span>
    <div class="switch" id="sw-cur" role="group" hidden>
      <button type="button" data-cur="EUR" aria-pressed="true">EUR</button>
      <button type="button" data-cur="USD" aria-pressed="false">USD</button>
    </div>
  </div>
</header>

<div class="hero" id="top">
  <div class="wrap">
    <h1 id="hero-t" data-i18n="ui.heroTitle"></h1>
    <p id="hero-s" data-i18n="ui.heroSub"></p>
  </div>
</div>

<main class="wrap">

  <div class="warn" id="warn-de" hidden>
    <img src="assets/icons/alert.svg" alt=""><span data-i18n="ui.deStub"></span>
  </div>

  <section id="quick" hidden>
    <div class="card b24x-q-card">
      <div class="b24x-q-fields">
        <div class="field" data-field="co-empCount">
          <label for="q-emp" data-i18n="ui.qEmp"></label>
          <div class="in-wrap">
            <input class="b24x-input q-in" id="q-emp" data-q="empCount" type="text" inputmode="decimal">
            <span class="suf" id="q-emp-suf"></span>
          </div>
          <span class="err"></span>
        </div>
        <div class="field" data-field="co-empSal">
          <label for="q-sal" data-i18n="ui.qSal"></label>
          <div class="in-wrap">
            <input class="b24x-input q-in" id="q-sal" data-q="empSal" type="text" inputmode="decimal">
            <span class="suf" id="q-sal-suf"></span>
          </div>
          <span class="err"></span>
        </div>
        <div class="field">
          <label for="q-ind" data-i18n="ui.qInd"></label>
          <select class="b24x-input" id="q-ind"></select>
        </div>
        <div class="field">
          <label for="q-plan" data-i18n="ui.qPlan"></label>
          <select class="b24x-input" id="q-plan"></select>
        </div>
      </div>

      <div class="b24x-q-out" id="q-out">
        <div class="b24x-q-fig"><span class="b24x-q-n" id="q-fot">—</span>
          <span class="b24x-q-l" data-i18n="ui.qFot"></span></div>
        <div class="b24x-q-fig"><span class="b24x-q-n" id="q-hours">—</span>
          <span class="b24x-q-l" data-i18n="ui.qHours"></span></div>
        <div class="b24x-q-fig"><span class="b24x-q-n" id="q-fte">—</span>
          <span class="b24x-q-l" data-i18n="ui.qFte"></span></div>
      </div>
      <p class="note-line" id="q-counted"></p>
      <p class="hint" id="q-cost"></p>
      <p class="hint" id="q-assume" data-i18n="ui.qAssume"></p>

      <div class="b24x-q-cta">
        <button type="button" class="btn-primary" id="q-cta" data-i18n="ui.qCta"></button>
        <button type="button" class="b24x-btn-ghost" id="q-full" data-i18n="ui.qFull"></button>
      </div>
      <p class="hint" style="margin:var(--b24-s3) 0 0" data-i18n="ui.qCtaHint"></p>
      <div class="in-wrap" id="q-link-box" hidden style="margin-top:var(--b24-s3)">
        <input class="b24x-input" id="q-link-out" type="text" readonly>
      </div>
      <p class="hint" id="q-link-msg" style="margin:var(--b24-s2) 0 0" hidden></p>
    </div>
  </section>

  <section id="company">
    <div class="sec-h" data-i18n="ui.step1"></div>
    <h2 data-i18n="ui.companyH"></h2>
    <p class="note-line" data-i18n="ui.companyNote"></p>
    <div class="card">
      <div class="grid-co b24x-field-row" id="co-grid"></div>
      <div class="real-strip" style="margin-top:var(--b24-s5); border-top:1px solid var(--b24-line); padding-top:var(--b24-s5)">
        <div class="field">
          <label id="real-lab" data-i18n="ui.realLabel"></label>
          <div class="switch" id="sw-real" role="group" aria-labelledby="real-lab">
            <button type="button" data-real="conservative" aria-pressed="true"></button>
            <button type="button" data-real="expected" aria-pressed="false"></button>
            <button type="button" data-real="optimistic" aria-pressed="false"></button>
          </div>
          <span class="hint" data-i18n="ui.realHint"></span>
        </div>
      </div>
      <div class="grid-co b24x-field-row" style="margin-top:var(--b24-s5); border-top:1px solid var(--b24-line); padding-top:var(--b24-s5)">
        <div class="field" data-field="burden">
          <label for="burden"><span data-i18n="ui.burden"></span></label>
          <div class="in-wrap">
            <input class="b24x-input" id="burden" type="text" inputmode="decimal"
                   role="spinbutton" aria-valuemin="0" aria-valuemax="200" data-min="0" data-max="200">
            <span class="suf">%</span>
          </div>
          <span class="err"></span>
          <span class="hint" data-i18n="ui.burdenHint"></span>
        </div>
        <div class="field" data-field="days">
          <label for="days"><span data-i18n="ui.days"></span></label>
          <div class="in-wrap">
            <input class="b24x-input" id="days" type="text" inputmode="decimal"
                   role="spinbutton" aria-valuemin="1" aria-valuemax="31" data-min="1" data-max="31">
            <span class="suf" data-i18n="suf.days"></span>
          </div>
          <span class="err"></span>
          <span class="hint" data-i18n="ui.daysHint"></span>
        </div>
        <div class="field">
          <label data-i18n="ui.revToggleLabel"></label>
          <label class="rev-toggle" for="show-rev">
            <input type="checkbox" id="show-rev">
            <span data-i18n="ui.showRevenue"></span>
          </label>
          <span class="hint" data-i18n="ui.showRevenueHint"></span>
        </div>
      </div>
    </div>
  </section>

  <section id="partner-details">
    <div class="sec-h" data-i18n="ui.step2"></div>
    <h2 data-i18n="ui.partnerH"></h2>
    <p class="note-line" data-i18n="ui.partnerNote"></p>
    <div class="card">
      <div class="grid-co b24x-field-row" id="pt-grid"></div>
    </div>
  </section>

  <section id="scenarios">
    <div class="sec-h" data-i18n="ui.step3"></div>
    <h2 data-i18n="ui.scenariosH"></h2>
    <p class="note-line" data-i18n="ui.scenariosNote"></p>
    <div class="card b24x-preset-card">
      <span class="b24x-save-h" data-i18n="ui.presetH"></span>
      <div class="b24x-preset-row" id="preset-row"></div>
      <p class="hint" style="margin:var(--b24-s3) 0 0" data-i18n="ui.presetNote"></p>
      <p class="hint" id="preset-msg" style="margin:var(--b24-s2) 0 0" hidden></p>
    </div>
    <div id="groups"></div>
  </section>

  <section id="brief">
    <div class="sec-h" data-i18n="ui.brWhen"></div>
    <h2 data-i18n="ui.brH"></h2>
    <p class="note-line" data-i18n="ui.brNote"></p>
    <div class="card">
      <p class="hint" id="br-empty" data-i18n="ui.brEmpty" hidden></p>
      <div id="br-body" hidden>
        <p class="hint" id="br-count"></p>
        <p class="hint" id="br-omitted" hidden></p>
        <div class="field br-sub">
          <label for="br-subj" data-i18n="ui.brSubj"></label>
          <div class="in-wrap">
            <input class="b24x-input" id="br-subj" type="text" readonly>
          </div>
        </div>
        <div class="field" style="margin-top:var(--b24-s4)">
          <label for="br-out" data-i18n="ui.brBody"></label>
          <textarea class="b24x-input br-text" id="br-out" readonly spellcheck="false"></textarea>
        </div>
        <div class="b24x-q-cta">
          <button type="button" class="btn-primary" id="br-copy" data-i18n="ui.brCopy"></button>
        </div>
        <p class="hint" id="br-copy-msg" style="margin:var(--b24-s2) 0 0" hidden></p>

        <div class="warn" style="margin:var(--b24-s6) 0 0">
          <img src="assets/icons/alert.svg" alt="">
          <span><b data-i18n="ui.brSalH"></b><br><span data-i18n="ui.brSalBody"></span></span>
        </div>

        <div class="br-back">
          <h3 data-i18n="ui.brBackH"></h3>
          <p class="hint" data-i18n="ui.brBackNote"></p>
          <textarea class="b24x-input br-in" id="br-in" spellcheck="false"></textarea>
          <div class="b24x-q-cta">
            <button type="button" class="b24x-btn-ghost" id="br-read" data-i18n="ui.brRead"></button>
            <button type="button" class="btn-primary" id="br-fill" data-i18n="ui.brFill" hidden></button>
          </div>
          <p class="hint" id="br-msg" style="margin:var(--b24-s3) 0 0" hidden></p>
          <div class="warn" id="br-notes" style="margin:var(--b24-s3) 0 0" hidden>
            <img src="assets/icons/alert.svg" alt="">
            <span id="br-notes-body"></span>
          </div>
          <div class="br-rev" id="br-rev" hidden></div>
        </div>
      </div>
    </div>
  </section>

  <section id="services">
    <div class="sec-h" data-i18n="ui.step4"></div>
    <h2 data-i18n="ui.svcH"></h2>
    <p class="note-line" data-i18n="ui.svcNote"></p>
    <div class="card" id="svc-body"></div>
  </section>

  <section id="summary">
    <div class="sec-h" data-i18n="ui.step5"></div>
    <div class="sum">
      <h2 data-i18n="ui.summaryH"></h2>
      <div id="sum-body"></div>
    </div>
  </section>

  <section id="transition">
    <div class="sec-h" data-i18n="ui.step6"></div>
    <h2 data-i18n="ui.trH"></h2>
    <p class="note-line" data-i18n="ui.trNote"></p>

    <div class="warn" id="warn-eur" hidden>
      <img src="assets/icons/alert.svg" alt=""><span data-i18n="ui.eurMissing"></span>
    </div>

    <div class="warn" id="warn-agents" hidden>
      <img src="assets/icons/alert.svg" alt="">
      <div>
        <b id="warn-agents-h"></b>
        <ul id="warn-agents-list" class="warn-list"></ul>
        <p id="warn-agents-body" style="margin:var(--b24-s2) 0 0"></p>
        <button type="button" class="b24x-btn-ghost" id="warn-agents-fix"
                style="margin-top:var(--b24-s3)"></button>
      </div>
    </div>

    <div class="card" style="margin-bottom:var(--b24-s5)">
      <div class="b24x-pair">
        <div class="field">
          <label for="ess-sel" data-i18n="ui.currentPlan"></label>
          <select class="b24x-input" id="ess-sel"></select>
        </div>
        <div class="field">
          <label for="tgt-sel" data-i18n="ui.targetPlan"></label>
          <select class="b24x-input" id="tgt-sel"></select>
          <p class="hint" id="tgt-hint"></p>
        </div>
      </div>
    </div>

    <div class="tr-grid" id="tr-grid"></div>
    <p class="note-line" data-i18n="ui.planPriceNote"
       style="margin-top:var(--b24-s4)"></p>

    <div class="gap-card">
      <h3 style="margin:0 0 var(--b24-s2); font:700 17px var(--b24-font-display); color:var(--b24p-deep)"
          data-i18n="ui.diffH"></h3>
      <div class="gap-rows" id="diff-rows"></div>
    </div>


    <div class="gap-card">
      <h3 style="margin:0; font:700 17px var(--b24-font-display); color:var(--b24p-deep)" data-i18n="ui.aiH"></h3>
      <p class="note-line" style="margin:var(--b24-s2) 0 0" data-i18n="ui.aiNote"></p>
      <ul class="ai-list" id="ai-list"></ul>
    </div>

    <div class="gap-card">
      <h3 style="margin:0; font:700 17px var(--b24-font-display); color:var(--b24p-deep)"
          data-i18n="ui.demoH"></h3>
      <p class="note-line" style="margin:var(--b24-s2) 0 0" data-i18n="ui.demoNote"></p>
      <ul class="ai-list" id="demo-list"></ul>
    </div>
  </section>

  <section id="partner-summary">
    <div class="sec-h" data-i18n="ui.step7"></div>
    <h2 data-i18n="ui.pnH"></h2>
    <p class="note-line" data-i18n="ui.pnNote"></p>
    <div class="card" id="partner-body"></div>
  </section>

  <section id="report">
    <div class="sec-h" data-i18n="ui.step8"></div>
    <h2 data-i18n="ui.reportH"></h2>
    <p class="note-line" data-i18n="ui.reportNote"></p>
    <div class="card">
      <div class="b24x-pdf-row">
        <button type="button" class="btn-primary" id="pdf-client" data-i18n="ui.pdfClient"></button>
      </div>
      <p class="hint b24x-print-check" style="margin:var(--b24-s3) 0 0"
         data-i18n="ui.pdfChecklist"></p>
      <p class="hint" style="margin:var(--b24-s2) 0 0" data-i18n="ui.pdfHint"></p>
      <div id="pdf-err" class="warn" hidden style="margin-top:var(--b24-s4)">
        <img src="assets/icons/alert.svg" alt=""><span id="pdf-err-text"></span>
      </div>
      <div id="pdf-warn-pt" class="warn" hidden style="margin-top:var(--b24-s4)">
        <img src="assets/icons/alert.svg" alt="">
        <div><b id="pdf-warn-pt-h"></b>
          <p id="pdf-warn-pt-b" style="margin:var(--b24-s2) 0 0"></p></div>
      </div>

      <div class="b24x-save-row">
        <div>
          <span class="b24x-save-h" data-i18n="ui.saveH"></span>
          <p class="hint" style="margin:4px 0 0" data-i18n="ui.saveHint"></p>
        </div>
        <div class="b24x-save-actions">
          <button type="button" class="b24x-btn-ghost" id="copy-link" data-i18n="ui.copyLink"></button>
          <button type="button" class="b24x-btn-ghost" id="copy-quick" data-i18n="ui.copyQuick"></button>
          <button type="button" class="b24x-btn-ghost" id="dl-state" data-i18n="ui.dlState"></button>
          <label class="b24x-file b24x-file--btn">
            <input type="file" id="load-state" accept="application/json,.json">
            <span data-i18n="ui.loadState"></span>
          </label>
        </div>
      </div>
      <label class="rev-toggle" for="link-mine" style="margin-top:var(--b24-s3)">
        <input type="checkbox" id="link-mine">
        <span data-i18n="ui.linkMine"></span>
      </label>
      <p class="hint" style="margin:4px 0 0" data-i18n="ui.linkMineHint"></p>
      <div class="in-wrap" id="link-box" hidden style="margin-top:var(--b24-s3)">
        <input class="b24x-input" id="link-out" type="text" readonly>
      </div>
      <p class="hint" id="link-msg" style="margin:var(--b24-s2) 0 0" hidden></p>
      <p class="hint" id="load-msg" style="margin:var(--b24-s3) 0 0" hidden></p>
    </div>
  </section>

  <div class="foot">
    <div class="b24x-cobrand" style="--b24x-lockup-h:26px; margin-bottom:var(--b24-s3)">
      <span class="b24x-cobrand__b24"><img src="assets/logo-partner-h.png" alt="Bitrix24 Partners"></span>
      <img class="b24x-cobrand__partner" id="foot-partner-logo" alt="" hidden>
    </div>
    <p style="margin:0" data-i18n="ui.footer"></p>
    <p style="margin:6px 0 0" id="foot-dates"></p>
  </div>
</main>

<div class="navbar">
  <div class="wrap navbar-in">
    <span class="cnt" id="nav-cnt"></span>
    <div class="hdr-sp"></div>
    <div class="nav-tot" id="nav-tot"></div>
  </div>
</div>

<div class="ov" id="ov" hidden>
  <div class="mdl" role="dialog" aria-modal="true" aria-labelledby="ov-t">
    <button class="mdl-x" id="ov-x" aria-label="Close">&times;</button>
    <h3 id="ov-t"></h3>
    <p id="ov-b"></p>
  </div>
</div>

  "ui.reportH":"Report",
  "ui.reportNote":"One document, straight from this page: the report you give to the client. It carries no per-scenario fees. The cost of your services is in it as one total line, because the net saving would look too high without it. Nothing to install.",
  "ui.pdfClient":"Report for the client — PDF",
  "ui.pdfChecklist":"In the print dialog: Destination → <b>Save as PDF</b> · Margins → <b>Default</b> · Headers and footers → <b>off</b>",
  "ui.pdfHint":"The button lays the report out as A4 pages and opens your browser's print dialog — that dialog is the only way a web page can write a PDF to your disk. It also keeps the text real text: you can select it and search it, and it prints in the Bitrix24 font instead of as a picture. The pages declare their own size and zero margins, so Chrome does not add a URL or a date to the corners even with headers and footers switched on — we measured that. Switching them off anyway costs nothing and covers browsers we could not measure.",

  "ui.saveH":"Save the calculation",
  "ui.saveHint":"Two ways to keep this calculation, and neither is the report — the button above makes that. A <b>link</b> carries the calculation inside the address itself: paste it into a message, and whoever opens it sees these figures and can change them. A <b>JSON file</b> carries everything, including your logo, and is the one to use if a mail client mangles the link. Both reopen through the same route, so a link and a file restore the same calculation.",

  "ui.copyLink":"Copy link to this calculation",
  "ui.linkMine":"Include my fees and contacts",
  "ui.linkMineHint":"Off by default, and deliberately. Without it the link carries the calculation — scenarios, figures, coverage, plan, mode — and not your per-scenario fees, your name, email or phone. Those are yours: the report never shows a fee next to a scenario, and a link travels further than a PDF and stays in mail and chat history. Turn it on when you are sending the link to yourself or a colleague. Your logo never goes into a link at all — it would make the address 40,000 characters long.",

  "sc.1.title":"CoPilot call transcripts and automatic deal-card fill",
  "sc.1.sub":"CoPilot transcribes the call and fills the deal card by itself. The manager no longer replays recordings or types fields by hand.",
  "sc.1.role":"Sales manager",
  "sc.1.f.mgr":"Number of managers", "sc.1.f.sal":"Manager salary (gross)",
  "sc.1.f.calls":"Calls per manager per day", "sc.1.f.time":"Time spent after one call, replaying it and filling the card",
  "sc.1.f.plan":"Manager's monthly target",
  "sc.1.f.coef":"Share of freed time that turns into sales",
  "info.1":"Minutes a day that used to go on the work AFTER a call — replaying it and filling the card by hand (calls x minutes). The call itself is not counted. We turn that into hours per month (x {days} working days) and multiply it by the manager's hourly cost.",
  "int.1":"The integrator connects call recognition and binds transcripts to deal cards for the client's telephony and pipelines, defines which card fields fill automatically, and trains the managers. Cost scales with the number of managers to onboard.",

  "sc.4.title":"Sales scripts and speech analytics — call scoring",
  "sc.4.sub":"Today the head of sales listens to calls one by one and scores them against the script. CoPilot covers every call and scores it instead.",
  "sc.4.role":"Head of sales",
  "sc.4.f.rop":"Number of heads of sales", "sc.4.f.sal":"Head of sales salary (gross)",
  "sc.4.f.share":"Share of their time spent listening to calls and scoring them",
  "info.4":"We take the full monthly cost of the head of sales (gross salary x (1 + payroll burden)) and multiply it by the share of their time that used to go on listening to calls and scoring them. AI takes that work over.",
  "int.4":"The integrator helps describe the sales script and the scoring criteria the AI will apply, sets up the reporting for the head of sales and teaches the team to act on the scores. Scope depends on the number of heads and script complexity.",

  "sc.5.title":"AI-assisted repeat sales into the existing base",
  "sc.5.sub":"CoPilot works through the existing customer base, finds chances for a repeat sale and hands managers deals to close.",
  "sc.5.role":"Revenue-level effect",
  "sc.5.f.base":"Size of the customer base", "sc.5.f.check":"Average deal value",
  "sc.5.f.conv":"Conversion into a repeat sale, per month",
  "info.5":"This is additional revenue, not a saving: size of the base x conversion into a repeat sale in one month x average deal value. The conversion is per month, so the figure is per month too.",
  "int.5":"The integrator sets up base segmentation and repeat-touch sequences for the client's product and sales cycle, defines triggers and offer copy, and connects conversion analytics. A one-off adaptation to the client's base.",

  "sc.9.title":"Manage Bitrix24 from CoPilot Agent chat",
  "sc.9.sub":"Staff tell a CoPilot Agent in plain words what to do in Bitrix24: deals and leads, tasks, business processes, files and documents, stage changes, analytics. No clicking through menus.",
  "sc.9.role":"All staff",
  "sc.9.note":"Covers routine operations inside Bitrix24. It leaves out filling the card after a call, because that is the call-transcription scenario. The same time is never counted twice.",
  "sc.9.f.mgr":"Employees who will work this way", "sc.9.f.sal":"Average employee salary",
  "sc.9.f.ops":"Bitrix24 operations per employee per day", "sc.9.f.time":"Time saved per operation, versus doing it by hand",
  "info.9":"How many routine Bitrix24 operations an employee does per day, and how many minutes each one saves against doing it by hand. Only the difference counts, not the whole operation. We turn that into hours per month (x {days} working days) and multiply it by the hourly cost.",
  "int.9":"The integrator configures the agent for the client's processes in CRM, tasks, smart processes and Drive, respecting access rights, drafts the common commands and trains the staff. Cost scales with the number of employees to onboard.",

  "sc.2.title":"First-line support agent in Open Channels",
  "sc.2.sub":"A CoPilot Agent handles incoming customer requests. It answers some of them itself and passes the rest to an operator.",
  "sc.2.role":"Support specialist",
  "sc.2.f.sal":"Specialist salary (gross)",
  "sc.2.f.total":"Requests per day (total)", "sc.2.f.ai":"Of those, closed by AI (per day)",
  "sc.2.f.time":"Time a specialist spends on one request",
  "sc.2.err.ai":"Cannot be more than the total requests",

  "err.notNumber":"This does not look like a number. Retype it, or clear the field to count it as zero.",
  "err.negative":"Cannot be less than zero.",
  "err.min":"Cannot be less than {min}.",
  "err.max":"Cannot be more than {max}. Above that the figure stops describing a company.",
  "err.whole":"Needs to be a whole number — half a person or half an event does not happen.",
  "ui.globalErrH":"Check the company details",
  "ui.globalErrBody":"One of the figures in {step:company} is outside what the model can use, so the calculation is on hold. The field is marked below.",
  "info.2":"How many requests a day the AI closes instead of a specialist, and how many minutes a specialist used to spend on one request. The AI closes the whole request, so the whole time goes. We turn that into hours per month (x {days} working days) and multiply it by the specialist's hourly cost.",
  "int.2":"The integrator connects the open channels, fills the knowledge base with answers, sets the hand-off rules for complex cases, defines what to capture from the dialogue into the card and trains the support team. Scope depends on specialists and channels.",

  "sc.10.title":"Knowledge-base agent",
  "sc.10.sub":"Staff ask a CoPilot Agent in chat and get an instant answer from the policies and manuals you upload. No searching through documents, no interrupting colleagues.",
  "sc.10.role":"All staff",
  "sc.2.note":"The AI answers themselves are a plan feature: the official comparison lists AI-powered responses in Open Channels from Basic up, in both variants. This scenario is costed on that. If you instead build it as a custom AI agent, the account needs Alaio Professional Vibe+ or higher and only an account administrator can assemble it — say so before you quote the work.",
  "sc.12.note":"AI calls and Booking are both listed from Basic up in the official comparison, and this scenario is costed on that. A custom AI agent doing the same job is a different route: it needs Alaio Professional Vibe+ or higher and an account administrator to build it. The CoPilot-in-Booking wrapper is still marked \u00absoon\u00bb on the comparison page — that is a release question, not a plan one.",
  "sc.10.note":"We count only the time of the employee who asks. The time of the colleagues who would have been interrupted is a bonus we leave out on purpose. Do not count this twice with the Vibecode scenario.",
  "sc.10.f.emp":"Employees using the knowledge base", "sc.10.f.sal":"Average employee salary",
  "sc.10.f.q":"Knowledge-base lookups per employee per day", "sc.10.f.t":"Time spent looking for one answer today",
  "sc.10.f.share":"Share of questions the AI answers",
  "info.10":"How often a day staff look for answers and how long one search used to take, times the share of questions the AI answers. We turn that into hours per month (x {days} working days) and multiply it by the hourly cost. Only the time of the person asking is counted.",
  "int.10":"The integrator helps collect and structure the knowledge base from the client's policies and manuals, configures the agent, checks answer quality and teaches staff to ask and to extend the base. Scope depends on users and documents.",

  "sc.11.title":"Personal assistant (My day and daily reports)",
  "sc.11.sub":"Each morning a CoPilot Agent builds the day plan from tasks and calendar, and at the end of the day it writes a summary. For managers it turns dozens of daily team reports into one page.",
  "sc.11.role":"All staff and managers",
  "sc.11.note":"Counts two things: the day plan and daily summary for staff, and the combined report for managers. These are separate blocks of time and they do not overlap. Do not count this twice with the Vibecode scenario.",
  "sc.11.f.emp":"Employees who will use it", "sc.11.f.empSal":"Average employee salary",
  "sc.11.f.empMin":"Time saved per employee per day, planning and daily summary",
  "sc.11.f.mgr":"Number of managers", "sc.11.f.mgrSal":"Manager salary",
  "sc.11.f.mgrMin":"Time saved per manager per day, reading team reports",
  "info.11":"Staff save time on planning and closing the day, managers on reading reports. Minutes per day become hours per month (x {days} working days) and we multiply them by the hourly cost. Then we add the two effects together.",
  "int.11":"The integrator configures the morning plan and evening wrap-up around the client's tasks and calendar, and the consolidated team report for managers, then agrees the format and notification schedule. Cost scales with the number of employees.",
  "bd.11.a":"Staff · day plan and wrap-up", "bd.11.b":"Managers · consolidated report",

  "sc.12.title":"Booking agent — AI calls",
  "sc.12.sub":"AI calls reach booked customers by phone without a person dialling. It confirms the visit, sends a reminder, reacts if the customer is late and writes the result into the card. The front desk no longer works through the list by hand.",
  "sc.12.role":"Receptionist / front desk",
  "sc.12.f.visits":"Bookings (visits) per month", "sc.12.f.perRec":"Calls per booking",
  "sc.12.f.time":"Time one call takes by hand, from dialling to writing it down", "sc.12.f.admSal":"Receptionist salary",
  "info.12":"Calls per month (bookings x calls per booking) x minutes one call takes by hand, dialling to writing it down. We turn that into hours and multiply it by the receptionist's hourly cost. This scenario counts the payroll saving only. Revenue from customers who would not have shown up is not included.",
  "int.12":"The integrator connects the voice agent to the client's online booking and telephony, configures confirmation, reminder and no-show flows, defines how the call outcome is stored on the card and tests it against real bookings.",

  "sc.3.title":"Documents from templates, written by CoPilot",
  "sc.3.sub":"CoPilot makes documents from templates and writes the text for you: quotes, contracts, letters, manuals, reports.",
  "sc.3.role":"Any employee",
  "sc.3.f.emp":"Employees preparing documents", "sc.3.f.sal":"Average employee salary",
  "sc.3.f.docs":"Documents or letters per employee per day", "sc.3.f.time":"Time spent writing one document by hand",
  "info.3":"Minutes a day spent writing documents by hand (documents x minutes). We turn that into hours per month (x {days} working days) and multiply it by the hourly cost, for everyone who prepares documents.",
  "int.3":"The integrator prepares the document templates (quotes, contracts, letters, invoices) with CRM data merged in, sets the house style and mandatory blocks and trains the staff. Cost scales with the number of employees preparing documents.",

  "sc.6.title":"CoPilot Follow-Up (internal meetings)",
  "sc.6.sub":"Every internal meeting is transcribed. Meetings get shorter, fewer people need to attend, and nobody has to write the minutes.",
  "sc.6.role":"Staff and assistant",
  "sc.6.f.meet":"Internal meetings per month", "sc.6.f.dur":"Average meeting length",
  "sc.6.f.part":"Average number of participants", "sc.6.f.psal":"Average participant salary",
  "sc.6.f.asal":"Assistant salary",
  "info.6":"Transcription gives three effects: meetings get {gain} shorter, {gain} fewer people attend, and the assistant no longer writes the minutes. Each effect is minutes x meetings x cost of a minute. For the minutes we assume the assistant used to spend one meeting length on each meeting. We add the three together.",
  "int.6":"The integrator configures meeting transcription and automatic summaries for the client's meeting formats, and defines who receives the outcome and which tasks are created from it. Scope depends on the number of participants.",
  "bd.6.a":"A · meetings shorter by {gain}", "bd.6.b":"B · attendance down by {gain}",
  "bd.6.c":"C · minutes and follow-up (assistant)",

  "sc.7.title":"Vibecode and CoPilot chat",
  "sc.7.sub":"Staff simplify and automate their own work. Some just chat with the model, others build small apps. Both raise personal output and speed up company processes.",
  "sc.7.role":"All staff",
  "sc.7.f.emp":"Employees this covers", "sc.7.f.share":"Share of self-starters",
  "sc.7.f.simp":"Share of their own work self-starters simplify", "sc.7.f.sal":"Average salary",
  "info.7":"The saving has two parts. Every employee covered gains the baseline {base} in efficiency (full cost = gross salary x (1 + payroll burden)). Self-starters gain their own higher share instead, not on top. We add the two parts together.",
  "int.7":"The integrator runs staff onboarding for CoPilot and Vibecode: standard chat scenarios, copy generation, routine and process automation. Sets up access and walks the first scenarios through to a result. Cost scales with headcount.",
  "bd.7.init":"Self-starters",
  "brief.q.co-empCount":"How many people work at the company in total, counting part-time and contract staff?",
  "brief.q.co-mgrCount":"How many of them sell \u2014 the people who talk to customers and close deals?",
  "brief.q.co-ropCount":"How many people run the sales team rather than sell themselves?",
  "brief.q.1-plan":"What sales target does one of those salespeople carry in a month?",
  "brief.q.5-base":"How many customers have bought from you at least once and could realistically buy again?",
  "brief.q.5-check":"What does a typical order or contract come to?",
  "brief.q.5-conv":"In a typical month, what share of those past customers come back and buy something else? A rough percentage is fine.",
  "brief.q.1-calls":"How many calls does one of your salespeople make or take on a normal day?",
  "brief.q.4-share":"Roughly what share of the working week does whoever runs your sales team spend listening back to recorded calls and grading them? If nobody does this, say so and I will leave it out.",
  "brief.q.2-total":"How many customer requests does your support team get on a normal day, across all the channels together?",
  "brief.q.2-time":"How long does one of those requests take a support person to deal with, start to finish, on average? Your helpdesk reports usually carry this figure.",
  "brief.q.12-visits":"How many appointments or visits do you book in a month?",
  "brief.q.12-perRec":"How many times does someone phone the customer about a single booking \u2014 confirming it, reminding them the day before, and so on?",
  "brief.q.3-docs":"How many documents or written offers does one of the people who prepare them turn out on a normal day?",

const fmtDate = iso => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
  if(!m) return String(iso || "");
  return new Date(+m[1], +m[2] - 1, +m[3])

};
const toWhole = n => Math.round(Math.round((n || 0) * 100) / 100);
const fixMinus = str => str.replace(/^-/, "\u2212");
const NO_VALUE = "\u2014";
const finiteOr = (n, fn) => Number.isFinite(n) ? fn(n) : NO_VALUE;

function groupFmt(s){
  s = String(s).replace(/\s/g,"").replace(",",".").replace(/[^\d.]/g,"");
  if(s === "") return "";
  const p = s.split(".");
  let i = p[0].replace(/^0+(?=\d)/,""); if(i === "") i = "0";
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return p.length > 1 ? i + "." + p[1] : i;
}
function parseNum(s){
  let t = String(s).replace(/\s/g,"").replace(/[^\d.,]/g,"");
  const last = Math.max(t.lastIndexOf("."), t.lastIndexOf(","));
  if(last >= 0){
    const tail = t.slice(last + 1);
    const grouped = /^\d{3}$/.test(tail);
    const head = t.slice(0, last).replace(/[.,]/g, "");
    t = grouped ? head + tail : head + "." + tail.replace(/[.,]/g,"");
  }
  const n = parseFloat(t);
  return isFinite(n) && n >= 0 ? n : 0;
}
function onNumInput(inp){
  if(inp.value.indexOf(",") >= 0) inp.value = String(parseNum(inp.value));
  const old = inp.value, sel = inp.selectionStart;
  const before = old.slice(0, sel).replace(/[^\d]/g,"").length;
  const f = groupFmt(old);
  inp.value = f;
  let c = 0, pos = 0;
  if(before > 0){ for(; pos < f.length; pos++){ if(/\d/.test(f[pos])) c++; if(c >= before){ pos++; break; } } }
  try{ inp.setSelectionRange(pos, pos); }catch(e){}
  return parseNum(f);
}

function limitError(v, lim){
  if(typeof v !== "number" || !Number.isFinite(v))
    return {k:"err.notNumber", p:{}};
  if(v < 0)          return {k:"err.negative", p:{}};
  const k = lim.scale || 1;
  const unit = k === 100 ? "%" : "";
  if(v < lim.min / k) return {k:"err.min", p:{min: fmtInt(lim.min) + unit}};
  if(v > lim.max / k) return {k:"err.max", p:{max: fmtInt(lim.max) + unit}};
  if(lim.int && !Number.isInteger(v)) return {k:"err.whole", p:{}};
  return null;
}

function boundsErrors(sc, vals){
  const out = {};
  sc.fields.forEach(f=>{
    if(f.revOnly && !SHOW_REVENUE) return;
    const e = limitError(vals[f.k], limOf(f));
    if(e) out[f.k] = e;
  });
  return Object.keys(out).length ? out : null;
}

function scenarioErrors(sc, st){
  const sets = [st.values].concat(st.segments || []);
  for(const vals of sets){
    const b = boundsErrors(sc, vals);
    if(b) return b;
    if(sc.validate){
      const e = sc.validate(vals);
      if(e) return e;
    }
  }
  return null;
}

const COMPANY_LIM = {
  empCount: LIMITS.ppl, mgrCount: LIMITS.ppl, ropCount: LIMITS.ppl,
  empSal: LIMITS.money, mgrSal: LIMITS.money, ropSal: LIMITS.money,
};
function globalErrors(){
  const out = {};
  Object.entries(COMPANY_LIM).forEach(([k, lim])=>{
    const e = limitError(company[k], lim);
    if(e) out["co-" + k] = e;
  });
  const d = limitError(daysMonth, LIMITS.days);
  if(d) out["days"] = d;
  const b = limitError(burdenPct, {min:0, max:200, step:0.1, int:false});
  if(b) out["burden"] = b;
  return Object.keys(out).length ? out : null;
}

function computeScenario(sc, st){
  const sets = [st.values].concat(st.segments || []);
  let fot = 0, rev = 0, hours = 0, breakdown = null;
  sets.forEach(vals=>{
    const r = sc.compute(vals);
    fot += r.fot; rev += (r.rev || 0);
    hours += sc.hours(vals);
    if(r.breakdown){
      if(!breakdown) breakdown = r.breakdown.map(b=>[b[0], b[1], b[2]]);
      else r.breakdown.forEach((b,j)=>{ if(breakdown[j]) breakdown[j][1] += b[1]; });
    }
  });
  const k = realisation();
  fot *= k;
  hours *= k;
  if(sc.revFromTime) rev *= k;
  if(breakdown) breakdown.forEach(b=>{ if(b[2] !== "int") b[1] *= k; });
  return {fot, rev, hours, breakdown};
}

function computeModel(){
  const items = [];
  let fot = 0, rev = 0, pot = 0, hours = 0, any = false, qual = false;
  const revPool = {target: 0, base: 0};

  const invalid = [];
  scenarios.forEach(sc=>{
    const st = state[sc.id];
    if(!st.selected) return;
    if(scenarioErrors(sc, st)){ invalid.push({id: sc.id, title: t(`sc.${sc.id}.title`)}); return; }
    const r = computeScenario(sc, st);
    if(sc.revPool) [st.values].concat(st.segments || []).forEach(vals=>{
      const c = sc.revPool(vals);
      if(c && revPool[c.key] !== undefined) revPool[c.key] += (c.year || 0);
    });
    any = true;
    if(sc.qualitative) qual = true;
    fot += r.fot;
    hours += r.hours;
    if(sc.revLabel === "ui.revBase") pot += r.rev; else rev += r.rev;
    items.push({sc, fot:r.fot, rev:r.rev, hours:r.hours, breakdown:r.breakdown, service:svcCost(sc)});
  });

  const svc = svcTotals();
  const PP = planPair();
  const {map, vibe} = PP;
  const from = PP.from;

  const subscriptionYear = vibe ? vibe.annualTotal : 0;
  const fotYear        = fot * 12;
  const firstYearCost  = subscriptionYear + svc.sum;
  const netFirstYear   = fotYear - firstYearCost;

  const payroll = (company.empCount || 0) * (company.empSal || 0) * burdenMult();
  const pct = payroll ? (fot / payroll * 100) : 0;

  const revPoolYear   = revPool.target + revPool.base;
  const projectedYear = (rev + pot) * 12;
  const revPct = revPoolYear > 0 ? (projectedYear / revPoolYear * 100) : 0;
  const revMeasured = SHOW_REVENUE && revPoolYear > 0 && projectedYear > 0;
  const revGuard = {
    ok: !revMeasured || revPct <= C.REV_WARN_PCT,
    measured: revMeasured,
    pct: revPct,
    poolYear: revPoolYear,
    poolTargetYear: revPool.target,
    poolBaseYear: revPool.base,
    projectedYear,
    threshold: C.REV_WARN_PCT,
  };

  const gatedList = planGatedItems(items, map.to);
  const gatedFot  = gatedList.reduce((a, it) => a + it.fot, 0);
  const agentGate = {
    planHasAgents: planHasAgents(map.to),
    minPlan: AGENT_MIN_PLAN,
    ids: gatedList.map(it => it.sc.id),
    titles: gatedList.map(it => t(`sc.${it.sc.id}.title`)),
    fotMonth: gatedFot, fotYear: gatedFot * 12,
  };

  return {
    any, qual, n: items.length, items, svc, agentGate, invalid,
    plan: {from: essPlan, map, vibe, pair: PP, fromPrice: from},
    totals: {
      fotMonth: fot, fotYear,
      revMonth: rev, revYear: rev * 12,
      potMonth: pot, potYear: pot * 12,
      serviceSum: svc.sum, subscriptionYear, firstYearCost, netFirstYear,
    },
    overlap: (() => {
      const p = any ? pct : 0;
      const level = !any || p <= C.OVERLAP_NOTE_PCT ? "ok"
                  : (p <= C.OVERLAP_WARN_PCT ? "soft" : "hard");
      return {level, ok: level === "ok", pct: p, payroll,
              note: C.OVERLAP_NOTE_PCT, threshold: C.OVERLAP_WARN_PCT};
    })(),
    revGuard,
    capacity: (() => {
      const k = realisation();
      const hoursMonth = any ? hours : 0;
      const hoursYear  = hoursMonth * 12;
      const yearHoursPerEmployee = contractHours() * 12;
      const fte = yearHoursPerEmployee ? hoursYear / yearHoursPerEmployee : 0;
      const blocked = !any ? "none" : (svc.unquoted > 0 ? "unquoted"
                    : (fot > 0 ? null : "nosaving"));
      const months = blocked ? null : firstYearCost / fot;
      const kFloor = REALISATION[0].k;
      const scale  = k > 0 ? kFloor / k : 0;
      return {
        hoursMonth, hoursYear, fte,
        hoursPerEmployeeYear: yearHoursPerEmployee,
        paybackMonths: months,
        paybackWeeks: months === null ? null : months * (52 / 12),
        paybackBlocked: blocked,
        unquoted: svc.unquoted,
        atFloor: realisationId === REALISATION[0].id,
        floorFotYear: fotYear * scale,
        floorHoursYear: hoursYear * scale,
      };
    })(),
  };
}

function paintGlobalErrors(errs){
  const SCOPE = '#company .field[data-field], #quick .field[data-field]';
  document.querySelectorAll(SCOPE).forEach(f=>{
    f.classList.remove("invalid");
    const e = f.querySelector(".err"); if(e) e.textContent = "";
    const i = f.querySelector("input"); if(i) i.removeAttribute("aria-invalid");
  });
  if(!errs) return;
  Object.entries(errs).forEach(([k, msg])=>{
    document.querySelectorAll(
      `#company .field[data-field="${k}"], #quick .field[data-field="${k}"]`).forEach(f=>{
      f.classList.add("invalid");
      const e = f.querySelector(".err"); if(e) e.textContent = t(msg.k, msg.p);
      const i = f.querySelector("input"); if(i) i.setAttribute("aria-invalid","true");
    });
  });
}

function recompute(){
  paintGlobalErrors(globalErrors());
  const model = computeModel();
  const byId = {};
  model.items.forEach(it=> byId[it.sc.id] = it);

  scenarios.forEach(sc=>{
    const st = state[sc.id];
    const card = document.getElementById("card-"+sc.id);
    const res = document.getElementById("res-"+sc.id);
    if(!card || !res) return;

    card.querySelectorAll(".field").forEach(f=>f.classList.remove("invalid"));
    const errs = scenarioErrors(sc, st);
    if(errs) Object.entries(errs).forEach(([k,msg])=>{
      const msgKey = typeof msg === "string" ? msg : msg.k;
      const msgVars = typeof msg === "string" ? undefined : msg.p;
      const f = card.querySelector(`.field[data-field="${k}"]`);
      if(f){ f.classList.add("invalid"); f.querySelector(".err").textContent = t(msgKey, msgVars);
             const i = f.querySelector("input"); if(i) i.setAttribute("aria-invalid","true"); }
    });
    if(!errs) card.querySelectorAll("input[aria-invalid]").forEach(i=>i.removeAttribute("aria-invalid"));

    if(!st.selected){ res.innerHTML = ""; return; }

    if(errs){
      res.innerHTML = row(t("ui.fotMonth"), SCREEN_DASH)
                    + `<div class="res-note">${t("ui.invalidCardNote")}</div>`;
      return;
    }

    const r = byId[sc.id];
    let html = "";
    if(r.breakdown){
      html += '<div class="bd">' + r.breakdown.map(b=>{
        const isInt = b[2] === "int";
        return `<span></span><div><span>${t(b[0], copyVars())}</span><b>${isInt?fmtInt(b[1]):fmtMoney(b[1])}</b></div>`;
      }).join("") + "</div>";
    }
    if(sc.effect.includes("fot")){
      html += row(t("ui.fotMonth"), fmtMoney(r.fot));

function jumpToFee(id){
  const inp = document.getElementById("svc-" + id);
  if(!inp) return;
  const strip = inp.closest(".svc-strip");
  inp.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  inp.focus({preventScroll:true});
  if(strip){
    strip.classList.remove("svc-flash");
    void strip.offsetWidth;
    strip.classList.add("svc-flash");
  }
}
function jumpToUnpriced(){
  const first = scenarios.find(sc=> state[sc.id].selected && svcCost(sc) === null);
  if(first) jumpToFee(first.id);
}
document.addEventListener("click", e=>{
  if(e.target.closest("[data-svc-jump]")) return jumpToUnpriced();
  const cell = e.target.closest("[data-svc-goto]");
  if(cell) jumpToFee(+cell.dataset.svcGoto);
});

const NO_B24 = "__none__";
let essPlan = "Standard";

const ESS_PLAN_ALIASES = {
  "Enterprise": "Enterprise 250",
  "Enterprise-500": "Enterprise 500",
  "Enterprise-1000": "Enterprise 1000",
  "Enterprise-2000": "Enterprise 2000",
};
const normEssPlan = name => {
  if(name === NO_B24) return NO_B24;
  const n = ESS_PLAN_ALIASES[name] || name;
  return (PRICING.essentials.USD || []).some(r => r.plan === n) ? n : null;
};

function essentialsList(){
  return PRICING.essentials[CUR] || PRICING.essentials.USD || [];
}
function vibeDeltaFor(planName){
  const D = PRICING.vibeDelta;
  if(/Basic/.test(planName))        return D.basic;
  if(/Standard/.test(planName))     return D.std;
  if(/Professional/.test(planName)) return D.pro;
  if(/Enterprise/.test(planName))   return /Enterprise-250/.test(planName) ? D.ent_250 : D.ent_other;
  return D.basic;
}

const AGENT_MIN_PLAN = "Alaio Professional Vibe+";
const AGENT_PLAN_RE  = /^Alaio (?:Professional|Enterprise-\d+) Vibe\+$/;
const AGENT_PLAN_NO  = /^Alaio (?:Basic|Standard) Vibe\+$/;
function planHasAgents(name){
  if(AGENT_PLAN_RE.test(name)) return true;
  if(!AGENT_PLAN_NO.test(name))
    console.error("planHasAgents: unknown Vibe+ plan, treated as WITHOUT agents:", name);
  return false;
}
function planGatedItems(items, tgt){
  if(planHasAgents(tgt)) return [];
  return items.filter(it => it.sc.agent || it.sc.minPro);
}

let tgtPlanName = null;
let tgtAuto = true;

const mapFor = plan => PRICING.migration.find(x => x.from === plan) || null;

function autoTargetFor(plan){
  const m = mapFor(plan);
  if(m) return m.to;
  const row = (PRICING.essentials[CUR] || []).find(r => r.plan === plan);
  const vibeList = PRICING.vibePlus[CUR] || [];
  if(row && row.seats){
    const same = vibeList.find(v => seatsOf(v.plan) === row.seats);
    if(same) return same.plan;
  }
  return null;
}

function resolveTarget(){
  const vibeList = PRICING.vibePlus[CUR] || [];
  if(tgtPlanName == null || !vibeList.some(v => v.plan === tgtPlanName)){
    tgtPlanName = autoTargetFor(essPlan) || PRICING.migration[1].to;
  }
  return vibeList.find(v => v.plan === tgtPlanName) || vibeList[0];
}

function planPair(){
  const essList = essentialsList();
  const vibe = resolveTarget();

  let from;
  if(essPlan === NO_B24){
    from = {kind:"none", name: t("ui.planNone"), annual: 0, monthly: 0, seats: null};
  } else {
    const ess = essList.find(x => x.plan === essPlan);
    if(!ess) console.error("planPair: unknown Essentials plan", essPlan);
    const row = ess || essList[0];
    from = {kind:"essentials", name: row.plan, annual: row.annual,
            monthly: row.monthly, seats: row.seats || null};
  }

  const promoRow = PRICING.migration.find(x => x.to === tgtPlanName);
  const matched = autoTargetFor(essPlan) === tgtPlanName;

  const diff = {perMonth: vibe.annual - from.annual, promo: null};

  return {from, vibe, promo: promoRow ? promoRow.promo : null, diff, matched,
          map: {from: essPlan, to: tgtPlanName, promo: promoRow ? promoRow.promo : null}};
}

const seatsOf = plan => { const m = /-(\d+)\s+Vibe\+/.exec(plan) || /[\s-](\d+)$/.exec(plan);
                          return m ? +m[1] : null; };
const SELECT_GROUP_SEATS = 2000;

  const p = planPair();

function buildReport(S, {assets}) {

  const LOC = S.lang === "de" ? "de-DE" : "en-US";
  const toWhole = n => Math.round(Math.round((n || 0) * 100) / 100);
  const fixMinus = str => String(str).replace(/^-/, "\u2212");
  const money = n => fixMinus(new Intl.NumberFormat(LOC, { style: "currency", currency: S.currency, maximumFractionDigits: 0 }).format(toWhole(n)));
  const int = n => new Intl.NumberFormat(LOC).format(toWhole(n));
  const pct1 = v => new Intl.NumberFormat(LOC, {maximumFractionDigits:1})
    .format(Math.round((v || 0) * 10) / 10);
  const today = new Date(S.generatedAt || Date.now()).toLocaleDateString(LOC, { day: "numeric", month: "long", year: "numeric" });
  const chunk = (arr, n) => { const o = []; for (let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o; };
  const noFot = it => it.hasFot === false;
  const DASH = "\u2014";
  const showRev = !!S.showRevenue;
  const noRev = it => it.hasRev === false;
  const R = S.realisation || null;
  const realCase = R ? R.case : null;
  const CAP = S.capacity || null;
  const hours = n => `${int(n)} h`;
  const fte1 = n => new Intl.NumberFormat(LOC, {minimumFractionDigits:1, maximumFractionDigits:1})
    .format(Math.round((n || 0) * 10) / 10);
  const wideTable = showRev;
  const gate = S.agentGate || null;
  const gated = gate && !gate.planHasAgents ? (gate.ids || []) : [];
  const gatedIds = new Set(gated);
  const isGated = it => gatedIds.has(it.id);
  const AGENT_SCENARIO_IDS = new Set([5, 10, 11]);
  const AGENT_PLAN_RE = /^Alaio (?:Professional|Enterprise-\d+) Vibe\+$/;
  const planCarriesAgents = AGENT_PLAN_RE.test(String((S.plan || {}).to || ""));
  const agentItems = (S.items || []).filter(it => AGENT_SCENARIO_IDS.has(it.id));
  const disclosureRequired = !planCarriesAgents && agentItems.length > 0;
  const GATE_MARK = "\u2020";

  const segCount = it => 1 + (it.segments || []).length;
  const chunkByWeight = (arr, budget, weight) => {
    const o = []; let cur = [], load = 0;
    for (const it of arr) {
      const w = weight(it);
      if (cur.length && load + w > budget) { o.push(cur); cur = []; load = 0; }
      cur.push(it); load += w;
    }
    if (cur.length) o.push(cur);
    return o;
  };

const CLIENT_MARK = '<sup class="b24x-gate-mark">\u2022</sup>';
const ASSUM_HALF_BUDGET = 32;
const ASSUM_WRAP_CHARS = 46;
const rowWeight = r => r.t === "field"
  ? (String(r.f.label || "").length > ASSUM_WRAP_CHARS ? 3 : 2)
  : (r.t === "seg" ? 3 : 2);
const ASSUM_ROWS_PER_PAGE = ASSUM_HALF_BUDGET;
const ASSUM_SHARED_WEIGHT = 18;
const assumWeight = it => 1 + (it.fields || []).length
  + (it.segments || []).reduce((a, fs) => a + 1 + fs.length, 0);

const originCell = o => o ? `<span class="b24x-td-sub" style="display:inline; text-transform:none; letter-spacing:0;">${esc(o)}</span>` : "";

const assumptionPages = () => {
  const shared = (S.assumptions || []).length ? `
  <div class="b24-table-wrap">
    <table class="b24-table b24x-table--assum">
      <thead><tr><th>Across the whole calculation</th><th>Value</th><th>Where it comes from</th></tr></thead>
      <tbody>
        ${S.assumptions.map(a => `<tr><td>${esc(a.label)}</td><td>${esc(a.value)}</td><td>${originCell(a.origin)}</td></tr>`).join("")}
      </tbody>
    </table>
  </div>` : "";

  const rows = [];
  (S.items || []).forEach(it => {
    const segs = it.segments || [];
    rows.push({t: "head", it});
    it.fields.forEach(f => rows.push({t: "field", it, f, seg: segs.length ? 1 : null}));
    segs.forEach((fs, k) => {
      rows.push({t: "seg", it, n: k + 2});
      fs.forEach(f => rows.push({t: "field", it, f, seg: k + 2}));
    });
  });

  const pages = [];
  let cur = [], load = 0;
  let budget = ASSUM_HALF_BUDGET - (shared ? ASSUM_SHARED_WEIGHT : 0);
  for (const r of rows) {
    const w = rowWeight(r);
    if (cur.length && load + w > budget) {
      const carry = [];
      while (cur.length && cur[cur.length - 1].t !== "field") carry.unshift(cur.pop());
      pages.push(cur);
      cur = carry; load = carry.reduce((a, x) => a + rowWeight(x), 0);
      budget = ASSUM_HALF_BUDGET;
    }
    cur.push(r); load += w;
  }
  if (cur.length) pages.push(cur);

  const cell = r => {
    if (r.t === "head" || r.t === "cont") {
      const segs = r.it.segments || [];
      return `<tr><td colspan="3" style="background:var(--b24-card);">
        <span class="b24-strong">${esc(r.it.title)}</span>${r.t === "cont"

    }
    if (r.t === "seg") return `<tr><td colspan="3" style="padding-top:8px;">

    return `<tr>
        <td>${esc(r.f.label)}${r.f.client ? CLIENT_MARK : ""}</td>
        <td><span class="b24-strong">${esc(r.f.value)}</span></td>
        <td>${originCell(r.f.origin)}</td></tr>`;
  };

  return pages.map((group, i, all) => {
    const body = (group[0] && group[0].t === "field"
      ? [{t: "cont", it: group[0].it}].concat(group[0].seg && group[0].seg > 1
          ? [{t: "seg", it: group[0].it, n: group[0].seg}] : [])
      : []).concat(group);
    return `
<section class="page page--sky">
  ${runhead("What we assumed")}

function outboundDoc(doc) {
  return doc
    .replace(/(<style\b[^>]*>)([\s\S]*?)(<\/style>)/gi,
             (m, open, css, close) => open + css.replace(/\/\*[\s\S]*?\*\//g, "").replace(/\n[ \t]*(?=\n)/g, "") + close)
    .replace(/[ \t]*<!--[\s\S]*?-->/g, "");
}

function sourceFindings(doc) {
  const out = [];
  if (/<!--/.test(doc)) out.push("an HTML comment in the document source");
  for (const m of doc.matchAll(/<style\b[^>]*>([\s\S]*?)<\/style>/gi)) {
    if (/\/\*/.test(m[1])) { out.push("a CSS comment in the document styles"); break; }
  }
  for (const m of doc.matchAll(/<style\b[^>]*>([\s\S]*?)<\/style>/gi)) {
    if (/[\u0400-\u04FF]/.test(m[1])) { out.push("Cyrillic text in the document styles"); break; }
  }
  return out;
}

function visibleText(doc) {
  return doc
    .replace(/<style[\s\S]*?<\/style>/gi, " ")
    .replace(/<script[\s\S]*?<\/script>/gi, " ")
    .replace(/<[a-z][^>]*>/gi, m => m.replace(/\s+[a-z-]+\s*=\s*("[^"]*"|'[^']*')/gi, ""))
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ")
    .replace(/\s+/g, " ");
}


function requiredDisclosures(doc, gate, gated, mark, money, own) {
  const out = [];
  if (gate && gate.planHasAgents !== own.planCarriesAgents)
    out.push(`the plan lists disagree: the calculator says agents ${gate.planHasAgents ? "ARE" : "are NOT"} ` +
             `available on this plan, the report says they ${own.planCarriesAgents ? "ARE" : "are NOT"}`);
  const flag = (own.items || []).some(it => "needsPlan" in it) ? "needsPlan" : "needsAgent";
  const marked = (own.items || []).filter(it => it[flag] === true).map(it => it.id);
  if (marked.length || (own.items || []).some(it => flag in it)) {
    const mine = (own.items || []).filter(it => own.ids.has(it.id)).map(it => it.id);
    if (marked.slice().sort().join(",") !== mine.slice().sort().join(","))
      out.push(`the scenario lists disagree: the calculator marks [${marked}] as needing a higher plan, ` +
               `the report knows [${mine}]`);
  }

  if (!own.required && !gated.length) return out;

  if (own.required && !gated.length)
    return out.concat("the calculation was saved before the AI-agent check and cannot say which " +
                      "scenarios need an agent, or how much of the saving depends on them — " +
                      "re-export it from the calculator");

  const flat = x => String(x).replace(/\s+/g, " ");
  const hay = flat(visibleText(doc));
  const marks = hay.split(mark).length - 1;
  if (marks < gated.length + 1)
    out.push(`the ${mark} marker next to every scenario that needs an AI agent ` +
             `(found ${marks}, expected at least ${gated.length + 1}: one per row plus the footnote)`);
  if (!hay.includes(flat(`${mark} ${gate.rowNote}`)))
    out.push(`the footnote under the scenario table explaining the ${mark} marker`);
  if (!hay.includes(gate.minPlan))
    out.push(`the name of the plan that includes agents (${gate.minPlan})`);
  const figure = flat(money(gate.fotYear));
  if (!hay.includes(figure))
    out.push(`the amount of saving that depends on agents (${figure})`);
  const lost = (gate.titles || []).filter(x => !hay.includes(flat(x)));
  if (lost.length) out.push(`the names of the affected scenarios (${lost.join("; ")})`);
  return out;
}

function auditClient(doc, P, money, own) {
  const hay = visibleText(doc).toLowerCase();
  const banned = [
    ["itemised partner fees",   /my services/],
    ["unpriced-scenario marker",/not quoted/],
    ["partner copy marking",    /partner copy/],
    ["internal-use marking",    /internal use only/],
  ];
  const hits = banned.filter(([, re]) => re.test(hay)).map(([label]) => label)
    .concat(sourceFindings(doc));

  if (own && own.items) {
    const rows = String(doc).match(/<tr[\s\S]*?<\/tr>/g) || [];
    const cells = r => visibleText(r).replace(/\s+/g, " ").trim();
    own.items.forEach(it => {
      if (typeof it.service !== "number" || it.service <= 0) return;
      const fig = money(it.service).replace(/\s/g, " ");
      const title = String(it.title || "").replace(/\s+/g, " ").trim();
      if (!title) return;
      const leak = rows.some(r => { const c = cells(r); return c.includes(title) && c.includes(fig); });
      if (leak) hits.push(`per-scenario implementation fee ${fig} next to "${title}"`);
    });
  }
  return hits;
}
