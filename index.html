<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Value Calculator — Bitrix24 Vibe+</title>
<link rel="stylesheet" href="css/brand-ext.css">
<style>
/* =============================================================================
   1. DESIGN TOKENS — copied VERBATIM from the partner kit
   assets/bitrix24-kit.css :root block (github.com/rabenok2105/bitrix24-partner-style)
   The kit itself is print-first (.page = A4 210x297mm, @page rules), so it is NOT
   linked wholesale — that would force page geometry onto a web app. Only the token
   block travels. Kit is never edited; update by re-copying this block after a pull.
   Form components and state colors live in css/brand-ext.css (linked above).
   ========================================================================== */
@font-face{ font-family:'Montserrat'; font-weight:100 900; font-style:normal;
  src:url("assets/fonts/Montserrat-VariableFont_wght.ttf") format('truetype-variations');
  font-display:swap; }

:root{
  /* official corporate palette */
  --b24-cyan:#2FC7F7; --b24-blue:#409EEF; --b24-deep:#0066A1; --b24-green:#BDF300;
  --b24-grad-brand:linear-gradient(135deg,#2FC7F7 0%,#409EEF 100%);
  --b24-deep-2:#004E7C;
  /* partner program palette */
  --b24p-deep:#063883; --b24p-light:#EFFBFF; --b24p-green:#BDF300;
  --b24p-deep-2:#04213F; --b24p-deep-hi:#0A63A6;
  /* signature partner gradient — radial glow, never a flat navy */
  --b24-grad-partner-navy:radial-gradient(130% 130% at 45% 30%,#0A63A6 0%,#005E98 28%,#00457C 54%,#063159 78%,#04213F 100%);
  --b24-grad-partner-light:linear-gradient(160deg,#F6FDFF 0%,#EFFBFF 55%,#DBF2FC 100%);
  --b24-lime:var(--b24-green); --b24-lime-ink:var(--b24-deep);
  /* surfaces */
  --b24-page-cool:#F4FAFE; --b24-page-sky:#DCF2FE; --b24-card:#E9F5FD;
  --b24-card-2:#DDEEFB; --b24-white:#FFFFFF; --b24-line:#C8E6F6; --b24-dashed:#6EC0EC;
  /* text */
  --b24-text:#143A57; --b24-text-mute:#5E86A3; --b24-on-navy:#FFFFFF; --b24-on-navy-soft:#B9E2F7;
  /* radii */
  --b24-r-card:22px; --b24-r-inner:16px; --b24-r-tile:14px; --b24-r-pill:999px;
  /* spacing */
  --b24-s1:4px; --b24-s2:8px; --b24-s3:12px; --b24-s4:16px; --b24-s5:20px;
  --b24-s6:24px; --b24-s8:32px; --b24-s10:40px; --b24-s12:48px; --b24-s16:64px;
  /* shadows */
  --b24-shadow-card:0 10px 30px rgba(0,102,161,.12);
  --b24-shadow-navy:0 14px 34px rgba(0,78,124,.30);
  /* type */
  --b24-font-display:'Montserrat',system-ui,'Segoe UI',Arial,sans-serif;
  --b24-font-body:'Montserrat',system-ui,'Segoe UI',Arial,sans-serif;
}

/* =============================================================================
   2. WEB LAYOUT — ours. The kit has no web/form layer (brand-spec.md §6).
   ========================================================================== */
*{box-sizing:border-box}
/* The header is sticky, so an anchored jump would otherwise land the target
   underneath it. scroll-padding keeps the destination visible. */
html{scroll-behavior:smooth; scroll-padding-top:76px;
  scroll-padding-bottom:calc(var(--b24x-navbar-h, 96px) + var(--b24-s5))}
body{
  margin:0; font-family:var(--b24-font-body); color:var(--b24-text);
  background:var(--b24-page-cool); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px; margin:0 auto; padding:0 var(--b24-s6)}
section{scroll-margin-top:76px}

/* focus ring — visible for keyboard users everywhere (brand-spec §6.2) */
:focus-visible{outline:3px solid var(--b24-cyan); outline-offset:2px; border-radius:6px}

/* ---- header ----
   Opaque, not translucent: over the navy hero a semi-transparent bar let the
   headline ghost through and the white/navy junction read as one bruised band.
   A hairline plus a soft shadow gives the sticky bar a real edge on both the
   navy hero and the pale page below it. */
.hdr{position:sticky; top:0; z-index:40; background:var(--b24-white);
  border-bottom:1px solid var(--b24-line); box-shadow:0 2px 10px rgba(0,102,161,.10)}
.hdr-in{display:flex; align-items:center; gap:var(--b24-s5); padding:var(--b24-s3) 0}
/* lockup sizing lives in css/brand-ext.css (.b24x-cobrand__b24) */
.hdr-sp{flex:1}
.switch{display:inline-flex; background:var(--b24-card); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-pill); padding:3px}
.switch button{
  appearance:none; border:0; background:transparent; cursor:pointer;
  font:600 13px/1 var(--b24-font-body); color:var(--b24-text-mute);
  padding:8px 14px; border-radius:var(--b24-r-pill);
}
.switch button[aria-pressed="true"]{background:var(--b24-white); color:var(--b24p-deep);
  box-shadow:0 1px 3px rgba(0,102,161,.18)}
.sw-lab{font:600 12px/1 var(--b24-font-body); color:var(--b24-text-mute);
  text-transform:uppercase; letter-spacing:.06em; margin-right:var(--b24-s2)}
/* Полоса режима реализации. Подсказка длинная намеренно (она несёт всё
   обоснование), поэтому ширина ограничена по числу знаков, а не по колонке
   сетки: в три клетки grid-co этот текст читался бы столбиком в 20 символов. */
.real-strip .field{gap:var(--b24-s2)}
.real-strip .switch{align-self:flex-start; flex-wrap:wrap}
.real-strip .hint{max-width:88ch}
@media (max-width:560px){ .real-strip .switch{width:100%}
  .real-strip .switch button{flex:1 1 auto} }

/* ---- hero: navy sheet, signature radial gradient only ----
   Padding trimmed: 64/48 left a dead navy band under the pills that read as
   "the hero got cut off". The headline is widened so the sheet does not sit
   two-thirds empty at 1440. */
.hero{background:var(--b24-grad-partner-navy); color:var(--b24-on-navy);
  padding:var(--b24-s12) 0 var(--b24-s10)}
.hero h1{font:800 clamp(30px,4.2vw,50px)/1.12 var(--b24-font-display); margin:0 0 var(--b24-s4);
  letter-spacing:-.01em; max-width:26ch}
.hero p{margin:0; color:var(--b24-on-navy-soft); font-size:17px; max-width:70ch}
/* one row of equal pills instead of a ragged 2 + 1 wrap */
.hero-pills{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:var(--b24-s2); margin-top:var(--b24-s6)}
.pill{display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.24); color:var(--b24-on-navy);
  border-radius:var(--b24-r-pill); padding:7px 14px; font-size:13.5px; font-weight:500}
.pill img{width:16px; height:16px}

/* ---- sections ---- */
section{padding:var(--b24-s12) 0}
.sec-h{font:700 13px/1 var(--b24-font-body); text-transform:uppercase; letter-spacing:.1em;
  color:var(--b24-deep); margin:0 0 var(--b24-s3)}
/* The original singles out the VibeCode group with an orange sheet (#d47320) — a
   colour that is not in the Bitrix24 partner palette. Same emphasis, on-brand:
   the kit's green as a PLATE with deep-blue ink (green is never used as text). */
.sec-h--accent{display:inline-block; background:var(--b24-green);
  color:var(--b24-lime-ink); border-radius:var(--b24-r-pill); padding:6px 14px}
h2{font:700 clamp(20px,2.4vw,28px)/1.2 var(--b24-font-display); margin:0 0 var(--b24-s6);
  color:var(--b24p-deep)}
.note-line{font-size:13.5px; color:var(--b24-text); margin:0 0 var(--b24-s6); max-width:80ch}

/* ---- cards ---- */
.card{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); box-shadow:var(--b24-shadow-card); padding:var(--b24-s6)}
/* Three columns, not auto-fit four: the company block has six fields and the
   economics block three, so a 3-wide grid fills every row exactly instead of
   leaving half a row of dead space on the right. */
.grid-co{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--b24-s5) var(--b24-s5)}
@media (max-width:860px){ .grid-co{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .grid-co{grid-template-columns:1fr} }

/* ---- form field ---- */
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:13px; font-weight:600; color:var(--b24-text)}
.field .hint{font-size:12px; color:var(--b24-text)}
.in-wrap{position:relative; display:flex; align-items:center}
.in-wrap input{width:100%}
/* unit suffix: --b24-text, not --b24-text-mute. At 12.5px the mute tone is
   3.88:1 on white, below WCAG AA, and brand-spec §1 permits it only from 18px
   (or 14px bold). See .b24x-unit in css/brand-ext.css. */
.in-wrap .suf{position:absolute; right:14px; font-size:12.5px; color:var(--b24-text);
  pointer-events:none; font-weight:600}
.in-wrap input{padding-right:64px}
/* РЕЗЕРВ ПОД ЕДИНИЦУ-СЛОВО. Прежняя «pcs» была 22px, и фиксированных 64px хватало
   всем. Слова шире: замерено на 1440/1280/1024/390 — calls 40, lookups 51,
   enquiries 60, bookings 60, meetings 61, operations 69, documents 74. Под самое
   широкое нужно 74 + 14 (отступ справа) + 8 (воздух) = 96, берём 100.
   Ключ в селекторе — тот же f.suf, что у поля: ничего не угадывается, и новая
   единица без своей строки здесь сразу видна по наезду. */
.in-wrap[data-suf="calls"] input, .in-wrap[data-suf="ops"] input,
.in-wrap[data-suf="enq"] input, .in-wrap[data-suf="lookups"] input,
.in-wrap[data-suf="bookings"] input, .in-wrap[data-suf="docs"] input,
.in-wrap[data-suf="meetings"] input{padding-right:100px}
.field .err{display:none; font-size:12px; color:var(--b24x-error-ink); font-weight:600}
.field.invalid .err{display:block}
/* Плашка происхождения — кнопка, но выглядит плашкой: приподнятого вида ей не
   нужно, нужен курсор и подчёркивание при наведении, чтобы было видно, что она
   нажимается. Красный не используется: он занят валидацией. */
/* Поле состава работ — на всю ширину ряда: одна строка в узкой клетке приглашает
   написать три слова, а нужен абзац. */
/* Чек-лист диалога печати: та же подсказка по кеглю, но с рамкой и полужирными
   значениями — он читается как памятка, а не как пояснение. Красный не используется:
   он занят валидацией. */
/* Полоса пресетов. Кнопки в один ряд, переносятся на узком экране; «очистить»
   отделён отступом — он про обратное действие и не должен читаться как ещё один
   профиль. */
.b24x-preset-card{margin-bottom:var(--b24-s6)}
.b24x-preset-row{display:flex; flex-wrap:wrap; gap:var(--b24-s2); margin-top:var(--b24-s3)}
.b24x-preset-row .b24x-preset-clear{margin-left:auto}
@media (max-width:640px){ .b24x-preset-row .b24x-preset-clear{margin-left:0} }
.b24x-print-check{border:1px solid var(--b24-line); border-radius:var(--b24-r-inner);
  padding:10px 12px; background:var(--b24-card)}
.b24x-print-check b{color:var(--b24-deep); font-weight:700}
.b24x-scope-field{grid-column:1/-1}
.b24x-scope-field textarea{width:100%; resize:vertical; min-height:76px;
  font:inherit; line-height:1.45; padding:10px 12px}
.est-btn{border:0; font:inherit; cursor:pointer; text-transform:inherit; letter-spacing:inherit}
/* Плашка происхождения — КНОПКА (открывает полную строку). У неё была рамка, и
   рамка сама намекала на нажимаемость; у безрамочных её заменяет точечное
   подчёркивание — обычный для интерфейсов знак «термин с пояснением». */
.est:not(.est--check){text-decoration:underline dotted; text-underline-offset:3px;
  text-decoration-thickness:1px}
.est-btn:hover{text-decoration:underline; text-underline-offset:3px}
.est-btn:focus-visible{outline:2px solid var(--b24-cyan); outline-offset:1px}
/* ==========================================================================
   СИСТЕМА ПОМЕТОК. ЦВЕТ ГОВОРИТ, ТРЕБУЕТ ЛИ ПОМЕТКА ДЕЙСТВИЯ. СЛОВО ГОВОРИТ, ЧТО
   ЭТО ТАКОЕ. Раньше цвет не говорил ничего: роль, ссылка и происхождение имели
   одну заливку, требование тарифа — янтарную заливку предупреждения, а самые
   спорные сценарии («Revenue uplift») были помечены лаймом, то есть цветом
   акцента бренда, который в западном интерфейсе читается как «хорошо, безопасно».

     заливка бледно-голубым  — факт о сценарии, делать ничего не нужно: РОЛЬ
     контур синим            — требование продукта: НУЖЕН ТАРИФ (решение о тарифе,
                               не о числе)
     контур янтарным         — число не проверено и ждёт партнёра: ОЦЕНКИ ВЫРУЧКИ,
                               «our estimate», «ask the client»
     без рамки, тусклым      — происхождение, по которому действовать не нужно:
                               «carried over», «derived», «from coverage»
     ссылка                  — ссылка, а не пометка

   Лайм в ряду пометок больше не появляется НИГДЕ. Разбор предлагал отдать его
   нейтральным ролевым бейджам — не отдаём: роли есть у всех одиннадцати карточек,
   и акцент на каждой перестаёт быть акцентом; а главное — лайм на этом же экране
   уже занят СОСТОЯНИЕМ: номер выбранного сценария становится лаймовым. Отдать тот
   же цвет ещё и роли значит размыть единственный сигнал «этот сценарий выбран».
   Смысл требования разбора — убрать лайм с рискованных пометок — выполнен.

   Рамки сделаны inset-тенью, а не border: у border появились бы лишние 2px, и
   пометки в одном ряду встали бы разной высоты. Свои цвета не вводятся: янтарь —
   токены предупреждения из brand-ext (§2), синий и бледно-голубой — токены кита.
   ========================================================================== */
/* Плашка происхождения (P6) по умолчанию БЕЗ РАМКИ: у поля их бывает по одной на
   строку, и четыре боксика в карточке читались бы как четыре проблемы. Рамка
   появляется только там, где партнёр обязан что-то сделать, — см. .est--check. */
/* background:none обязателен: .est-btn — это <button>, и без явного сброса
   проступает серая заливка браузера по умолчанию (поймано на снимке). */
.est{display:inline-block; background:none; color:var(--b24-text);
  padding:2px 4px; font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:.05em; margin-left:6px; vertical-align:1px}
/* «our estimate» и «ask the client»: число выдумано нами или не спрошено у
   клиента. Единственные два типа происхождения, требующие действия. */
.est--check{color:var(--b24x-warning-ink); border-radius:var(--b24-r-pill);
  padding:2px 8px; box-shadow:inset 0 0 0 1px var(--b24x-warning-ink)}

.rev-toggle{display:flex; align-items:center; gap:10px; cursor:pointer;
  font-size:13px; font-weight:600; color:var(--b24-text); min-height:48px}
.rev-toggle input{width:20px; height:20px; accent-color:var(--b24-deep); cursor:pointer}
.btn-primary{appearance:none; border:0; cursor:pointer; background:var(--b24p-deep);
  color:var(--b24-white); border-radius:var(--b24-r-pill); padding:13px 26px;
  font:700 14px var(--b24-font-body)}
.btn-primary:hover{background:var(--b24p-deep-hi)}
.svc-in{width:130px; text-align:right}
.svc-in::placeholder{font-size:12px; font-weight:500}
.cov-row{display:flex; gap:var(--b24-s5); align-items:flex-start; flex-wrap:wrap;
  background:var(--b24-page-cool); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-inner); padding:var(--b24-s4); margin-top:var(--b24-s4)}
.cov-hint{margin:0; font-size:12.5px; color:var(--b24-text); flex:1; min-width:240px}
.cov-hint--none{background:var(--b24-page-cool); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-inner); padding:var(--b24-s3) var(--b24-s4);
  margin-top:var(--b24-s4)}
.cov-in{width:90px; text-align:right}
/* credibility guard — amber, never red: red is reserved for input validation */
.overlap-warn{grid-column:1/-1; display:flex; gap:var(--b24-s3); align-items:flex-start;
  background:var(--b24x-warning-surface); color:var(--b24x-warning-ink);
  border:1px solid currentColor; border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-top:var(--b24-s4); font-size:13.5px}
.overlap-warn img{width:20px; height:20px; flex:0 0 auto; margin-top:1px}
/* МЯГКОЕ ЗАМЕЧАНИЕ. Ни заливки, ни иконки, ни янтарного: внутри тёмной сводки
   достаточно тонкой рамки и приглушённого текста, чтобы блок читался как
   примечание. Если дать ему тот же вид, что жёсткому, оба станут одним шумом. */
.overlap-note{grid-column:1/-1; background:transparent; color:var(--b24-on-navy-soft);
  border:1px solid rgba(255,255,255,.28); border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-top:var(--b24-s4); font-size:13px}
.overlap-note b{color:var(--b24-on-navy); font-weight:600}
/* Родословная диапазона — своей строкой и мельче тела: это сноска к утверждению,
   а не часть совета. Одинаково в обоих блоках. */
.warn-src{display:block; margin-top:var(--b24-s2); font-size:12px; opacity:.82}
/* Блок про исключённые по ошибке ввода сценарии. Тело — то же, что у
   .overlap-warn: один смысл (предостережение внутри тёмной сводки), один вид.
   Но живёт ВНЕ .sum-grid: он печатается и когда сетки нет вообще — если
   единственный выбранный сценарий невалиден. Поэтому без grid-column. */
.sum-invalid{display:flex; gap:var(--b24-s3); align-items:flex-start;
  background:var(--b24x-warning-surface); color:var(--b24x-warning-ink);
  border:1px solid currentColor; border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-bottom:var(--b24-s4); font-size:13.5px}
.sum-invalid img{width:20px; height:20px; flex:0 0 auto; margin-top:1px}
.hdr .switch[hidden], .hdr .sw-lab[hidden]{display:none}

/* ---- scenario card ---- */
.sc{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); box-shadow:var(--b24-shadow-card);
  margin-bottom:var(--b24-s5); overflow:hidden}
.sc-top{display:flex; gap:var(--b24-s4); padding:var(--b24-s5) var(--b24-s6);
  align-items:flex-start; cursor:pointer}
.sc-top:hover{background:var(--b24-page-cool)}

/* SELECTED state. The original rings the card in its group colour; those four colours
   are not in the partner palette, so the same signal is built from kit tokens only:
   a 2px cyan ring (same 2px the original uses), a tinted head, and the number badge
   flipping to the green plate. Green is a background here, never ink. */
.sc.on{box-shadow:0 0 0 2px var(--b24-cyan), var(--b24-shadow-card)}
.sc.on .sc-top{background:var(--b24-card)}
.sc.on .sc-top:hover{background:var(--b24-card-2)}
.sc-num{flex:0 0 auto; min-width:26px; height:26px; padding:0 7px; border-radius:var(--b24-r-pill);
  background:var(--b24-card); color:var(--b24-deep); font:800 13px/26px var(--b24-font-display);
  text-align:center; margin-top:1px}
.sc.on .sc-num{background:var(--b24-green); color:var(--b24-lime-ink)}
.sc-cb{flex:0 0 auto; margin-top:3px; width:22px; height:22px; accent-color:var(--b24-deep)}
.sc-ttl{flex:1}
.sc-ttl h3{margin:0 0 4px; font:700 17px/1.3 var(--b24-font-display); color:var(--b24p-deep)}
.sc-ttl p{margin:0; font-size:13.5px; color:var(--b24-text)}
.sc-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--b24-s3)}
/* Волосяная рамка тона линий — не «контур» в смысле системы пометок, а способ
   остаться плашкой на ЛЮБОЙ подложке: у выбранной карточки шапка того же цвета,
   что заливка плашки, и роль без рамки читалась как простой текст. */
.tag{background:var(--b24-card); color:var(--b24-deep); border-radius:var(--b24-r-pill);
  padding:3px 10px; font-size:11.5px; font-weight:700;
  box-shadow:inset 0 0 0 1px var(--b24-line)}
/* ПОМЕТКА «НУЖЕН PROFESSIONAL VIBE+» — контур синим, а не янтарная заливка, как
   было. Требование тарифа — не сомнение в числе: оно точно известно и решается
   выбором тарифа. Янтарь после этой правки означает ровно одно — «число не
   проверено», и заливка предупреждения на постоянной пометке этот смысл забирала
   себе на пяти карточках из одиннадцати.
   Живёт здесь, а не в brand-ext.css: .tag тоже страничный, а brand-ext подключён
   РАНЬШЕ — .tag{background} перебивал бы правило при равной специфичности. */
.tag--plan{background:transparent; color:var(--b24-deep);
  box-shadow:inset 0 0 0 1px var(--b24-deep)}
/* ОЦЕНКА ВЫРУЧКИ. Контур янтарным плюс слово «estimate» в тексте: цветом одним
   этого говорить нельзя — его не видят при дальтонизме и он теряется в печати
   экрана. Отчёт то же самое пишет словом уже давно («Additional: revenue uplift
   (estimate)»), экран отставал. */
.tag--est{background:transparent; color:var(--b24x-warning-ink);
  box-shadow:inset 0 0 0 1px var(--b24x-warning-ink)}
/* «LEARN MORE» БОЛЬШЕ НЕ ПОМЕТКА. Ссылка в виде плашки выглядела ровно как метка
   роли рядом: одинаковая заливка, одинаковый кегль, и ничто не подсказывало, что
   по ней можно нажать. Теперь это ссылка со стрелкой. */
.tag-link{align-self:center; font-size:11.5px; font-weight:700;
  color:var(--b24-deep); text-decoration:none}
.tag-link:hover{text-decoration:underline}
.tag-link:focus-visible{outline:2px solid var(--b24-cyan); outline-offset:2px;
  border-radius:var(--b24-r-inner)}
.sc-body{display:none; padding:0 var(--b24-s6) var(--b24-s6); border-top:1px solid var(--b24-line)}
.sc.on .sc-body{display:block}
/* Подпись под прочерком в блоке результатов: сценарий только на выручке при
   выключенном переключателе. Кегль и цвет — как у .sc-note, но без плашки:
   это объяснение к строке результата, а не отдельная врезка. */
.res-note{font-size:12.5px; color:var(--b24-text-mute); margin-top:var(--b24-s2)}
.sc-note{background:var(--b24-card); border-radius:var(--b24-r-inner);
  padding:var(--b24-s3) var(--b24-s4); font-size:12.5px; margin:var(--b24-s4) 0 0}
.sc-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
  gap:var(--b24-s5); margin-top:var(--b24-s5)}
@media (max-width:860px){ .sc-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .sc-grid{grid-template-columns:1fr} }
.seg{border:1px dashed var(--b24-dashed); border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-top:var(--b24-s4)}
/* Заголовок сегмента несёт кнопку удаления: подпись слева, действие справа.
   Кнопка живёт в шапке, а не рядом с полями, чтобы не конкурировать с вводом. */
.seg-h{font-size:12px; font-weight:700; color:var(--b24-deep); text-transform:uppercase;
  letter-spacing:.06em; margin-bottom:var(--b24-s3);
  display:flex; align-items:center; justify-content:space-between; gap:var(--b24-s3)}
.btn-add{appearance:none; background:transparent; border:1px dashed var(--b24-dashed);
  color:var(--b24-deep); border-radius:var(--b24-r-pill); padding:8px 16px;
  font:600 13px var(--b24-font-body); cursor:pointer; margin-top:var(--b24-s4)}
.btn-add:hover{background:var(--b24-card)}

/* ---- scenario result ---- */
.res{margin-top:var(--b24-s5); border-top:1px solid var(--b24-line); padding-top:var(--b24-s4)}
.res-row{display:flex; justify-content:space-between; gap:var(--b24-s4);
  padding:7px 0; font-size:13.5px; border-bottom:1px solid var(--b24-page-cool)}
.res-row:last-child{border-bottom:0}
.res-row .lbl{color:var(--b24-text)}
.res-row .val{font-weight:700; color:var(--b24p-deep); white-space:nowrap}
.res-row .val.rev{color:var(--b24-deep)}
.bd{background:var(--b24-page-cool); border-radius:var(--b24-r-inner);
  padding:var(--b24-s3) var(--b24-s4); font-size:12.5px; margin-bottom:var(--b24-s3)}
.bd div{display:flex; justify-content:space-between; gap:var(--b24-s4); padding:2px 0}
.int-in{width:120px; text-align:right}
.info-btn{appearance:none; background:transparent; border:0; cursor:pointer; padding:2px;
  color:var(--b24-deep); width:22px; height:22px; vertical-align:-5px}
.info-btn svg{width:16px; height:16px}

/* ---- summary ---- */
.sum{background:var(--b24-grad-partner-navy); color:var(--b24-on-navy);
  border-radius:var(--b24-r-card); padding:var(--b24-s8); box-shadow:var(--b24-shadow-navy)}
.sum h2{color:var(--b24-on-navy); margin-bottom:var(--b24-s5)}
.sum-grid{display:grid; grid-template-columns:1fr auto auto; gap:10px var(--b24-s6); align-items:center}
.sum-grid .h{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--b24-on-navy-soft); text-align:right}
.sum-grid .h:first-child{text-align:left}
.sum-grid .lbl{font-size:14px}
.sum-grid .num{text-align:right; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums}
.sum-line{grid-column:1/-1; height:1px; background:rgba(255,255,255,.22); margin:var(--b24-s3) 0}
.fullrow{grid-column:1/-1; display:flex; justify-content:space-between; gap:var(--b24-s4);
  font-size:14px; align-items:baseline}
.fullrow .v{font-weight:700; white-space:nowrap}
.fullrow.net{font-size:17px; font-weight:800}
.verdict{grid-column:1/-1; display:flex; gap:var(--b24-s3); align-items:flex-start;
  background:var(--b24-green); color:var(--b24-lime-ink); border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-top:var(--b24-s4); font-size:14px; font-weight:600}
.verdict img{width:20px; height:20px; flex:0 0 auto; margin-top:1px}
/* negative case: never a red number — neutral surface, wording carries it */
.verdict.neg{background:rgba(255,255,255,.14); color:var(--b24-on-navy);
  border:1px solid rgba(255,255,255,.28)}
.sum .empty{color:var(--b24-on-navy-soft); font-size:14px}
/* the clarification sits directly under the headline number, spanning the grid */
.fot-meaning{grid-column:1/-1; font-size:12.5px; color:var(--b24-on-navy-soft);
  margin:-2px 0 var(--b24-s2); max-width:78ch}
/* Имя режима внутри строки — полужирным: это единственное слово в сводке, которое
   партнёр может переключить, и глаз обязан находить его без чтения. */
.fot-real b{color:var(--b24-on-navy); font-weight:700}
.hint.logo-err{color:var(--b24x-warning-ink); font-weight:600}
.qual{grid-column:1/-1; font-size:13px; color:var(--b24-on-navy-soft); margin-top:var(--b24-s3)}

/* ---- vibe+ transition ---- */
.tr-grid{display:grid; grid-template-columns:1fr auto 1fr; gap:var(--b24-s5); align-items:stretch}
.tr-col{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); padding:var(--b24-s5)}
.tr-col.to{background:var(--b24-grad-partner-light); border-color:var(--b24-dashed)}
.tr-k{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--b24-text-mute); margin-bottom:6px}
.tr-name{font:700 18px/1.25 var(--b24-font-display); color:var(--b24p-deep); margin-bottom:var(--b24-s3)}
.tr-price{font:800 26px/1 var(--b24-font-display); color:var(--b24p-deep);
  font-variant-numeric:tabular-nums}
.tr-per{font-size:12.5px; color:var(--b24-text); margin-top:4px}
.tr-arrow{display:flex; align-items:center; justify-content:center; color:var(--b24-deep)}
.tr-arrow svg{width:30px; height:30px}
.tr-rows{margin-top:var(--b24-s4); border-top:1px solid var(--b24-line); padding-top:var(--b24-s3)}
.tr-rows div{display:flex; justify-content:space-between; gap:var(--b24-s4); font-size:13px; padding:3px 0}
.tr-rows b{color:var(--b24p-deep)}
.partner-only{display:inline-flex; align-items:center; gap:6px; background:var(--b24-green);
  color:var(--b24-lime-ink); border-radius:var(--b24-r-pill); padding:3px 10px;
  font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em}
.gap-card{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); padding:var(--b24-s5); margin-top:var(--b24-s5)}
.gap-rows{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:var(--b24-s4); margin-top:var(--b24-s4)}
.gap-box{background:var(--b24-page-cool); border-radius:var(--b24-r-inner); padding:var(--b24-s4)}
.gap-n{font:800 24px/1 var(--b24-font-display); color:var(--b24p-deep)}
.gap-l{font-size:12.5px; color:var(--b24-text); margin-top:6px}
.ai-list{list-style:none; margin:var(--b24-s4) 0 0; padding:0; display:grid; gap:10px}
.ai-list li{display:flex; gap:10px; align-items:flex-start; font-size:13.5px}
.ai-list img{width:18px; height:18px; flex:0 0 auto; margin-top:2px}

/* ---- warning strip (missing data / stub language) ---- */
.warn{background:var(--b24x-warning-surface); color:var(--b24x-warning-ink);
  border:1px solid currentColor; border-radius:var(--b24-r-inner);
  padding:var(--b24-s3) var(--b24-s4); font-size:13px; font-weight:600;
  display:flex; gap:10px; align-items:flex-start; margin-bottom:var(--b24-s5)}
.warn img{width:18px; height:18px; flex:0 0 auto; margin-top:1px}
.warn[hidden]{display:none}
/* Список недоступных сценариев внутри полосы предупреждения. .warn — флексбокс
   с иконкой слева, текст живёт во втором ребёнке; маркеры втягиваем внутрь,
   чтобы они не выпадали под иконку. Полоса целиком набрана в 600 — названиям
   сценариев здесь 500: это данные, а не акцент. */
.warn-list{margin:var(--b24-s2) 0 0; padding-left:18px; font-weight:500}
.warn-list li{margin:2px 0}

/* ---- sticky nav bar ---- */
.navbar{position:sticky; bottom:0; z-index:30; background:var(--b24-grad-partner-navy);
  color:var(--b24-on-navy); box-shadow:0 -8px 24px rgba(0,78,124,.24)}
.navbar-in{display:flex; align-items:center; gap:var(--b24-s3) var(--b24-s5);
  /* Боковые отступы — те же, что у .wrap: shorthand «padding: X 0» их обнулял, и
     содержимое полосы стояло вплотную к краю экрана, в отличие от всей страницы. */
  padding:var(--b24-s3) var(--b24-s6); flex-wrap:wrap}
.navbar .cnt{font-size:13px; color:var(--b24-on-navy-soft); font-weight:600}

/* ---- итог в полосе: ДВЕ цифры, у каждой свой период ----
   Раньше здесь стояла одна сумма без периода («Payroll saving: $19,893») — она за
   месяц, но узнать это было негде. И кегль был 14px при тексте страницы 15px:
   главный результат калькулятора оказывался мельче окружающего.
   Зелёный — только плашка, текст на ней navy (brand-spec §5.1). */
.nav-tot{display:flex; align-items:flex-end; gap:var(--b24-s2) var(--b24-s4);
  flex-wrap:wrap; min-width:0}
.nav-k{font-size:12.5px; font-weight:600; color:var(--b24-on-navy-soft); align-self:center}
.nav-fig{display:flex; flex-direction:column; gap:2px; min-width:0}
.nav-fig i{font-style:normal; font:700 10.5px/1.2 var(--b24-font-body);
  letter-spacing:.09em; text-transform:uppercase; color:var(--b24-on-navy-soft)}
.nav-fig b{background:var(--b24-green); color:var(--b24-lime-ink);
  border-radius:var(--b24-r-pill); padding:2px 12px; white-space:nowrap;
  font:800 22px/1.3 var(--b24-font-display); font-variant-numeric:tabular-nums;
  display:inline-block}
.nav-fig .l-long{display:none}

/* Узко: ведущее слово уходит, период берёт полную форму, цифра чуть меньше.
   Счётчик — своей строкой. Полоса остаётся в две строки, а не в три-четыре.

   ПОДПИСЬ ВСТАЁТ В СТРОКУ СО ЗНАЧЕНИЕМ, А НЕ НАД НИМ. Замер на 390x844: полоса
   занимала 147px, то есть 17% экрана в браузере без адресной строки и заметно
   больше в настоящем — поле ввода под ней оказывалось наполовину перекрытым.
   147px складывались из отбивки 24, строки счётчика 19 и ДВУХ рядов цифр по 44
   (подпись над плашкой), плюс зазоры. Столбик «подпись сверху, плашка снизу»
   стоит здесь дороже всего: он удваивает высоту каждого ряда ради выравнивания,
   которого на телефоне всё равно не видно — рядов-то один-два.
   Кладём подпись слева от плашки по базовой линии: ряд с 44px падает до 26px.
   Обе цифры с периодами остаются на месте, и подпись выручки остаётся полной
   («Revenue + base potential, month») — она называет оба слагаемых, и сокращать
   её обратно до «Potential» нельзя, это разошлось бы с решением приёмки.
   Стало 90px вместо 147 — на 39% ниже. Отступ снизу у страницы считается от
   ФАКТИЧЕСКОЙ высоты (syncNavbarInset + ResizeObserver), поэтому цифры в этом
   правиле ничего не фиксируют: полоса станет выше или ниже — отступ поедет
   следом сам. */
@media (max-width:560px){
  .navbar-in{gap:var(--b24-s1) var(--b24-s3); padding:var(--b24-s2) var(--b24-s6)}
  .hdr-sp{display:none}
  /* ГРУППА ЦИФР РАСТВОРЯЕТСЯ, И ВСЁ СТАНОВИТСЯ ОДНИМ ПЕРЕНОСЯЩИМСЯ РЯДОМ.
     display:contents убирает саму коробку .nav-tot из раскладки, оставляя её
     детей прямыми элементами полосы. Зачем: ведущее слово «Payroll saving»
     живёт ВНУТРИ этой группы, а нужно оно на строке счётчика — иначе с
     короткими подписями «Month» и «Year» на телефоне негде прочитать, что это
     за деньги. Переносить его в разметку нельзя: на широком экране оно стоит
     справа, у самых цифр, а счётчик — слева. Так одно правило CSS решает то,
     ради чего пришлось бы держать два разных куска разметки. */
  .nav-tot{display:contents}
  .navbar .cnt{flex:0 1 auto; font-size:11px; line-height:1.3}
  .nav-k{display:inline; order:-1; font-size:11px; line-height:1.3}
  /* Короткая форма периода: ведущее слово теперь есть на строке выше, и полная
     форма («Saving / month», 87px) больше не нужна — с ней две плашки в строку
     не помещались, 187 + 187 против полосы 342. */
  .nav-fig .l-short{display:inline}
  .nav-fig .l-long{display:none}
  /* Подпись и плашка в одну строку по базовой линии: ряд с 44px падает до 24. */
  .nav-fig{flex-direction:row; align-items:baseline; gap:6px}
  .nav-fig i{font-size:9px; letter-spacing:.05em}
  .nav-fig b{font-size:17px; padding:1px 9px; line-height:1.3}
  /* Строка выручки называет оба слагаемых полностью и уходит своей строкой:
     сокращать её до «Potential» нельзя — это решение приёмки. */
  .nav-fig--wide{flex:1 1 100%}
  .nav-fig--wide .l-short{display:none}
  .nav-fig--wide .l-long{display:inline}
}

/* ---- modal ---- */
.ov{position:fixed; inset:0; background:rgba(4,33,63,.55); display:flex;
  align-items:center; justify-content:center; padding:var(--b24-s5); z-index:60}
.ov[hidden]{display:none}
.mdl{background:var(--b24-white); border-radius:var(--b24-r-card); max-width:560px;
  width:100%; padding:var(--b24-s8); position:relative; max-height:85vh; overflow:auto}
.mdl h3{margin:0 0 var(--b24-s3); font:700 20px var(--b24-font-display); color:var(--b24p-deep)}
.mdl p{margin:0; font-size:14px}
.mdl-x{position:absolute; top:12px; right:12px; appearance:none; background:var(--b24-card);
  border:0; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:20px;
  color:var(--b24-deep); line-height:1}

/* The navbar is sticky at the bottom, so it floats over whatever is scrolled
   under it. Reserve its height at the end of the page — without this the tail of
   every hint and the footer text read as cut off mid-word.

   ВЫСОТА МЕРЯЕТСЯ, А НЕ ЗАДАЁТСЯ ЧИСЛОМ. Раньше здесь стояло --b24-s16 (64px), и
   на мобильной этого уже не хватало: полоса там 100px, потому что счётчик уходит
   на свою строку. Теперь syncNavbarInset() кладёт фактическую высоту в
   --b24x-navbar-h, и любое будущее изменение полосы не оставит хвост подсказок
   под ней. Фолбэк 96px — на случай отключённого JS. */
main.wrap{padding-bottom:calc(var(--b24x-navbar-h, 96px) + var(--b24-s5))}
.foot{padding:var(--b24-s8) 0 var(--b24-s10); font-size:12.5px; color:var(--b24-text)}


@media (max-width:820px){
  .tr-grid{grid-template-columns:1fr}
  .tr-arrow{transform:rotate(90deg)}
  .sum-grid{grid-template-columns:1fr auto}
  .sum-grid .h.year,.sum-grid .num.year{display:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <!-- Two separate marks, never a combined lockup. The gap is the clock-glyph
         clear space from css/brand-ext.css (--b24x-clearspace); with no partner
         logo the second element is hidden and the gap collapses with it. -->
    <div class="b24x-cobrand">
      <a class="b24x-cobrand__b24" href="#top"><img src="assets/logo-partner-h.png" alt="Bitrix24 Partners"></a>
      <img class="b24x-cobrand__partner" id="hdr-partner-logo" alt="" hidden>
    </div>
    <div class="hdr-sp"></div>
    <!-- EN + USD scope: hidden in the markup so they never paint, not even for a
         frame before applyStatic() runs. The controls and their handlers stay in
         place — flip SHOW_LANG_SWITCH / SHOW_CUR_SWITCH to bring them back. -->
    <span class="sw-lab" data-i18n="ui.lang" hidden></span>
    <div class="switch" id="sw-lang" role="group" hidden>
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
    </div>
    <span class="sw-lab" data-i18n="ui.cur" hidden></span>
    <div class="switch" id="sw-cur" role="group" hidden>
      <button type="button" data-cur="EUR" aria-pressed="true">EUR</button>
      <button type="button" data-cur="USD" aria-pressed="false">USD</button>
    </div>
  </div>
</header>

<div class="hero" id="top">
  <div class="wrap">
    <h1 data-i18n="ui.heroTitle"></h1>
    <p data-i18n="ui.heroSub"></p>
    <div class="hero-pills" id="hero-pills"></div>
  </div>
</div>

<main class="wrap">

  <div class="warn" id="warn-de" hidden>
    <img src="assets/icons/alert.svg" alt=""><span data-i18n="ui.deStub"></span>
  </div>

<script>
"use strict";

/* =============================================================================
   ECONOMIC CONSTANTS
   Every number that also appears in an explanatory text lives HERE and is
   injected into the copy as a {placeholder}. Never type a figure into a
   translated string: EN and DE would drift apart on the first edit.
   ========================================================================== */
const C = {
  // Working days per month — user-editable. The Russian production calendar
  // (22 days / 176 hours) is gone: it is a legal artefact of one country.
  // PUBLIC HOLIDAYS ARE DELIBERATELY NOT MODELLED. In Germany they are set per
  // Bundesland — Bavaria has 13, Berlin 10, and Corpus Christi or Reformation Day
  // apply in some Länder and not others. There is no single national calendar to
  // encode, and inventing an average would make the figure look researched when it
  // is not. The partner sets the number for the client's actual location instead.
  DAYS_MONTH:    21,
  DAY_HOURS:     8,     // length of a working day
  /* ЗДЕСЬ БЫЛА КОНСТАНТА CONTRACT_DAYS: 21, И ЕЁ УБРАЛИ. Разбор P5.

     Что было. Стоимость часа считалась от ФИКСИРОВАННЫХ 168 часов
     (CONTRACT_DAYS x DAY_HOURS), а дневные сценарии масштабировались живым полем
     daysMonth. Оклад при этом месячный. Партнёр, поставивший 24 дня вместо 21,
     получал экономию по дневным сценариям на 14.3% больше — замерено: 433.33
     превращалось в 495.24, ровно 24/21. Поле выглядело справочной настройкой, а
     работало множителем, причём в инструменте, который продаёт консервативность.

     ЧТО В ПРЕЖНЕМ РЕШЕНИИ БЫЛО ВЕРНО, А ЧТО НЕТ. Комментарий, стоявший здесь,
     объяснял разведение так: «привязка стоимости часа к редактируемому полю
     заставляла величины сокращать друг друга (часов больше, но каждый час дешевле),
     и правка поля почти ни на что не влияла».

     Наблюдение было верным — сокращение действительно происходило. Неверным был
     вывод. Сокращение — это и есть правильная арифметика: при том же окладе более
     длинный месяц делает час дешевле ровно во столько же раз, во сколько прибавилось
     часов. Поле, которое честно ни на что не влияет, надо ТАК И ПОДПИСАТЬ, а не
     заставлять влиять, сломав тождество. Различие «дни, которые покрывает оклад»
     против «дни, когда инструментом пользуются» осмысленно как понятие, но в модели
     второй величины нет: оклад месячный, и другого знаменателя у него не бывает.

     Стало: оплачиваемые часы = daysMonth x DAY_HOURS, то есть ставка считается от
     ТОГО ЖЕ числа дней, что и масштаб. Дневные сценарии перестали зависеть от поля.
     Инвариант закреплён отдельной проверкой — scripts/check-invariants.mjs. */
  BURDEN_PCT:    30,    // employer payroll burden, % on top of gross — NEUTRAL DEFAULT,
                        // country-dependent, user-editable. Replaces the RU 1.4 multiplier.
  MEETING_GAIN:  0.15,  // meetings shorter / fewer participants (scenario 6)
  BASE_UPLIFT:   0.10,  // baseline efficiency uplift for all staff (scenario 7)
  /* ДВА ПОРОГА ДОСТОВЕРНОСТИ, И ОНИ ОТВЕЧАЮТ НА РАЗНЫЕ ВОПРОСЫ.
     Раньше был один — 25%, — и он молча пропускал вдвое больше того, что мы сами
     называем реальным потолком внедрений. Отсутствие предупреждения партнёр
     читает как «расчёт в норме», то есть молчание инструмента работало как
     подтверждение. Это P3 разбора (docs/REVIEW_2026-08.md).

     Числа разные потому, что утверждения разные:

       OVERLAP_NOTE_PCT (15%) — БЕНЧМАРК. «Внутри диапазона, в который обычно
         попадают кросс-функциональные внедрения, или уже выше него?» Мягкое
         замечание, подсказка, не тревога.

       OVERLAP_WARN_PCT (25%) — АРИФМЕТИКА. «Правдоподобно ли это вообще?»
         25% ФОТ — это примерно 10 часов в неделю, снятых с КАЖДОГО сотрудника
         компании. За такой цифрой почти всегда стоит двойной счёт одного и того
         же рабочего дня в нескольких сценариях, а не выигрыш. Формулировка и
         число не менялись.

     ОТКУДА 15. Диапазон, который мы называем типичным, — «единицы — низкие
     десятки процентов ФОТ». «Низкие десятки» — это 13-15, значит верхний край
     диапазона около 13%. Порог обязан стоять ВЫШЕ края, а не внутри: замечание,
     срабатывающее на расчёте, который мы сами называем типичным, — это ложная
     тревога по определению. 15% — первое круглое число выше края.

     ПОЧЕМУ НЕ 12%, КАК ПРЕДЛАГАЛ РАЗБОР. Двенадцать процентов лежат ВНУТРИ
     диапазона (это ещё «низкие десятки»), и на момент решения режим «ожидаемо» на
     нетронутых дефолтах со всеми одиннадцатью сценариями давал 12.66% — порог на
     12 горел бы при первом же открытии калькулятора в среднем режиме, а
     предупреждение, которое горит всегда, читать перестают (это уже проходили с
     предохранителем по выручке, см. дефолты сценария 5). После снижения двух
     дефолтов там 10.08%, то есть даже порог на 12 уже не горел бы, — но довод от
     верхнего края диапазона никуда не делся, и именно он держит 15%.

     ЗАПАС ПО РЕЖИМАМ, на дефолтах со всеми одиннадцатью сценариями:
       консервативно 6.21%  — молчит с запасом
       ожидаемо     10.08%  — молчит, запас 4.9 п.п.
       оптимистично 13.19%  — молчит, запас 1.8 п.п.
     Молчат ВСЕ ТРИ. До снижения двух дефолтов (сц. 1 время после звонка 10 -> 5
     мин, сц. 9 операции 30 -> 15) было 7.79 / 12.66 / 16.55, и верхний режим
     мягкое замечание получал. Порога это не касается и не должно: 15% выбраны от
     верхнего края типичного диапазона (около 13%), а не от того, где стоят
     дефолты. Дефолты сдвинулись — запас вырос, порог остался на своём основании.
     Мягкую ветку прогоняют состояние I в check-golden и фикстура
     calc-state-overlap-soft.json: они задают ввод литералами и к дефолтам
     равнодушны. Собрать её ЗАНОВО из нынешних дефолтов уже нельзя — выйдет
     13.19% и молчание.

     У ДИАПАЗОНА НЕТ ВНЕШНЕГО ИСТОЧНИКА, и в интерфейсе это сказано прямо
     (ui.overlapSource). Это наша оценка, не данные вендора и не публикация. Если
     у Битрикс24 появится своя позиция по защищаемому уровню — оба порога
     приводятся к ней. См. docs/CALC_MODEL.md §9.

     Оба предупреждения НЕ БЛОКИРУЮТ расчёт и ничего не обрезают: у партнёра
     может быть защищаемый случай, и решение остаётся за ним. */
  OVERLAP_NOTE_PCT: 15,
  OVERLAP_WARN_PCT: 25,
  /* ПОРОГ ПРАВДОПОДОБНОСТИ ДЛЯ ВЫРУЧКИ. Тот же 25%, что у экономии ФОТ, и число
     повторено намеренно, а не сведено в одну константу: рассуждение одинаковое
     («больше четверти пула — это уже не прирост, а переписывание бизнеса»), но
     пулы разные, и завтра одна половина может поехать без другой.

     С ЧЕМ СРАВНИВАЕМ. Оборота компании в модели нет и выдумывать его нельзя.
     Зато у каждой строки выручки есть пул, из которого она черпает, и партнёр
     уже вписал его сам:
       • прирост выручки (сценарий 1) — доля годового плана продаж команды,
         plan x mgr x 12;
       • потенциал базы (сценарий 5) — доля стоимости всей базы, купившей по
         одному разу, base x check.
     Пулы складываются в один годовой ориентир, прогноз сравнивается с ним.
     Пул объявляется рядом с формулой (поле revPool у сценария), а не собирается
     здесь по id: сценарий с эффектом на выручку, заведённый завтра, обязан
     сказать, из чего он черпает, иначе он просто не попадёт в знаменатель и
     тихо ослабит предохранитель. */
  REV_WARN_PCT: 25,
};

/* Live, user-editable economics. */
let daysMonth = C.DAYS_MONTH;
let burdenPct = C.BURDEN_PCT;
const burdenMult = () => 1 + (burdenPct / 100);
/* ОПЛАЧИВАЕМЫЕ ЧАСЫ В МЕСЯЦЕ — ОТ ТОГО ЖЕ ЧИСЛА ДНЕЙ, ЧТО И МАСШТАБ СЦЕНАРИЕВ.
   Одна величина, а не две: оклад месячный, и знаменателя у него ровно один —
   сколько часов этот месяц содержит. Смотри вывод у убранной CONTRACT_DAYS выше.

   ЧТО ИЗ ЭТОГО СЛЕДУЕТ ПО ТИПАМ СЦЕНАРИЕВ — все три следствия правильные:
     дневные (driver:"daily")   — часы растут с днями, час дешевеет ровно во
       столько же раз, ДЕНЬГИ НЕ МЕНЯЮТСЯ. Меняется только распределение внутри
       месяца, а не итог, и это честный ответ: то же дело, разложенное на большее
       число дней, не становится дороже.
     месячные (driver:"monthly") — объём задан в месяц и от дней не зависит, а час
       дешевеет, поэтому деньги ПАДАЮТ с ростом дней. Тоже верно: фиксированный
       блок работы — меньшая доля более длинного оплаченного месяца.
     доля стоимости (driver:"share") — берут долю месячной стоимости напрямую,
       деньги не меняются вовсе; часы растут, потому что доля более длинного
       месяца — это больше часов.
   Ни в одну сторону поле больше не работает рычагом завышения: поднять дни
   значит либо не изменить ничего, либо уменьшить итог. */
const contractHours = () => daysMonth * C.DAY_HOURS;
const costHour   = sal => sal * burdenMult() / contractHours();
const costMinute = sal => costHour(sal) / 60;

/* Revenue uplift is OFF by default: it is a projection, not a saving the client can
   verify. The partner turns it on knowingly. Existing-base potential is a separate
   line and is governed by the same switch. */
let SHOW_REVENUE = false;

/* =============================================================================
   REALISATION — КАКАЯ ДОЛЯ НАЗВАННОГО ВРЕМЕНИ ДЕЙСТВИТЕЛЬНО ИСЧЕЗАЕТ
   Один переключатель на весь расчёт, а не поле у каждого сценария.

   ЧТО ОН ЛЕЧИТ. Охват отвечает на вопрос «кого касается сценарий». На вопрос
   «какая доля названного времени реально уходит» модель до сих пор не отвечала —
   она молча брала 100%. То есть предполагалось, что CoPilot убирает названные
   десять минут на звонок без остатка: без проверки, без правки, без исключений,
   без привыкания. Ни одно внедрение так не работает, и возврат 23:1 за первый
   год брался ровно отсюда.

   ПОЧЕМУ ОДИН НА ВСЁ, А НЕ ПОЛЕ У СЦЕНАРИЯ. Поле у каждого — это одиннадцать
   спорных дефолтов вместо одного и одиннадцать разговоров вместо одного. Один
   переключатель партнёр объявляет вслух («считаем консервативно»), и планку при
   клиенте поднимает он сам — это его аргумент, а не наш навязанный коэффициент.

   ОТКУДА ТРИ ЧИСЛА. Каждое — произведение трёх независимых остатков, а не
   подобранная круглая доля:

       k = (1 − проверка) x (1 − исключения) x освоение

     проверка   — доля названного времени, которая возвращается проверкой и
                  правкой того, что сделал ИИ: расшифровку читают, поля в
                  карточке сверяют, документ вычитывают;
     исключения — доля событий, которые ИИ не берёт вообще (плохая запись,
                  нетиповая сделка, недостающие данные) — там время не
                  сокращается ни на минуту;
     освоение   — средняя доля ПЕРВОГО ГОДА, в течение которой охваченные
                  сотрудники действительно работают по-новому. Именно первого:
                  главная цифра калькулятора — за первый год, и раскатка,
                  обучение и привычка приходятся на него.

     консервативно  0.70 x 0.80 x 0.70 = 0.392 -> 0.40
     ожидаемо       0.80 x 0.88 x 0.92 = 0.648 -> 0.65
     оптимистично   0.90 x 0.95 x 1.00 = 0.855 -> 0.85

   ПОЧЕМУ ПОТОЛОК 0.85, А НЕ 1.0. Единица означает «проверки нет, исключений нет,
   освоение мгновенное и полное» — то есть ровно то допущение, которое эта правка
   и убирает. Оставить её выбираемой значило бы переименовать сломанное число в
   «оптимистично» и ждать, что под давлением сделки его никто не нажмёт. Верхний
   режим обязан оставаться защитимым, поэтому даже в лучшем случае что-то
   остаётся.

   СВЕРКА С СОБСТВЕННОЙ ДОКУМЕНТАЦИЕЙ. README говорит, что реальные
   кросс-функциональные внедрения ИИ дают единицы — низкие десятки процентов ФОТ.
   На дефолтах со всеми одиннадцатью сценариями калькулятор давал 19.5% ФОТ, и
   после введения множителя стало 7.8 / 12.7 / 16.6 — два нижних режима внутрь
   диапазона, верхний выше него. Это была картина на ТЕХ дефолтах.
   Сегодня, после снижения двух дефолтов (сц. 1 время после звонка 10 -> 5 мин,
   сц. 9 операции 30 -> 15), сырая доля 15.5%, а после множителя 6.2 / 10.1 /
   13.2 — внутрь диапазона попадают все три режима. Довод множителя от этого не
   меняется: он про то, что 100% названного времени не исчезает, а не про то, где
   стоят дефолты. При множителе 1.0 «оптимистично» и сейчас дало бы 15.5%, то
   есть выше верхнего края диапазона на нетронутом калькуляторе.

   К ЧЕМУ ПРИМЕНЯЕТСЯ. К экономии ФОТ — всегда. К выручке — ТОЛЬКО там, где она
   выведена из высвобожденного времени (признак revFromTime у сценария). См.
   комментарий у computeScenario: это не двойное занижение, а два разных вопроса
   подряд.
   ========================================================================== */
const REALISATION = [
  {id:"conservative", k:0.40, review:30, exceptions:20, ramp:70},
  {id:"expected",     k:0.65, review:20, exceptions:12, ramp:92},
  {id:"optimistic",   k:0.85, review:10, exceptions:5,  ramp:100},
];
/* КОНСЕРВАТИВНО ПО УМОЛЧАНИЮ — по той же причине, по которой при загрузке не
   выбран ни один сценарий и выключен прогноз выручки: дефолт обязан стоить
   партнёру денег в моменте, иначе он не покупает доверие. */
const REALISATION_DEF = "conservative";
let realisationId = REALISATION_DEF;
const realisationRow = () => REALISATION.find(r => r.id === realisationId) || REALISATION[0];
/* Множитель. Единственная точка, из которой его берёт расчёт. */
const realisation = () => realisationRow().k;
/* Доля в процентах — для копий, где число печатается словами. */
const realisationPct = () => Math.round(realisation() * 100);

  "org.ru":"Carried over from the Russian version of this calculator, where it was the default. There is no benchmark behind it — no study, no vendor data, no partner survey. It was one person's working assumption in another tool. Ask the client for their own figure; if they do not have one, say out loud that this is a starting point.",

     набора — поймала check-geometry. «Aug 17, 2026» человеческая ровно так же и
     короче на три знака. */

function groupFmt(s){
  s = String(s).replace(/\s/g,"").replace(",",".").replace(/[^\d.]/g,"");
  if(s === "") return "";
  const p = s.split(".");
  let i = p[0].replace(/^0+(?=\d)/,""); if(i === "") i = "0";
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return p.length > 1 ? i + "." + p[1] : i;
}
/* РАЗБОР ЧИСЛА ИЗ ТЕКСТА, В ТОМ ЧИСЛЕ ВСТАВЛЕННОГО ИЗ ТАБЛИЦЫ.
   Пробелы всех видов разбирались верно и раньше: \s в JS покрывает и неразрывный
   U+00A0, и узкий U+202F, и тонкий U+2009 — прогон это подтвердил. Ломались
   РАЗДЕЛИТЕЛИ РАЗРЯДОВ: «$4,000» из англоязычной таблицы давало 4, потому что
   первая запятая становилась десятичной точкой. Молчаливая ошибка в тысячу раз,
   в поле оклада.

   ПРАВИЛО: разделитель, за которым стоит РОВНО ТРИ цифры и ничего после, —
   разрядный; иначе десятичный. Отсюда:
     «4,000» и «4.000» -> 4000        «1,234,567» -> 1234567
     «1.234,56» -> 1234.56            «4,5» и «4.5» -> 4.5
   Осознанная плата: «4.000», если имелось в виду ровно четыре, прочитается как
   четыре тысячи. Выбор в пользу разрядного чтения сделан потому, что наш
   собственный форматтер трёхзначной дробной части не печатает никогда, а вставка
   сгруппированного числа — обычное дело.

   ОТРИЦАТЕЛЬНОЕ И НЕЧИСЛО по-прежнему дают 0: минус в поле не набрать, и это
   верно. Значения из ЗАГРУЖЕННОГО ФАЙЛА через эту функцию не проходят — их
   проверяют границы (fieldErrors), а не парсер. */
function parseNum(s){
  let t = String(s).replace(/\s/g,"").replace(/[^\d.,]/g,"");
  const last = Math.max(t.lastIndexOf("."), t.lastIndexOf(","));
  if(last >= 0){
    const tail = t.slice(last + 1);
    const grouped = /^\d{3}$/.test(tail);
    const head = t.slice(0, last).replace(/[.,]/g, "");
    t = grouped ? head + tail : head + "." + tail.replace(/[.,]/g,"");
  }
  const n = parseFloat(t);
  return isFinite(n) && n >= 0 ? n : 0;
}
function onNumInput(inp){
  /* ВСТАВКА С ЗАПЯТОЙ нормализуется до форматирования. groupFmt срезает запятую и
     оставляет точку, поэтому «$4,000» в поле показывалось как «4.000» — значение
     при этом уже верное (4000), но глазами читается как дробь. Прогоняем такой
     ввод через parseNum и переформатируем от числа. Только при наличии запятой:
     при обычном набоpе строка не должна перестраиваться под курсором. */
  if(inp.value.indexOf(",") >= 0) inp.value = String(parseNum(inp.value));
  const old = inp.value, sel = inp.selectionStart;
  const before = old.slice(0, sel).replace(/[^\d]/g,"").length;
  const f = groupFmt(old);
  inp.value = f;
  let c = 0, pos = 0;
  if(before > 0){ for(; pos < f.length; pos++){ if(/\d/.test(f[pos])) c++; if(c >= before){ pos++; break; } } }
  try{ inp.setSelectionRange(pos, pos); }catch(e){}
  return parseNum(f);
}

      return {fot: h * costHour(v.sal), rev:0};
    }},

  { id:10, group:"agents", agent:true, driver:"daily", cov:{src:"empCount", target:"emp", def:30}, link:"https://helpdesk.bitrix24.com/open/25970567/", note:true,
    effect:["fot"],
    fields:[
      {k:"emp",  def:50,   suf:"ppl",   src:"empCount", org:"cov"},
      {k:"sal",  def:4000, suf:"money", src:"empSal", org:"mkt"},
      {k:"q",    def:3,    suf:"lookups", org:"ru"},
      {k:"t",    def:10,   suf:"min", org:"ru"},
      {k:"share",def:0.7,  suf:"share", org:"ru"},
    ],
    hours:v=> v.q * v.t * v.share * daysMonth / 60 * v.emp,
    compute:v=>{
      const h = v.q * v.t * v.share * daysMonth / 60;
      return {fot: h * costHour(v.sal) * v.emp, rev:0};
    }},

  { id:11, group:"agents", agent:true, driver:"daily", cov:{src:"empCount", target:"emp", def:25}, link:null, note:true,
    effect:["fot"],
    fields:[
      {k:"emp",   def:50,   suf:"ppl",   src:"empCount", org:"cov"},
      {k:"empSal",def:4000, suf:"money", src:"empSal", org:"mkt"},
      {k:"empMin",def:20,   suf:"min", org:"ru"},
      {k:"mgr",   def:5,    suf:"ppl", org:"client"},
      {k:"mgrSal",def:6500, suf:"money", org:"mkt"},
      {k:"mgrMin",def:30,   suf:"min", org:"ru"},
    ],
    /* ДВЕ СТАВКИ. В часах слагаемые просто складываются — час сотрудника и час
       руководителя это одинаковые часы; в деньгах они стоят разного. Поэтому
       делением денег на одну ставку эти часы получить нельзя. */
    hours:v=> v.empMin * daysMonth / 60 * v.emp + v.mgrMin * daysMonth / 60 * v.mgr,
    compute:v=>{
      const A = v.empMin * daysMonth / 60 * costHour(v.empSal) * v.emp;
      const B = v.mgrMin * daysMonth / 60 * costHour(v.mgrSal) * v.mgr;
      return {fot:A+B, rev:0, breakdown:[["bd.11.a",A],["bd.11.b",B]]};
    }},

  { id:12, group:"agents", agent:true, driver:"monthly", link:null,
    effect:["fot"],
    fields:[
      {k:"visits",def:800,  suf:"bookings", org:"ru"},
      /* «Звонков на запись» — это НЕ звонки в день, хотя единица та же. Потолок
         сотня: у одной записи не бывает больше сотни звонков. Уточнение объявлено
         у поля — так же, как объявляются пул выручки и часы. */
      {k:"perRec",def:2,    suf:"calls", lim:{max:100}, org:"ru"},
      {k:"time",  def:3,    suf:"min", org:"ru"},
      {k:"admSal",def:2600, suf:"money", org:"mkt"},
    ],
    hours:v=> v.visits * v.perRec * v.time / 60,
    compute:v=>{
      const h = v.visits * v.perRec * v.time / 60;
      return {fot: h * costHour(v.admSal), rev:0};
    }},

  { id:3, group:"other", driver:"daily", cov:{src:"empCount", target:"emp", def:12}, link:null,
    effect:["fot"],
    fields:[
      {k:"emp", def:5,    suf:"ppl",   src:"empCount", org:"cov"},
      {k:"sal", def:4000, suf:"money", src:"empSal", org:"mkt"},
      {k:"docs",def:5,    suf:"docs", org:"ru"},
      {k:"time",def:20,   suf:"min", org:"ru"},
    ],
    hours:v=> v.docs * v.time * daysMonth / 60 * v.emp,
    compute:v=>{
      const h = v.docs * v.time * daysMonth / 60;
      return {fot: h * costHour(v.sal) * v.emp, rev:0};
    }},

  { id:6, group:"other", driver:"monthly", link:"https://helpdesk.bitrix24.com/open/25345201/",
    effect:["fot"],
    fields:[
      {k:"meet",def:8,    suf:"meetings", org:"ru"},
      {k:"dur", def:60,   suf:"min", org:"ru"},
      {k:"part",def:6,    suf:"ppl", org:"ru"},
      {k:"psal",def:4000, suf:"money", org:"mkt"},
      {k:"asal",def:3000, suf:"money", org:"mkt"},
    ],
    /* ТРИ СЛАГАЕМЫХ В МИНУТАХ, ДВЕ СТАВКИ. Встречи короче и участников меньше —
       минуты участников, и это одна и та же величина (meet x dur x GAIN x part),
       поэтому в часах она берётся дважды. Плюс протокол — минуты ассистента
       (meet x dur). Часы складываются, деньги — нет: ставки разные. */
    hours:v=> (2 * v.meet * v.dur * C.MEETING_GAIN * v.part + v.meet * v.dur) / 60,
    compute:v=>{
      const cmP = costMinute(v.psal), cmA = costMinute(v.asal);
      const A = v.meet * v.dur * C.MEETING_GAIN * v.part * cmP;
      const B = v.meet * v.dur * (v.part * C.MEETING_GAIN) * cmP;
      const Cc = v.meet * v.dur * cmA;
      return {fot:A+B+Cc, rev:0,
        breakdown:[["bd.6.a",A],["bd.6.b",B],["bd.6.c",Cc]]};
    }},

  { id:7, group:"vibe", driver:"share", cov:{src:"empCount", target:"emp", def:30}, link:"https://vibecode.bitrix24.com/quickstart",
    effect:["fot"], qualitative:"qual.7",
    fields:[
      {k:"emp",  def:10,   suf:"ppl",   src:"empCount", org:"cov"},
      {k:"share",def:0.10, suf:"share", org:"ru"},
      {k:"simp", def:0.30, suf:"share", org:"ru"},
      {k:"sal",  def:4000, suf:"money", src:"empSal", org:"mkt"},
    ],
    /* Как у сценария 4: формула берёт доли месячной стоимости, а полная месячная
       стоимость это contractHours() оплаченных часов. Округление числа инициативных
       повторено ровно так же, как в деньгах, иначе часы разъедутся с ними. */
    hours:v=>{
      const init = Math.round(v.emp * v.share);
      const non  = Math.max(0, v.emp - init);
      return contractHours() * (non * C.BASE_UPLIFT + init * v.simp);
    },
    compute:v=>{
      const init = Math.round(v.emp * v.share);
      const non  = Math.max(0, v.emp - init);
      const full = v.sal * burdenMult();
      const fot  = non * full * C.BASE_UPLIFT + init * full * v.simp;
      return {fot, rev:0, breakdown:[["bd.7.init", init, "int"]]};
    }},
];

/* =============================================================================
   PARTNER SERVICE COST — "cost of my services", per scenario.
   Filled BY HAND by the partner in front of the client. There are no defaults:
   a made-up figure quoted to a client is worse than a blank.
   NOT QUOTED (null) is a distinct state from QUOTED AS ZERO (0):
     - null is skipped by the sum and by the average
     - 0 is a real quote ("I do this one for free") and counts in both
   svcCost() returns null when the partner has not priced the scenario.
   ========================================================================== */
const SVC_LS = "vibecalc_services_v1";
const svcLoad = () => { try{ return JSON.parse(localStorage.getItem(SVC_LS)) || {}; }catch(e){ return {}; } };
const svcSave = (id, raw) => {
  const o = svcLoad();
  if(raw === "" || raw == null) delete o[id];   // cleared -> back to NOT QUOTED
  else o[id] = raw;
  try{ localStorage.setItem(SVC_LS, JSON.stringify(o)); }catch(e){}
};
function svcCost(sc){
  const raw = svcLoad()[sc.id];
  if(raw === undefined || raw === "") return null;   // not quoted
  const n = parseNum(String(raw));
  return isNaN(n) ? null : n;
}
/* Aggregate over SELECTED scenarios only. Empty fields never become zeros. */
function svcTotals(){
  let sum = 0, quoted = 0, unquoted = 0;
  scenarios.forEach(sc=>{
    if(!state[sc.id].selected) return;
    const v = svcCost(sc);
    if(v === null) unquoted++; else { sum += v; quoted++; }
  });
  return {sum, quoted, unquoted, avg: quoted ? sum / quoted : null};
}

/* =============================================================================
   COVERAGE — the fix for double counting.
   The source pushed the FULL headcount into every employee-driven scenario, so the
   same working day was sold several times over (67% of payroll on stock defaults).
   Coverage is the share of staff a scenario genuinely touches; AUTOFILL now supplies
   headcount x coverage instead of headcount.
   Defaults are deliberately CONSERVATIVE and flagged as estimates in the UI:
     100%  id1 / id4  — role-scoped already (the sales team IS the sales team)
      30%  id10 knowledge base, id7 Vibecode/CoWork — broad but never universal
      25%  id11 personal assistant — rolled out to a subset
      20%  id9  chat-driven Bitrix24 — an early-adopter habit
      12%  id3  document generation — only the people who actually draft documents
   Scenarios 2, 5, 6 and 12 have NO coverage: their driver is not a share of staff but
   an absolute monthly volume the partner types in directly (support specialists,
   customer base, meetings, bookings). Scaling those twice would be wrong.
   ========================================================================== */
const covOf = sc => sc.cov ? (state[sc.id].coverage ?? sc.cov.def) : 100;

/* company autofill map — targets unchanged from the source; the VALUE is now scaled */
const AUTOFILL = {
  empCount:[[9,"mgr"],[10,"emp"],[11,"emp"],[3,"emp"],[7,"emp"]],
  empSal:  [[9,"sal"],[10,"sal"],[11,"empSal"],[3,"sal"],[7,"sal"]],
  mgrCount:[[1,"mgr"]],
  mgrSal:  [[1,"sal"]],
  ropCount:[[4,"rop"]],
  ropSal:  [[4,"sal"]],
};
/* Численность — факт о клиенте, оклады — наша рыночная оценка. Признак org
   заменил прежний est:true: он говорит не только «это не факт», но и ЧТО именно
   за числом стоит. См. таблицу ORIGINS. */
const COMPANY = [
  {k:"empCount", def:50, org:"client"},   {k:"empSal", def:4000, org:"mkt"},
  {k:"mgrCount", def:5,  org:"client"},   {k:"mgrSal", def:4000, org:"mkt"},
  {k:"ropCount", def:1,  org:"client"},   {k:"ropSal", def:6500, org:"mkt"},
];
const company = {};

/* scenario state */
const state = {};
scenarios.forEach(sc=>{
  const v = {}; sc.fields.forEach(f=> v[f.k] = f.def);
  state[sc.id] = {selected:false, values:v, dirty:{}, segments:[],
                  coverage: sc.cov ? sc.cov.def : null};
});

const ICON_I = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';

/* =============================================================================
   RENDER
   ========================================================================== */
const sufText = key => key === "money" ? (CUR === "EUR" ? "€" : "$") : t(SUF[key]);

function buildCompany(){
  const g = document.getElementById("co-grid");
  g.innerHTML = COMPANY.map(c=>`
    <div class="field" data-field="co-${c.k}">
      <label for="co-${c.k}">${t("co."+c.k)}${orgOf(c) ? `<button type="button" class="${estCls(orgOf(c))}"
             data-info="org-co-${c.k}" aria-label="${t("org.title")}">${t(orgOf(c).pill)}</button>` : ""}</label>
      <div class="in-wrap">
        <input class="b24x-input comp-in" id="co-${c.k}" data-comp="${c.k}"
               type="text" inputmode="decimal"
               role="spinbutton" aria-valuemin="${COMPANY_LIM[c.k].min}" aria-valuemax="${COMPANY_LIM[c.k].max}"
               data-min="${COMPANY_LIM[c.k].min}" data-max="${COMPANY_LIM[c.k].max}"
               value="${groupFmt(String(company[c.k]))}">
        <span class="suf">${c.k.endsWith("Sal") ? sufText("money") : sufText("ppl")}</span>
      </div>
      <span class="err"></span>
    </div>`).join("");
  g.querySelectorAll(".comp-in").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      company[inp.dataset.comp] = onNumInput(inp);
      applyCompany(inp.dataset.comp);
      recompute();
    });
  });
}
/* Headcount keys get scaled by the scenario's coverage; salary keys never do. */
const isHeadcountKey = k => /Count$/.test(k);

function applyCompany(key){
  (AUTOFILL[key] || []).forEach(([id,fk])=>{
    if(!state[id] || state[id].dirty[fk]) return;
    const sc = scenarios.find(s=>s.id===id);
    let val = company[key];
    // scale only the headcount this scenario's coverage governs
    if(isHeadcountKey(key) && sc && sc.cov && sc.cov.src === key && sc.cov.target === fk){
      val = Math.max(0, Math.round(val * covOf(sc) / 100));
    }
    state[id].values[fk] = val;
    const el = document.querySelector(`#card-${id} .num-in[data-k="${fk}"]`);
    if(el) el.value = groupFmt(String(val));
  });
  /* the company headcount is quoted inside the coverage sentence — keep it in step */
  scenarios.forEach(sc=>{ if(sc.cov && sc.cov.src === key) refreshCovHint(sc); });
}
/* The sentence next to the coverage field ("...costed for N people"). It lives in
   .sc-body, which recompute() does not rewrite, so it must be refreshed by hand
   whenever the headcount behind it changes — otherwise it goes stale next to a
   correct number, which reads as a broken calculator. */
/* Сколько человек реально попало под охват — по нему же выбирается форма числа
   в подписи. Значение то же, что печатается в {got}, второго источника нет. */
const covApplied = sc => Math.round(state[sc.id].values[sc.cov.target] || 0);
const covHintText = sc => t(covApplied(sc) === 1 ? "ui.coverageHint1" : "ui.coverageHint", {
  src: t("co." + sc.cov.src),
  n:   fmtInt(company[sc.cov.src] || 0),
  got: fmtInt(state[sc.id].values[sc.cov.target] || 0),
});
function refreshCovHint(sc){
  if(!sc.cov) return;
  const el = document.getElementById("covhint-" + sc.id);
  if(el) el.innerHTML = covHintText(sc);
}

/* Re-derive one scenario's autofilled headcount after its coverage changes. */
function applyCoverage(sc){
  if(!sc.cov) return;
  const {src, target} = sc.cov;
  if(state[sc.id].dirty[target]){ refreshCovHint(sc); return; }  // typed by hand — keep it
  const val = Math.max(0, Math.round((company[src] || 0) * covOf(sc) / 100));
  state[sc.id].values[target] = val;
  const el = document.querySelector(`#card-${sc.id} .num-in[data-k="${target}"]`);
  if(el) el.value = groupFmt(String(val));
  refreshCovHint(sc);
}

function fieldHtml(sc, f, vals, segIdx){
  const val = vals[f.k];
  const disp = f.suf === "share" ? String(Math.round(val*1000)/10) : groupFmt(String(val));
  const seg = segIdx == null ? "" : ` data-seg="${segIdx}"`;
  /* Границы поля. У доли предел объявлен в процентах (0..100), и на экране поле
     тоже в процентах, поэтому подставляется как есть; остальные единицы совпадают
     с экранными по определению. */
  const lim = limOf(f);
  const org = orgOf(f);
  return `
  <div class="field" data-field="${f.k}">
    ${/* ПЛАШКА ПРОИСХОЖДЕНИЯ ВМЕСТО ПРЕЖНЕЙ «estimate». Тот же слот в подписи, та
         же нулевая стоимость по высоте, но говорит она больше: не «это не факт», а
         КАКОГО СОРТА за числом стоит основание. Плашка — кнопка: по клику
         открывается та же панель, что у «как это считается», и печатает полную
         строку происхождения. Так партнёр в переговорной видит тип с одного
         взгляда, а точную формулировку достаёт одним нажатием. */""}
    <label>${t(`sc.${sc.id}.f.${f.k}`)}${org ? `<button type="button" class="${estCls(org)}"
      data-info="org-${sc.id}-${f.k}" aria-label="${t("org.title")}">${t(org.pill)}</button>` : ""}</label>
    <div class="in-wrap" data-suf="${f.suf}">
      ${/* ГРАНИЦЫ ОБЪЯВЛЕНЫ НА САМОМ ПОЛЕ. type остаётся text: type="number" отнял бы
           у нас разрядные пробелы, которые ставит groupFmt, и вставку из таблиц.
           Поэтому min/max/step стоят в aria-атрибутах — их читают вспомогательные
           технологии, — и в data-атрибутах, откуда их берёт проверка. Браузер по
           ним ничего не блокирует, и это ровно то, что нужно: ввод не упирается,
           нарушение объясняется. */""}
      <input class="b24x-input num-in" data-k="${f.k}"${seg} type="text" inputmode="decimal"
             role="spinbutton" aria-valuemin="${lim.min}" aria-valuemax="${lim.max}"
             data-min="${lim.min}" data-max="${lim.max}" data-step="${lim.step}" value="${disp}">
      <span class="suf">${sufText(f.suf)}</span>
    </div>
    <span class="err"></span>
  </div>`;
}

/* Один добавленный сегмент. Вынесено из scHtml(), потому что ровно этот же
   кусок разметки рисует renderSegments() после добавления и после удаления —
   иначе нумерация и кнопка разъехались бы между двумя копиями. Индекс i идёт
   от нуля и всегда печатается как i+2: базовый набор полей — сегмент 1. */
function segHtml(sc, vis, sv, i){
  const label = t("ui.delSegAria", {n:i+2});
  return `
        <div class="seg">
          <div class="seg-h"><span>${t("ui.segN",{n:i+2})}</span>
            <button type="button" class="b24x-seg-del" data-delseg="${sc.id}" data-segidx="${i}"
                    aria-label="${label}" title="${label}">
              <img src="assets/icons/cross.svg" alt="" aria-hidden="true">${t("ui.delSeg")}
            </button>
          </div>
          <div class="sc-grid b24x-field-row">${vis.map(f=>fieldHtml(sc,f,sv,i)).join("")}</div>
        </div>`;
}
const segsHtml = (sc, vis) => (state[sc.id].segments || []).map((sv,i)=>segHtml(sc,vis,sv,i)).join("");

/* ПЕРЕРИСОВЫВАЕТ ТОЛЬКО КОНТЕЙНЕР СЕГМЕНТОВ одной карточки и заново вешает
   обработчики на его поля.
   Почему не buildScenarios(): тот пересобирает #groups целиком — все одиннадцать
   карточек вместе с .sc-body, полем цены услуг и охватом. Именно так в этом
   проекте дважды терялся ввод и фокус (INVENTORY.md §e). Здесь трогается один
   узел, всё за его пределами — включая соседние поля этой же карточки — остаётся
   тем же DOM-элементом со своим значением, выделением и фокусом. */
function renderSegments(sc){
  const box = document.getElementById("segs-" + sc.id);
  if(!box) return;
  const vis = sc.fields.filter(f=>!f.revOnly || SHOW_REVENUE);
  box.innerHTML = segsHtml(sc, vis);
  box.querySelectorAll(".num-in").forEach(wireNumInput);
  box.querySelectorAll("[data-delseg]").forEach(wireSegDelete);
}

function buildScenarios(){
  const groups = [["crm","ui.grpCrm"],["agents","ui.grpAgents"],
                  ["other","ui.grpOther"],["vibe","ui.grpVibe"]];
  const host = document.getElementById("groups");
  host.innerHTML = groups.map(([g,label])=>`
    <div class="sec-h${g==="vibe"?" sec-h--accent":""}" style="margin-top:var(--b24-s8)">${t(label)}</div>
    ${scenarios.filter(s=>s.group===g).map(sc=>scHtml(sc)).join("")}
  `).join("");
  wireScenarios();
}

/* Continuous 1..11 numbering, as in the original (`const num = idx + 1`): the index is
   taken over the whole scenarios array, not per group. Because the groups render in the
   same order the array is written in, the numbers still read straight down the page. */
const scNum = sc => scenarios.indexOf(sc) + 1;

function scHtml(sc){

  const vis = sc.fields.filter(f=>!f.revOnly || SHOW_REVENUE);
  return `
  <div class="sc" id="card-${sc.id}">
