          <span class="tag">${t(`sc.${sc.id}.role`)}</span>
          <!-- ПОМЕТКА ПОСТОЯННАЯ. Она про сам сценарий, а не про текущий выбор:
               требование тарифа у него одно и то же независимо от того, какую
               цель партнёр открыл в шаге 6. Условная пометка исчезала бы ровно
               там, где партнёр уже поднял тариф, — и он терял бы из вида, что
               сценарий к тарифу привязан. -->
          ${sc.agent?`<span class="tag tag--plan" title="${t("ui.agentReqHint")}">${t("ui.agentReq",{plan:AGENT_MIN_PLAN})}</span>`:""}
          ${sc.effect.includes("rev")?`<span class="tag tag--est" title="${t("ui.tagEstHint")}"
            >${t(sc.revLabel||"ui.revDefault")} · ${t("ui.tagEstimate")}</span>`:""}
          ${sc.link?`<a class="tag-link" href="${sc.link}" target="_blank" rel="noopener">${t("ui.more")} \u2192</a>`:""}
        </div>
      </div>
    </div>
    <div class="sc-body">
      ${sc.note?`<div class="sc-note">${t(`sc.${sc.id}.note`)}</div>`:""}
      <!-- ЦЕНА УСЛУГ — ПЕРВЫМ ДЕЛОМ В КАРТОЧКЕ.
           Раньше это поле стояло внизу, внутри блока результатов: 601 px от верха
           карточки на 1440 и 1158 px на мобильной, третьей строкой среди
           посчитанных значений и с подписью-<span> вместо label. Его не находили.
           Живёт в .sc-body, который recompute() не перерисовывает, — поэтому ввод
           не сбивается на полуслове (INVENTORY.md §e). -->
      <div class="svc-strip">
        <div class="field" style="max-width:260px">
          <label for="svc-${sc.id}">${t("ui.svcCardLabel")}</label>
          <div class="in-wrap">
            <input class="b24x-input svc-in" id="svc-${sc.id}" data-svc="${sc.id}"
                   type="text" inputmode="decimal" placeholder="${t("ui.notQuoted")}"
                   value="${svcCost(sc) === null ? "" : groupFmt(String(svcCost(sc)))}">
            <span class="suf">${sufText("money")}</span>
          </div>
        </div>
        <p class="hint">${t("ui.svcCardHint")}
          <button class="info-btn" data-info="svc-${sc.id}" aria-label="${t("ui.aboutSvc")}">${ICON_I}</button></p>
      </div>
      ${sc.cov?`
      <div class="cov-row">
        <div class="field" style="max-width:260px">
          <!-- Охват — наша оценка и самое чувствительное число модели, поэтому
               рамка: это ровно тот тип, который требует действия. -->
          <label for="cov-${sc.id}">${t("ui.coverage")}<button type="button" class="est est-btn est--check"
            data-info="org-cov-${sc.id}" aria-label="${t("org.title")}">${t("org.pill.ours")}</button></label>
          <div class="in-wrap">
            <input class="b24x-input cov-in" id="cov-${sc.id}" data-cov="${sc.id}"
                   type="text" inputmode="decimal" value="${covOf(sc)}">
            <span class="suf">%</span>
          </div>
        </div>
        <p class="cov-hint" id="covhint-${sc.id}">${covHintText(sc)}</p>
      </div>`:`
      <p class="cov-hint cov-hint--none">${t("ui.coverageNone")}</p>`}
      <div class="sc-grid b24x-field-row">${vis.map(f=>fieldHtml(sc,f,st.values,null)).join("")}</div>
      <div id="segs-${sc.id}">${segsHtml(sc, vis)}</div>
      ${sc.segments?`<button class="btn-add" data-addseg="${sc.id}">${t("ui.addSeg")}</button>`:""}
      <div class="res" id="res-${sc.id}"></div>
    </div>
  </div>`;
}

/* Обработчик одного числового поля. Именованный, потому что его вешают двое:
   wireScenarios() на всю страницу и renderSegments() — только на свой контейнер.
   Вешать wireScenarios() повторно нельзя: обработчики удвоились бы на карточках,
   которые никто не перерисовывал. */
function wireNumInput(inp){
  inp.addEventListener("input", ()=>{
    const card = inp.closest(".sc"); const id = +card.id.slice(5);
    const k = inp.dataset.k, segIdx = inp.dataset.seg;
    const raw = onNumInput(inp);
    const sc = scenarios.find(s=>s.id===id);
    const f = sc.fields.find(x=>x.k===k);
    const val = f.suf === "share" ? raw/100 : raw;
    if(segIdx == null){ state[id].values[k] = val; state[id].dirty[k] = true; }
    else { state[id].segments[+segIdx][k] = val; }
    recompute();
  });
}

/* Удаление сегмента. splice сдвигает хвост, renderSegments() рисует его заново
   от нуля — поэтому нумерация всегда подряд: удалили второй из трёх, бывший
   третий печатается как «Segment 2» и его поля получают data-seg="1".
   recompute() зовётся тут же, а не откладывается: он переписывает и #res-N
   этого сценария, и общий итог (paintTotals). */
function wireSegDelete(b){
  b.addEventListener("click", ()=>{
    const id = +b.dataset.delseg, i = +b.dataset.segidx;
    const sc = scenarios.find(s=>s.id===id);
    if(!sc || !state[id].segments[i]) return;
    state[id].segments.splice(i, 1);
    renderSegments(sc);
    recompute();
    /* Кнопки, на которой стоял фокус, больше нет. Уводим фокус на «добавить» —
       ближайший постоянный элемент, иначе клавиатурный обход начинается заново
       с начала документа. */
    const add = document.querySelector(`[data-addseg="${id}"]`);
    if(add) add.focus();
  });
}

function wireScenarios(){
  document.querySelectorAll("[data-toggle]").forEach(top=>{
    const id = +top.dataset.toggle;
    const cb = top.querySelector(".sc-cb");
    const card = document.getElementById("card-"+id);
    const sync = ()=>{
      state[id].selected = cb.checked;
      card.classList.toggle("on", cb.checked);
      buildServices();     /* состав строк шага 4 меняется только здесь */
      recompute();
    };
    cb.addEventListener("click", e=> e.stopPropagation());
    cb.addEventListener("change", sync);
    /* The "Learn more" link sits inside this strip. Without the guard the same
       click both opens the article and flips the selection: the card the person
       was filling in collapses behind their back while a new tab takes focus. */
    top.addEventListener("click", e=>{
      if(e.target.closest("a")) return;
      cb.checked = !cb.checked; sync();
    });
    card.classList.toggle("on", cb.checked);
  });
  document.querySelectorAll(".num-in").forEach(wireNumInput);
  document.querySelectorAll("[data-addseg]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const id = +b.dataset.addseg, sc = scenarios.find(s=>s.id===id);
      const v = {}; sc.fields.forEach(f=> v[f.k] = f.def);
      state[id].segments.push(v);
      /* Раньше здесь стоял buildScenarios() — полная пересборка всех карточек
         ради одного нового блока. Теперь перерисовывается только #segs-N. */
      renderSegments(sc); recompute();
    });
  });
  /* coverage: re-derives the autofilled headcount, then a full recompute.
     The input lives in .sc-body, which recompute() does NOT rewrite (it only
     rewrites #res-N), so typing here is safe. */
  document.querySelectorAll(".cov-in").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const id = +inp.dataset.cov;
      const sc = scenarios.find(s=>s.id===id);
      let n = onNumInput(inp);
      /* Зажим до 100 был и раньше, но ПОЛЕ оставалось с введённым числом:
         партнёр вводил 200, видел 200 и думал, что посчитано по 200%. Теперь
         поле приводится к применённому значению — что видно, то и считается.
         Пишем только при расхождении, чтобы не сбивать каретку на каждом
         нажатии внутри допустимого диапазона. */
      if(n > 100){ n = 100; if(inp.value !== "100") inp.value = "100"; }
      state[id].coverage = n;
      applyCoverage(sc);
      recompute();
    });
  });
}

/* ---- compute ---- */
/* ПРОВЕРКА ВВОДА — ОДНА ФУНКЦИЯ ДЛЯ МОДЕЛИ И ДЛЯ КАРТОЧКИ.
   Раньше validate() звался только из recompute() при отрисовке карточки: поле
   краснело, сообщение появлялось, а сценарий всё равно считался и попадал в
   итог. На «closed by AI = 50» при «total = 40» экономия РОСЛА с $1,706 до
   $2,275 — партнёр видел ошибку и большую цифру одновременно, и мог печатать
   отчёт. Теперь ответ один: невалидный сценарий из расчёта исключён целиком.
   Сегменты проверяются тем же правилом: одна ошибка в любом наборе значений
   делает сценарий невалидным — считать половину сценария бессмысленно. */
/* =============================================================================
   ГРАНИЦЫ ПОЛЯ -> ОШИБКА. Одна функция на весь калькулятор: и сценарии, и блок о
   компании, и экономика. Возвращает ключ строки с подстановками, а не готовый
   текст, — формулировка живёт в i18n, как всё остальное.

   ПОРЯДОК ПРОВЕРОК ОТ САМОГО ГРУБОГО К САМОМУ МЯГКОМУ, и он важен: партнёру надо
   сказать ОДНУ вещь, самую близкую к причине. «Не число» раньше «меньше нуля»,
   потому что NaN технически не меньше нуля ни при каком сравнении.

   ПУСТОЕ ПОЛЕ — НЕ ОШИБКА, А НОЛЬ, и это прежнее поведение сохранено осознанно:
   пустой оклад даёт нулевую экономию, а не сломанный расчёт, и партнёр видит ноль.
   Исключение — рабочие дни, где ноль делил бы на ноль: там min 1. */
function limitError(v, lim){
  if(typeof v !== "number" || !Number.isFinite(v))
    return {k:"err.notNumber", p:{}};
  if(v < 0)          return {k:"err.negative", p:{}};
  /* СРАВНИВАЕМ В ЕДИНИЦЕ СОСТОЯНИЯ, ПЕЧАТАЕМ В ЕДИНИЦЕ ЭКРАНА. Расходятся они
     только у доли (scale:100), но перепутать их — значит не поймать 500%. */
  const k = lim.scale || 1;
  const unit = k === 100 ? "%" : "";
  if(v < lim.min / k) return {k:"err.min", p:{min: fmtInt(lim.min) + unit}};
  if(v > lim.max / k) return {k:"err.max", p:{max: fmtInt(lim.max) + unit}};
  if(lim.int && !Number.isInteger(v)) return {k:"err.whole", p:{}};
  return null;
}

/* ОШИБКИ ПО ГРАНИЦАМ ПОЛЕЙ СЦЕНАРИЯ. Проверяются ВСЕ наборы значений — базовый и
   каждый сегмент: сегмент с невалидным значением так же ломает итог сценария, как
   базовый набор, и молчать о нём нельзя. */
function boundsErrors(sc, vals){
  const out = {};
  sc.fields.forEach(f=>{
    /* Поля, которых при выключенном переключателе выручки на экране нет, не
       проверяем: подсветить невидимое поле значит сообщить о проблеме, которую
       негде увидеть и нечем исправить. В расчёт они при этом тоже не идут. */
    if(f.revOnly && !SHOW_REVENUE) return;
    const e = limitError(vals[f.k], limOf(f));
    if(e) out[f.k] = e;
  });
  return Object.keys(out).length ? out : null;
}

/* ОШИБКИ СЦЕНАРИЯ = ГРАНИЦЫ ПОЛЕЙ + СОБСТВЕННАЯ ПРОВЕРКА СЦЕНАРИЯ.
   Границы идут ПЕРВЫМИ: пока значение не число или вне диапазона, сравнивать его с
   другим полем бессмысленно — у сценария 2 проверка «закрыто AI не больше общего
   объёма» на NaN дала бы false и пропустила бы значение дальше.
   Механизм, который висит на результате этой функции, уже готов целиком и
   проверен на сценарии 2: карточка подсвечивает поле и печатает причину,
   computeModel исключает сценарий из ВСЕХ сумм, список едет в состоянии полем
   invalid, а build-report ОТКАЗЫВАЕТСЯ собирать отчёт. Здесь он становится
   общим — это и была вся правка P12 по сути. */
function scenarioErrors(sc, st){
  const sets = [st.values].concat(st.segments || []);
  for(const vals of sets){
    const b = boundsErrors(sc, vals);
    if(b) return b;
    if(sc.validate){
      const e = sc.validate(vals);
      if(e) return e;
    }
  }
  return null;
}

/* ГРАНИЦЫ ВНЕ СЦЕНАРИЕВ: блок о компании и экономика. Эти поля питают ВСЕ
   сценарии сразу — численность и оклад входят в знаменатель предохранителя, дни и
   нагрузка в стоимость часа, — поэтому их нарушение нельзя списать на один
   сценарий. Возвращается карта «id поля -> ошибка». */
const COMPANY_LIM = {
  empCount: LIMITS.ppl, mgrCount: LIMITS.ppl, ropCount: LIMITS.ppl,
  empSal: LIMITS.money, mgrSal: LIMITS.money, ropSal: LIMITS.money,
};
function globalErrors(){
  const out = {};
  Object.entries(COMPANY_LIM).forEach(([k, lim])=>{
    const e = limitError(company[k], lim);
    if(e) out["co-" + k] = e;
  });
  const d = limitError(daysMonth, LIMITS.days);
  if(d) out["days"] = d;
  /* НАГРУЗКА НА ФОТ — процент поверх оклада, но не «доля целого»: она законно
     больше нуля и меньше сотни в наших рынках, а потолок 200 стоит вдвое выше
     самой высокой реальной ставки, чтобы не отсечь законный ввод. */
  const b = limitError(burdenPct, {min:0, max:200, step:0.1, int:false});
  if(b) out["burden"] = b;
  return Object.keys(out).length ? out : null;
}

function computeScenario(sc, st){
  const sets = [st.values].concat(st.segments || []);
  let fot = 0, rev = 0, hours = 0, breakdown = null;
  sets.forEach(vals=>{
    const r = sc.compute(vals);
    fot += r.fot; rev += (r.rev || 0);
    /* Часы суммируются по тем же наборам значений, что и деньги: базовый плюс
       все сегменты. Иначе сценарий с сегментами показал бы деньги по всем
       наборам, а часы — по одному. */
    hours += sc.hours(vals);
    if(r.breakdown){
      if(!breakdown) breakdown = r.breakdown.map(b=>[b[0], b[1], b[2]]);
      else r.breakdown.forEach((b,j)=>{ if(breakdown[j]) breakdown[j][1] += b[1]; });
    }
  });
  /* МНОЖИТЕЛЬ РЕАЛИЗАЦИИ — ЕДИНСТВЕННАЯ ТОЧКА ПРИМЕНЕНИЯ НА ВЕСЬ РАСЧЁТ.
     Стоит здесь, а не в computeModel, чтобы через него проходил КАЖДЫЙ
     потребитель без исключения: items и суммы, предохранитель по ФОТ, доля
     недоступного на выбранном тарифе, обе поверхности вывода. Второго места,
     где сценарий превращается в деньги, в модели нет.

     Применяется ПОСЛЕ суммирования наборов, а не внутри цикла: умножение
     линейно, результат тот же до последнего бита, а читается лучше.
     Инвариант «промежуточные не округляем» не тронут — здесь нет округления.

     ВЫРУЧКА — ТОЛЬКО ПРИ ПРИЗНАКЕ revFromTime, И ЭТО НЕ ДВОЙНОЕ ЗАНИЖЕНИЕ.
     У сценария 1 прирост выручки выведен ИЗ ТОГО ЖЕ высвобожденного времени
     (freedShare — доля рабочего дня, снятая с менеджера). Если реально исчезает
     40% названного времени, то и часов, которые можно продать, существует 40%:
     не применить множитель здесь значило бы показать на экране уменьшенную
     экономию и нетронутую выручку, посчитанную с тех же самых минут. Собственный
     коэффициент конверсии (sc.1.f.coef) отвечает на ДРУГОЙ вопрос — какая доля
     уже высвобожденного времени превращается в сделки. Два фильтра подряд:
     сколько времени есть, и сколько оно приносит.
     Потенциал существующей базы (сценарий 5) времени не содержит вообще —
     он считается от размера базы, конверсии и чека, — и множителя не получает.
     Признак объявлен полем У СЦЕНАРИЯ, рядом с формулой, а не собирается здесь
     по id: сценарий с эффектом на выручку, заведённый завтра, обязан сам
     сказать, из чего она выведена. */
  const k = realisation();
  fot *= k;
  /* ЧАСЫ ПОЛУЧАЮТ МНОЖИТЕЛЬ ТОЧНО ТАК ЖЕ. Иначе экран показывал бы уменьшенные
     деньги при нетронутых часах, то есть два ответа на один вопрос: если реально
     исчезает 40% названного времени, то и часов высвобождается 40%. Тождество
     «часы x стоимость часа = деньги» держится и до множителя, и после — он один
     и тот же на обе величины. */
  hours *= k;
  if(sc.revFromTime) rev *= k;
  /* Слагаемые в раскрытии — те же деньги, что и в итоге сценария, и обязаны
     сходиться с ним на экране. Целочисленные строки («инициаторов 2») — это
     люди, а не деньги, и множителю не подлежат. */
  if(breakdown) breakdown.forEach(b=>{ if(b[2] !== "int") b[1] *= k; });
  return {fot, rev, hours, breakdown};
}

/* =============================================================================
   THE SINGLE CALCULATION PATH — computeModel()
   Every surface (screen, client report, partner report) displays THIS result.
   Nothing else is allowed to sum, derive or re-derive a figure.

   ROUNDING RULE, and it is the whole point of this function:
   nothing in here rounds. Per-scenario results, the sums, the yearly figures,
   the first-year cost and the net all stay full-precision. Rounding happens
   exactly ONCE, in the formatters (fmtMoney / fmtInt / fmtPct), at the moment a
   number is shown to a human.

   Why it matters: the screen used to sum raw values while the report rounded each
   scenario first and summed the rounded ones. Same formulas, different order of
   rounding, and the two disagreed by $2 on the demo set (scenario 1 yields
   $10,833.33). Round an intermediate and every total built on it inherits the
   error. So: intermediates stay exact, only the display rounds.
   ========================================================================== */
function computeModel(){
  const items = [];
  let fot = 0, rev = 0, pot = 0, hours = 0, any = false, qual = false;
  /* Годовые пулы, из которых черпают строки выручки. Ключи заданы здесь, а не
     наращиваются на лету: неизвестный ключ у нового сценария должен броситься в
     глаза при первом же прогоне, а не молча пропасть из знаменателя. */
  const revPool = {target: 0, base: 0};

  const invalid = [];
  scenarios.forEach(sc=>{
    const st = state[sc.id];
    if(!st.selected) return;
    /* Невалидный сценарий не участвует ни в одной сумме и не попадает в items —
       значит его нет ни на экране в шаге 4, ни в отчёте. Но он остаётся
       ВЫБРАННЫМ: молча снимать галочку нельзя, партнёр его выбрал сознательно.
       Поэтому он едет отдельным списком, и о нём сказано в сводке. */
    if(scenarioErrors(sc, st)){ invalid.push({id: sc.id, title: t(`sc.${sc.id}.title`)}); return; }
    const r = computeScenario(sc, st);
    /* Пул считается по ТЕМ ЖЕ наборам значений, что и сама выручка: базовый плюс
       все сегменты. Иначе сценарий с сегментами дал бы большую выручку при
       маленьком знаменателе и предохранитель срабатывал бы на ровном месте. */
    if(sc.revPool) [st.values].concat(st.segments || []).forEach(vals=>{
      const c = sc.revPool(vals);
      if(c && revPool[c.key] !== undefined) revPool[c.key] += (c.year || 0);
    });
    any = true;
    if(sc.qualitative) qual = true;
    fot += r.fot;                                          // raw, never rounded
    hours += r.hours;                                      // raw, never rounded
    if(sc.revLabel === "ui.revBase") pot += r.rev; else rev += r.rev;
    items.push({sc, fot:r.fot, rev:r.rev, hours:r.hours, breakdown:r.breakdown, service:svcCost(sc)});
  });

  const svc = svcTotals();
  const PP = planPair();
  const {map, vibe} = PP;
  /* from — факты о цене «до»: known отделяет ноль («ещё нет Битрикс24») от
     «в прайсе нет цены». Раньше здесь искалась строка Essentials по имени, и для
     Enterprise-500+ это дало бы цену 250-местного тарифа, то есть подлог. */
  const from = PP.from;

  const subscriptionYear = vibe ? vibe.annualTotal : 0;
  const fotYear        = fot * 12;
  const firstYearCost  = subscriptionYear + svc.sum;
  const netFirstYear   = fotYear - firstYearCost;

  const payroll = (company.empCount || 0) * (company.empSal || 0) * burdenMult();
  const pct = payroll ? (fot / payroll * 100) : 0;

  /* ПРЕДОХРАНИТЕЛЬ НА ВЫРУЧКУ — брат-близнец предохранителя на ФОТ выше.
     Считается ВСЕГДА (иначе строка уехала бы в отчёт из состояния, снятого с
     выключенным переключателем), а срабатывает только когда выручку показывают:
     предупреждать о цифрах, которых на экране нет, значит пугать впустую.
     Знаменатель нулевой — предохранитель молчит, но и «ok» тут значит «нечего
     мерить», а не «проверено»: об этом говорит поля measured. */
  const revPoolYear   = revPool.target + revPool.base;
  const projectedYear = (rev + pot) * 12;
  const revPct = revPoolYear > 0 ? (projectedYear / revPoolYear * 100) : 0;
  const revMeasured = SHOW_REVENUE && revPoolYear > 0 && projectedYear > 0;
  const revGuard = {
    ok: !revMeasured || revPct <= C.REV_WARN_PCT,
    measured: revMeasured,
    pct: revPct,
    poolYear: revPoolYear,
    poolTargetYear: revPool.target,
    poolBaseYear: revPool.base,
    projectedYear,
    threshold: C.REV_WARN_PCT,
  };

  /* РАСХОЖДЕНИЕ «СЦЕНАРИИ НА АГЕНТАХ ПРОТИВ ЦЕЛЕВОГО ТАРИФА».
     Формулы это не меняет: fot, fotYear и netFirstYear считаются как раньше, по
     всем выбранным сценариям. Здесь только ВЫДЕЛЯЕТСЯ доля итога, которая на
     выбранной цели недоступна, — чтобы её можно было назвать и на экране, и в
     отчёте. Сумма сырая, округление — как везде, один раз на выводе. */
  const gatedList = agentGatedItems(items, map.to);
  const gatedFot  = gatedList.reduce((a, it) => a + it.fot, 0);
  const agentGate = {
    planHasAgents: planHasAgents(map.to),
    minPlan: AGENT_MIN_PLAN,
    ids: gatedList.map(it => it.sc.id),
    titles: gatedList.map(it => t(`sc.${it.sc.id}.title`)),
    fotMonth: gatedFot, fotYear: gatedFot * 12,
  };

  return {
    any, qual, n: items.length, items, svc, agentGate, invalid,
    plan: {from: essPlan, map, vibe, pair: PP, fromPrice: from},
    totals: {
      fotMonth: fot, fotYear,
      revMonth: rev, revYear: rev * 12,
      potMonth: pot, potYear: pot * 12,
      serviceSum: svc.sum, subscriptionYear, firstYearCost, netFirstYear,
    },
    /* ТРИ СОСТОЯНИЯ, А НЕ ДВА. level — единственный признак, по которому
       поверхности решают, что печатать; ok оставлен и означает «не сработало
       НИЧЕГО», потому что по нему уже разбивается лист отчёта и сверяется
       check-parity, и обоим нужно именно это.
       Границы включительные в пользу молчания: ровно 15% и ровно 25% ещё не
       срабатывают. Это закреплено состоянием H в check-golden — порог,
       съехавший на единицу, обязан ронять проверку. */
    overlap: (() => {
      const p = any ? pct : 0;
      const level = !any || p <= C.OVERLAP_NOTE_PCT ? "ok"
                  : (p <= C.OVERLAP_WARN_PCT ? "soft" : "hard");
      return {level, ok: level === "ok", pct: p, payroll,
              note: C.OVERLAP_NOTE_PCT, threshold: C.OVERLAP_WARN_PCT};
    })(),
    revGuard,
    /* ====================== МОЩНОСТЬ: ЧАСЫ, ШТАТНЫЕ ЕДИНИЦЫ, ОКУПАЕМОСТЬ ======
       Деньги остаются главной цифрой — это решение заказчика (OPEN_QUESTIONS §11,
       вариант В: мощность рядом, а не вместо). Здесь три производные величины,
       которые встают рядом с деньгами и НИЧЕГО не пересчитывают заново.

       ЧАСЫ приходят из сценариев (поле hours), уже с множителем режима.

       ШТАТНЫЕ ЕДИНИЦЫ = часы за год / оплаченные часы одного сотрудника за год.
       Знаменатель — contractHours() x 12, те же 168 часов в месяц, из которых
       считается стоимость часа. Поэтому величина внутренне согласована с моделью
       и НЕ зависит от среднего оклада.
       §11 предлагал другой делитель — «экономия ФОТ / полная стоимость
       сотрудника». Он хуже: экономия, собранная на дорогом руководителе, дала бы
       меньше штатных единиц, чем те же часы, собранные на рядовых. Часы — это
       часы, и мерить их надо часами.

       ОКУПАЕМОСТЬ = затраты первого года / экономия за месяц. Считается ТОЛЬКО
       когда оценены все выбранные сценарии; почему — см. paybackBlocked ниже. */
    capacity: (() => {
      const k = realisation();
      const hoursMonth = any ? hours : 0;
      const hoursYear  = hoursMonth * 12;
      const yearHoursPerEmployee = contractHours() * 12;
      const fte = yearHoursPerEmployee ? hoursYear / yearHoursPerEmployee : 0;
      /* ОКУПАЕМОСТЬ НЕ ПОКАЗЫВАЕТСЯ, ПОКА ОЦЕНЕНЫ НЕ ВСЕ СЦЕНАРИИ, и это не
         перестраховка. Неоценённый сценарий в модели НЕ равен нулю — он «не
         оценён», так устроен весь шаг 4 (пустое поле не становится нулём, сумма
         его не берёт, сводка называет их число). Затраты первого года при этом
         неполны, а окупаемость — дробь, у которой неполон именно знаменатель
         затрат: она выходит короче настоящей ровно на то, что партнёр ещё не
         вписал. На дефолтах это видно в чистом виде: 1728 подписки против 16 133
         экономии дают 3 дня.
         Из всех цифр документа окупаемость — та, которой финансовый директор
         доверяет больше всего. Показать её заведомо льстивой хуже, чем не
         показать: поэтому вместо числа печатается причина и адрес, где её
         исправить, — тем же приёмом, что прочерк с объяснением у сценариев на
         выручке при выключенном переключателе.
         Ноль как оценка («делаю бесплатно») блокировкой НЕ считается: он
         осознанно введён и в сумму входит. Блокирует только НЕ ОЦЕНЕНО. */
      const blocked = !any ? "none" : (svc.unquoted > 0 ? "unquoted"
                    : (fot > 0 ? null : "nosaving"));
      const months = blocked ? null : firstYearCost / fot;
      /* ЧУВСТВИТЕЛЬНОСТЬ ВЫРАЖЕНА ЧЕРЕЗ РЕЖИМЫ, А НЕ ОТДЕЛЬНЫМ «ЕСЛИ ПОЛОВИНА».
         Разбор просил строку «если реально освободится половина предположенного».
         Вводить для этого второе понятие нельзя: переключатель режимов ОТВЕЧАЕТ НА
         ТОТ ЖЕ ВОПРОС, и рядом получились бы два разных числа про одно и то же —
         «половина» и «консервативно», — а читатель спросил бы, какое из них
         применено. Плюс «половина» ни к чему не привязана: половина чего? У
         режимов за каждым множителем стоит выведенное произведение трёх остатков.
         И практическое: названную величину партнёр может ПОКАЗАТЬ, нажав кнопку,
         а гипотетическую половину — нет.
         Ориентир всегда один — консервативный режим, нижняя граница инструмента.
         Считается умножением, а не вторым прогоном модели: и деньги, и часы
         линейны по множителю, поэтому floor = текущее x (0.40 / k) точно. */
      const kFloor = REALISATION[0].k;
      const scale  = k > 0 ? kFloor / k : 0;
      return {
        hoursMonth, hoursYear, fte,
        hoursPerEmployeeYear: yearHoursPerEmployee,
        paybackMonths: months,
        paybackWeeks: months === null ? null : months * (52 / 12),
        paybackBlocked: blocked,
        unquoted: svc.unquoted,
        atFloor: realisationId === REALISATION[0].id,
        floorFotYear: fotYear * scale,
        floorHoursYear: hoursYear * scale,
      };
    })(),
  };
}

/* ПОДСВЕТКА ПОЛЕЙ ВНЕ СЦЕНАРИЕВ. Та же механика, что у карточки: класс invalid на
   .field и причина в .err. Отдельная функция, потому что эти поля живут в шаге 1 и
   перерисовываются другим кодом. */
function paintGlobalErrors(errs){
  document.querySelectorAll('#company .field[data-field]').forEach(f=>{
    f.classList.remove("invalid");
    const e = f.querySelector(".err"); if(e) e.textContent = "";
    const i = f.querySelector("input"); if(i) i.removeAttribute("aria-invalid");
  });
  if(!errs) return;
  Object.entries(errs).forEach(([k, msg])=>{
    const f = document.querySelector(`#company .field[data-field="${k}"]`);
    if(!f) return;
    f.classList.add("invalid");
    const e = f.querySelector(".err"); if(e) e.textContent = t(msg.k, msg.p);
    const i = f.querySelector("input"); if(i) i.setAttribute("aria-invalid","true");
  });
}

function recompute(){
  paintGlobalErrors(globalErrors());
  const model = computeModel();
  const byId = {};
  model.items.forEach(it=> byId[it.sc.id] = it);

  scenarios.forEach(sc=>{
    const st = state[sc.id];
    const card = document.getElementById("card-"+sc.id);
    const res = document.getElementById("res-"+sc.id);
    if(!card || !res) return;

    card.querySelectorAll(".field").forEach(f=>f.classList.remove("invalid"));
    const errs = scenarioErrors(sc, st);
    /* Значение ошибки — либо ключ строки (так объявлена проверка сценария 2), либо
       {k, p} с подстановками (так приходят границы: в тексте стоит сам предел). */
    if(errs) Object.entries(errs).forEach(([k,msg])=>{
      const msgKey = typeof msg === "string" ? msg : msg.k;
      const msgVars = typeof msg === "string" ? undefined : msg.p;
      const f = card.querySelector(`.field[data-field="${k}"]`);
      if(f){ f.classList.add("invalid"); f.querySelector(".err").textContent = t(msgKey, msgVars);
             const i = f.querySelector("input"); if(i) i.setAttribute("aria-invalid","true"); }
    });
    if(!errs) card.querySelectorAll("input[aria-invalid]").forEach(i=>i.removeAttribute("aria-invalid"));

    if(!st.selected){ res.innerHTML = ""; return; }

    /* ВЫБРАН, НО ИСКЛЮЧЁН ПО ОШИБКЕ ВВОДА. В модели такого сценария нет вовсе,
       поэтому byId[] по нему пуст: дальше идти нельзя, читать .breakdown у
       undefined — падение. Вместо результатов печатаем прочерк и причину: карточка
       обязана сказать, почему цифры исчезли, иначе выглядит как поломка. */
    if(errs){
      res.innerHTML = row(t("ui.fotMonth"), SCREEN_DASH)
                    + `<div class="res-note">${t("ui.invalidCardNote")}</div>`;
      return;
    }

    const r = byId[sc.id];        // from the model — the card does not recompute
    let html = "";
    if(r.breakdown){
      html += '<div class="bd">' + r.breakdown.map(b=>{
        const isInt = b[2] === "int";
        return `<span></span><div><span>${t(b[0], copyVars())}</span><b>${isInt?fmtInt(b[1]):fmtMoney(b[1])}</b></div>`;
      }).join("") + "</div>";
    }
    if(sc.effect.includes("fot")){
      html += row(t("ui.fotMonth"), fmtMoney(r.fot));
      html += row(t("ui.fotYear"),  fmtMoney(r.fot*12));
    }
    if(sc.effect.includes("rev") && SHOW_REVENUE){
      const rl = t(sc.revLabel || "ui.revDefault");
      html += row(rl + ", " + t("ui.month").toLowerCase(), fmtMoney(r.rev), "rev");
      html += row(rl + ", " + t("ui.year").toLowerCase(),  fmtMoney(r.rev*12), "rev");
    }
    /* СЦЕНАРИЙ ТОЛЬКО НА ВЫРУЧКЕ ПРИ ВЫКЛЮЧЕННОМ ПЕРЕКЛЮЧАТЕЛЕ. Без этой ветки
       карточка не печатала ничего: ни числа, ни прочерка, ни причины. Партнёр
       выбирал сценарий, вводил данные и получал пустоту, а сводка при этом
       показывала нулевую экономию и отрицательный вердикт. Прочерк — тот же
       знак, что в отчёте у таких строк, плюс объяснение и адрес переключателя. */
    if(!sc.effect.includes("fot") && !SHOW_REVENUE){
      html += row(t("ui.fotMonth"), SCREEN_DASH);
      html += `<div class="res-note">${t("ui.revOffNote")}</div>`;
    }
    /* Цены услуг в блоке результатов больше нет вообще — ни поля, ни эха.
       Поле переехало наверх карточки (.svc-strip) и в шаг 4. Эхо я сначала
       оставил, но этот блок перерисовывает только recompute(), а набор цены
       идёт через refreshTotals() — значение отставало бы до следующего
       пересчёта. Строка, которая иногда врёт, хуже отсутствующей. */
    html += `<div class="res-row"><span class="lbl">${t("ui.howCalc")}
      <button class="info-btn" data-info="${sc.id}" aria-label="${t("ui.howCalc")}">${ICON_I}</button></span><span></span></div>`;
    res.innerHTML = html;
  });

  paintTotals(model);
}

/* Totals only — never touches the scenario cards. Used by the partner service-cost
   input, which lives INSIDE #res-N: a full recompute() rewrites that block and would
   destroy the field mid-keystroke (the phase-2 bug; INVENTORY.md §e).
   This is a RENDER variant, not a second calculation: both call computeModel(). */
function refreshTotals(){
  paintTotals(computeModel());
}

/* The credibility guard is computed inside computeModel() (overlap.*): total monthly
   payroll saving as a share of the whole monthly payroll cost, on the same basis the
   scenarios are costed on. Above C.OVERLAP_WARN_PCT the scenarios almost certainly
   count the same working day twice. We warn and explain; we never block or clamp. */

/* ============================================================ ШАГ 4: УСЛУГИ
   Две функции вместо одной по той же причине, что и refreshTotals(): полная
   перерисовка блока во время набора съела бы ввод. buildServices() трогает
   строки (меняется только при смене выбора сценариев), paintServices() — только
   посчитанные ячейки и итог, полей не касается. */
function buildServices(){
  const el = document.getElementById("svc-body");
  if(!el) return;
  const chosen = scenarios.filter(sc=> state[sc.id].selected);
  if(!chosen.length){
    el.innerHTML = `<div class="note-line">${t("ui.svcEmpty")}</div>`;
    return;
  }
  el.innerHTML = `
    <div class="svc-table" role="table">
      <div class="svc-tr svc-tr--head" role="row">
        <span role="columnheader">${t("ui.svcColScenario")}</span>
        <span role="columnheader" class="svc-num">${t("ui.svcColSaving")}</span>
        <span role="columnheader" class="svc-fee-h">${t("ui.svcColFee")}
          <button class="info-btn" data-info="svc-summary" aria-label="${t("ui.aboutSvc")}">${ICON_I}</button></span>
      </div>
      ${chosen.map(sc=>`
      <div class="svc-tr" role="row" id="svcrow-${sc.id}">
        <span role="cell" class="svc-name"><i>${scNum(sc)}</i>${t(`sc.${sc.id}.title`)}</span>
        <span role="cell" class="svc-num">
          <b class="svc-lab">${t("ui.svcColSaving")}</b>
          <span id="svcsave-${sc.id}"></span></span>
        <!-- ЦЕНА ЗДЕСЬ ТОЛЬКО ЧИТАЕТСЯ, а вводится в карточке сценария (P13).
             Ячейка — кнопка: она и показывает цену, и ведёт ровно к тому полю,
             где её меняют. Значение пишет paintServices, чтобы оно обновлялось
             на каждом нажатии клавиши в карточке. -->
        <span role="cell" class="svc-fee">
          <b class="svc-lab">${t("ui.svcColFee")}</b>
          <button type="button" class="svc-cell" id="svcfee-${sc.id}" data-svc-goto="${sc.id}"
                  aria-label="${t("ui.svcRowGoto",{name:t(`sc.${sc.id}.title`)})}"></button>
        </span>
      </div>`).join("")}
      <div class="svc-tr svc-tr--total" role="row">
        <span role="cell">${t("ui.svcTotal")}</span>
        <span role="cell" class="svc-num svc-count" id="svc-count"></span>
        <span role="cell" class="svc-num svc-sum" id="svc-sum"></span>
      </div>
    </div>`;
}

function paintServices(model){
  const el = document.getElementById("svc-body");
  if(!el || !el.querySelector(".svc-table")) return;
  model.items.forEach(it=>{
    const cell = document.getElementById("svcsave-" + it.sc.id);
    /* У сценариев без эффекта на ФОТ (только выручка) экономии ФОТ нет вообще —
       «$0» читался бы как «ничего не даёт». Прочерк честнее. */
    if(cell) cell.textContent = it.sc.effect.includes("fot") ? fmtMoney(it.fot * 12) : "—";
    /* Цена — из состояния, а не из поля: поле теперь одно, и оно в карточке.
       Пустая цена показывается словами «not quoted yet», а не прочерком: прочерк
       читался бы как «услуга бесплатна», а это не квота вовсе. */
    const fee = document.getElementById("svcfee-" + it.sc.id);
    if(fee){
      const c = svcCost(it.sc);
      fee.textContent = c === null ? t("ui.notQuoted") : fmtMoney(c);
      fee.classList.toggle("svc-cell--empty", c === null);
    }
  });
  const svc = model.svc;
  const sum = document.getElementById("svc-sum");
  const cnt = document.getElementById("svc-count");
  if(sum) sum.textContent = fmtMoney(svc.sum);
  if(cnt) cnt.textContent = t("ui.svcQuotedOf", {quoted: svc.quoted, n: model.items.length});
}

/* ПЕРЕХОД К ПОЛЮ ЦЕНЫ. Поле одно — в карточке сценария (P13), поэтому и ссылка
   «not priced yet», и ячейка шага 4 ведут туда же. Раньше обе вели в таблицу
   шага 4, и партнёр правил цену в одном месте, а видел её в двух.
   Карточка выбранного сценария всегда раскрыта (выбор и раскрытие — одно и то же
   действие), так что поле после перехода видно без дополнительных кликов. */
function jumpToFee(id){
  const inp = document.getElementById("svc-" + id);
  if(!inp) return;
  const strip = inp.closest(".svc-strip");
  inp.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  inp.focus({preventScroll:true});
  if(strip){
    strip.classList.remove("svc-flash");
    void strip.offsetWidth;           /* перезапуск анимации при повторном клике */
    strip.classList.add("svc-flash");
  }
}
function jumpToUnpriced(){
  const first = scenarios.find(sc=> state[sc.id].selected && svcCost(sc) === null);
  if(first) jumpToFee(first.id);
}
document.addEventListener("click", e=>{
  if(e.target.closest("[data-svc-jump]")) return jumpToUnpriced();
  const cell = e.target.closest("[data-svc-goto]");
  if(cell) jumpToFee(+cell.dataset.svcGoto);
});

function paintTotals(model){
  /* Шаг 4 обновляется здесь, а не в refreshTotals(): через paintTotals проходят
     ОБА пути — и полный recompute(), и быстрый refreshTotals() при наборе цены.
     В refreshTotals цифры шага 4 оставались пустыми до первого пересчёта. */
  paintServices(model);
  lastModel = model;
  lastOverlap = model.overlap;
  renderSummary(model);
  renderTransition(model);
  renderPartnerPanel(model);
  renderPartnerWarning();
  const n = model.n;
  document.getElementById("nav-cnt").textContent = n
    ? t("ui.selected", {n, total:scenarios.length}) : t("ui.nothing");
  const extra = SHOW_REVENUE ? model.totals.revMonth + model.totals.potMonth : 0;
  /* Две цифры с явными периодами: месяц и год. Год — это тот же месяц x12, тот же
     model.totals, никакого второго расчёта. */
  /* Две формы подписи в разметке, выбор — за CSS: на широком экране короткая
     («Month») рядом с ведущим словом, на узком длинная («Saving / month») вместо
     него. Так период виден всегда, а высота полосы на мобильной не растёт. */
  /* wide — строка, у которой короткой формы подписи не существует: «Revenue +
     base potential» называет два слагаемых, и сократить его до одного слова
     значило бы вернуть ту самую склейку, которую сняли на приёмке. На узком
     экране такая строка занимает свою. */
  const fig = (short, long, value, wide) =>
    `<span class="nav-fig${wide ? " nav-fig--wide" : ""}"><i><span class="l-short">${short}</span>`
    + `<span class="l-long">${long}</span></i><b>${value}</b></span>`;
  document.getElementById("nav-tot").innerHTML = n
    ? `<span class="nav-k">${t("ui.navSaving")}</span>`
      + fig(t("ui.month"), t("ui.navPerMonth"), fmtMoney(model.totals.fotMonth))
      + fig(t("ui.year"),  t("ui.navPerYear"),  fmtMoney(model.totals.fotYear))
      + (extra>0 ? fig(t("ui.navPotLabel"), t("ui.navPotLabel"), fmtMoney(extra), true) : "")
    : "";
  syncNavbarInset();
}

/* Фактическая высота липкой полосы -> в переменную, из которой считается отступ
   снизу у страницы и scroll-padding. Меряем после каждой отрисовки и на ресайзе:
   высота зависит и от содержимого (счётчик переносится), и от ширины окна. */
function syncNavbarInset(){
  const bar = document.querySelector(".navbar");
  if(!bar) return;
  const h = Math.ceil(bar.getBoundingClientRect().height);
  if(h > 0) document.documentElement.style.setProperty("--b24x-navbar-h", h + "px");
}
if(typeof ResizeObserver === "function"){
  const bar = document.querySelector(".navbar");
  if(bar) new ResizeObserver(syncNavbarInset).observe(bar);
} else {
  addEventListener("resize", syncNavbarInset);
}
/* Тот же знак, что печатает отчёт в колонках экономии у сценария без эффекта
   на ФОТ. Держим рядом с row(), чтобы экран и документ не разъехались. */
const SCREEN_DASH = "\u2014";
const row = (l,v,cls) => `<div class="res-row"><span class="lbl">${l}</span><span class="val ${cls||""}">${v}</span></div>`;

/* selected Essentials plan -> Vibe+ target */
/* =============================================================================
   ПАРА ТАРИФОВ — два независимых выбора (шаг 5)
   Раньше цель была жёстко привязана к текущему тарифу: Basic -> Basic Vibe+.
   Теперь партнёр может показать апгрейд с запасом (Basic -> Standard Vibe+) и
   обосновать, что и более высокий тариф окупается.

   NO_B24 — «ещё нет Битрикс24». Вариант был и в оригинале
   (PRICE_CONFIG.cloud: {id:"none", name:"Ещё нет Битрикс24", monthly:0, subYear:0}),
   и там он считался НУЛЁМ, а в отчёт добавлялась фраза «В расчёте — полная
   стоимость подходящего тарифа и подписка». Ноль здесь — это ИЗВЕСТНАЯ цена
   (клиент сегодня не платит ничего), и её нельзя путать с «цена неизвестна».

   tgtAuto: пока партнёр не выбрал цель руками, она следует за текущим тарифом
   один-к-одному — обычный сценарий не требует выбирать дважды. */
const NO_B24 = "__none__";
let essPlan = "Standard";

/* СТАРЫЕ ИМЕНА ТИРОВ ИЗ СОХРАНЁННЫХ РАСЧЁТОВ.
   В официальной выгрузке 250-местный тир называется «Enterprise 250», а не
   «Enterprise», и остальные идут через пробел, а не через дефис. В файлах,
   сохранённых до этой выгрузки, лежат старые имена — без перевода такой файл
   открылся бы с молча подставленным другим тарифом. Перевод односторонний:
   пишем всегда новое имя. */
const ESS_PLAN_ALIASES = {
  "Enterprise": "Enterprise 250",
  "Enterprise-500": "Enterprise 500",
  "Enterprise-1000": "Enterprise 1000",
  "Enterprise-2000": "Enterprise 2000",
};
const normEssPlan = name => {
  if(name === NO_B24) return NO_B24;
  const n = ESS_PLAN_ALIASES[name] || name;
  return (PRICING.essentials.USD || []).some(r => r.plan === n) ? n : null;
};

/* Список Essentials для текущей валюты. Essentials опубликован ТОЛЬКО в USD —
   в выгрузке другого ключа нет вовсе. Валютный переключатель поэтому и скрыт
   (SHOW_CUR_SWITCH=false), а его обработчик отказывается переключаться туда, где
   Essentials нет: смешать цены Vibe+ в евро с ценами Essentials в долларах хуже,
   чем не дать переключить. Здесь остаётся простой факт: список всегда есть. */
function essentialsList(){
  return PRICING.essentials[CUR] || PRICING.essentials.USD || [];
}
/* ТАРИФЫ, НА КОТОРЫХ ЕСТЬ AI-АГЕНТЫ. Заказчик подтвердила: Alaio Professional
   Vibe+ и весь ряд Alaio Enterprise-* Vibe+; на Alaio Basic Vibe+ и Alaio
   Standard Vibe+ агентов нет.
   Список РАЗРЕШАЮЩИЙ, а не запрещающий, и это выбрано намеренно. Появись в
   прайсе новый тир с незнакомым именем — запрещающий список молча объявил бы,
   что агенты там есть, и партнёр продал бы воздух. Разрешающий в той же
   ситуации ошибается в другую сторону: покажет предупреждение там, где его
   могло не быть. Из двух ошибок вторая дешевле и заметнее. Незнакомое имя
   дополнительно кричит в консоль, чтобы список не устарел тихо. */
const AGENT_MIN_PLAN = "Alaio Professional Vibe+";
const AGENT_PLAN_RE  = /^Alaio (?:Professional|Enterprise-\d+) Vibe\+$/;
const AGENT_PLAN_NO  = /^Alaio (?:Basic|Standard) Vibe\+$/;
function planHasAgents(name){
  if(AGENT_PLAN_RE.test(name)) return true;
  if(!AGENT_PLAN_NO.test(name))
    console.error("planHasAgents: unknown Vibe+ plan, treated as WITHOUT agents:", name);
  return false;
}
/* Сценарии на агентах, недоступные на выбранной цели. Пустой массив = расхождения
   нет. Порядок — как в списке сценариев, чтобы предупреждение читалось так же,
   как шаг 3. */
function agentGatedItems(items, tgt){
  if(planHasAgents(tgt)) return [];
  return items.filter(it => it.sc.agent);
}

let tgtPlanName = null;    /* null = ещё не разрешено, ставится при первом рендере */
let tgtAuto = true;        /* true = следует за текущим тарифом 1:1 */

/* Цели соответствия один-к-одному, по ним же выдаётся промо-цена. */
const mapFor = plan => PRICING.migration.find(x => x.from === plan) || null;

/* Единственное место, где решается, что показывать в паре и можно ли считать
   разницу. Возвращает факты, а не текст: формулировки — в renderTransition(). */
/* Приводит tgtPlanName к существующему тарифу выбранной валюты. Зовётся и из
   planPair(), и из fillPlanSelects() — иначе список успевал отрисоваться до
   разрешения цели и подсвечивал не тот пункт. */
/* Цель по умолчанию: для тарифов из карты миграции — её пара, для новых тиров
   Enterprise — тот же тир Vibe+ по числу мест (Enterprise-1000 -> Alaio
   Enterprise-1000 Vibe+). Это не догадка: у обеих линеек тир назван ёмкостью. */
function autoTargetFor(plan){
  const m = mapFor(plan);
  if(m) return m.to;
  const row = (PRICING.essentials[CUR] || []).find(r => r.plan === plan);
  const vibeList = PRICING.vibePlus[CUR] || [];
  if(row && row.seats){
    const same = vibeList.find(v => seatsOf(v.plan) === row.seats);
    if(same) return same.plan;
  }
  return null;
}

function resolveTarget(){
  const vibeList = PRICING.vibePlus[CUR] || [];
  if(tgtPlanName == null || !vibeList.some(v => v.plan === tgtPlanName)){
    tgtPlanName = autoTargetFor(essPlan) || PRICING.migration[1].to;
  }
  return vibeList.find(v => v.plan === tgtPlanName) || vibeList[0];
}

function planPair(){
  const essList = essentialsList();
  const vibe = resolveTarget();

  /* «ДО»: ДВА СОСТОЯНИЯ, НЕ ТРИ.
     Третьим было «цены до нет»: Essentials публиковался только до 2000 мест, и для
     целей от 3000 сравнивать было не с чем. Официальная выгрузка Антона закрыла все
     пятнадцать тиров, поэтому разница считается для ЛЮБОЙ пары, а состояние
     удалено целиком — вместе с текстами ui.fromNoPriceTier / ui.fromNoPriceNote /
     ui.fromNoPriceCur / ui.targetOnly и ветками в отчёте.
     Оставшиеся два состояния: цена известна, и ноль как ИЗВЕСТНАЯ цена — у клиента
     ещё нет Битрикс24. Ноль тут не «нет данных», а факт, и его нельзя смешивать с
     отсутствием цены; ровно поэтому здесь по-прежнему две ветки, а не одна. */
  let from;
  if(essPlan === NO_B24){
    from = {kind:"none", name: t("ui.planNone"), annual: 0, monthly: 0, seats: null};
  } else {
    const ess = essList.find(x => x.plan === essPlan);
    /* essPlan нормализуется при загрузке (normEssPlan), а список приходит из
       essentialsList(), который гарантирует непустой массив. Если строка всё же
       не нашлась — это ошибка данных, а не состояние интерфейса: падаем на первом
       тире, но громко сообщаем в консоль, а не печатаем клиенту «цены нет». */
    if(!ess) console.error("planPair: unknown Essentials plan", essPlan);
    const row = ess || essList[0];
    from = {kind:"essentials", name: row.plan, annual: row.annual,
            monthly: row.monthly, seats: row.seats || null};
  }

  /* промо-цена существует только у четырёх целей из карты миграции */
  const promoRow = PRICING.migration.find(x => x.to === tgtPlanName);
  const matched = autoTargetFor(essPlan) === tgtPlanName;

  const diff = {perMonth: vibe.annual - from.annual, promo: null};

  return {from, vibe, promo: promoRow ? promoRow.promo : null, diff, matched,
          /* map остаётся для совместимости с остальным кодом: имя цели и промо */
          map: {from: essPlan, to: tgtPlanName, promo: promoRow ? promoRow.promo : null}};
}

/* Ёмкость тира из его имени: «Alaio Enterprise-1000 Vibe+» -> 1000,
   «Enterprise 1000» -> 1000. У Basic/Standard/Professional мест в имени нет. */
const seatsOf = plan => { const m = /-(\d+)\s+Vibe\+/.exec(plan) || /[\s-](\d+)$/.exec(plan);
                          return m ? +m[1] : null; };
/* essentialsFor() и isMatchedTier() удалены: они отвечали на вопрос «есть ли у этой
   цели пара в Essentials», а после официальной выгрузки ответ всегда «да» — все
   пятнадцать тиров опубликованы. Группировка селекторов теперь идёт по ёмкости
   (SELECT_GROUP_SEATS), а не по наличию пары. */
const SELECT_GROUP_SEATS = 2000;   /* граница между двумя optgroup, только вёрстка
                                      — на расчёт не влияет */
/* Обёртка для остального кода: подписка и итоги берут цель отсюда. */
function targetPlan(){
  const p = planPair();
  return {map: p.map, vibe: p.vibe};
}
/* subscriptionYear() removed: it derived a total outside computeModel().
   The figure now lives in model.totals.subscriptionYear only. */

/* ГОТОВЫЙ ТЕКСТ ЧУВСТВИТЕЛЬНОСТИ — один на экран и на отчёт, тем же порядком, что
   оба предупреждения и пометка о режиме: формулировка обязана быть одна, иначе
   партнёр говорит клиенту одно, а бумага другое. */
function sensitivityText(cap){
  return cap.atFloor
    ? t("ui.sensFloor", {pct: realisationPct() + "%"})
    : t("ui.sensAbove", {money: fmtMoney(cap.floorFotYear), hours: fmtHours(cap.floorHoursYear)});
}

function renderSummary(model){
  const el = document.getElementById("sum-body");
  /* ИСКЛЮЧЁННЫЕ ПО ОШИБКЕ ВВОДА — показываем ДО проверки model.any.
     Если единственный выбранный сценарий невалиден, any=false, и без этого
     блока партнёр увидел бы «выберите хотя бы один сценарий» при выбранном
     сценарии — то есть интерфейс спорил бы сам с собой. */
  const badBlock = model.invalid && model.invalid.length
    ? `<div class="sum-invalid"><img src="assets/icons/alert.svg" alt="">
         <div><b>${t(model.invalid.length === 1 ? "ui.invalidH1" : "ui.invalidH",
                    {n: model.invalid.length})}</b>
         <ul class="warn-list">${model.invalid.map(x=>`<li>${x.title}</li>`).join("")}</ul>
         <p style="margin:var(--b24-s2) 0 0">${t("ui.invalidBody")}</p></div></div>`
    : "";
  if(!model.any){ el.innerHTML = badBlock + `<div class="empty">${t("ui.pickOne")}</div>`; return; }
  /* display only — every figure comes from the model, nothing is derived here */
  const rg = model.revGuard;
  const cap = model.capacity;
  const {fotMonth:fot, fotYear, revMonth:rev, potMonth:pot,
         subscriptionYear:subYear, firstYearCost:costs, netFirstYear:net} = model.totals;
  const svc = model.svc, qual = model.qual;
  const neg = net < 0;
  el.innerHTML = badBlock + `
    <div class="sum-grid">
      <div class="h"></div><div class="h">${t("ui.month")}</div><div class="h year">${t("ui.year")}</div>
      <div class="lbl">${t("ui.sumFot")}</div>
      <div class="num">${fmtMoney(fot)}</div><div class="num year">${fmtMoney(fotYear)}</div>
      <div class="fot-meaning">${t("ui.fotMeaning")}</div>
      <div class="fot-meaning fot-real">${
        /* ДОПУЩЕНИЕ СТОИТ ПРИ ЦИФРЕ, А НЕ ОБЩЕЙ ОГОВОРКОЙ ВНИЗУ. Режим двигает
           именно эту сумму, и партнёр обязан видеть, на чём она построена, в тот
           же момент, когда её называет. Вид тот же, что у строки «что эта цифра
           означает», плюс полужирное имя режима: это соседние по смыслу
           пояснения, но допущение — то, которое партнёр переключает. */
        t("ui.realSummary", copyVars())}</div>
      ${/* ТРИ ВЕЛИЧИНЫ РЯДОМ: ЧАСЫ -> СТОИМОСТЬ ЭТИХ ЧАСОВ -> КЭШ.
           Средняя из трёх — это строка выше («Total payroll saving»), и второй раз
           она не печатается: одна и та же сумма двумя строками читалась бы как две
           разные. Деньги остаются главной цифрой и стоят первыми — решение
           заказчика; часы встают под ними, потому что это та же величина в
           единицах, которые клиент может сверить.
           ТРЕТЬЯ СТРОКА ПОЧТИ ВСЕГДА ПУСТА, И ОНА ЗДЕСЬ ИМЕННО ПОЭТОМУ. Вопрос
           «мы кого-то уволим?» финансовый директор задаёт первым (OPEN_QUESTIONS
           §11), и ответ на него лучше дать раньше вопроса. Прочерк, а не «$0»:
           ноль в колонке денег читается как «ничего не даёт», а тут наоборот —
           эффект есть, он просто не в кассе. */
        ""}
      <div class="lbl">${t("ui.capHours")}</div>
      <div class="num">${fmtHours(cap.hoursMonth)}</div>
      <div class="num year">${fmtHours(cap.hoursYear)}</div>
      <div class="fot-meaning">${t("ui.capHoursNote", {fte: fmtFte(cap.fte),
          peryear: fmtInt(cap.hoursPerEmployeeYear), permonth: fmtInt(contractHours())})}</div>
      <div class="lbl">${t("ui.capCash")}</div>
      <div class="num">${SCREEN_DASH}</div>
      <div class="num year">${SCREEN_DASH}</div>
      <div class="fot-meaning">${t("ui.capCashNote")}</div>
      ${(SHOW_REVENUE && rev>0)?`<div class="lbl">${t("ui.sumRev")}</div><div class="num">${fmtMoney(rev)}</div>
        <div class="num year">${fmtMoney(rev*12)}</div>`:""}
      ${(SHOW_REVENUE && pot>0)?`<div class="lbl">${t("ui.sumPot")}</div><div class="num">${fmtMoney(pot)}</div>
        <div class="num year">${fmtMoney(pot*12)}</div>`:""}
      <div class="sum-line"></div>
      <div class="fullrow"><span>${t("ui.sumSvc")}
        <button class="info-btn" data-info="svc-summary" aria-label="${t("ui.aboutSvc")}"
          style="color:var(--b24-on-navy)">${ICON_I}</button></span>
        <span class="v">− ${fmtMoney(svc.sum)}</span></div>
      ${svc.unquoted>0?`<div class="fullrow"><span style="font-size:12.5px;color:var(--b24-on-navy-soft)">
        ${t("ui.svcUnquoted",{n:svc.unquoted})}
        <button type="button" class="svc-jump svc-jump--navy" data-svc-jump
          aria-label="${t("ui.svcJumpAria")}">${t("ui.svcJump")}</button></span><span></span></div>`
        /* Подтверждение, что оценены все. Строка ui.svcAllPriced существовала, но
           не была подключена ни к чему: при всех оценённых сценариях
           предупреждение просто исчезало, и партнёр не знал, посчитано ли всё
           или он что-то пропустил. */
        :(svc.quoted>0?`<div class="fullrow"><span style="font-size:12.5px;color:var(--b24-on-navy-soft)">
        ${t("ui.svcAllPriced")}</span><span></span></div>`:"")}
      <div class="fullrow"><span>${t("ui.sumSub")} · ${targetPlan().map.to}</span>
        <span class="v">− ${fmtMoney(subYear)}</span></div>
      <div class="sum-line"></div>
      <div class="fullrow"><span>${t("ui.sumCosts")}</span><span class="v">− ${fmtMoney(costs)}</span></div>
      <div class="fullrow net"><span>${t("ui.sumNet")}</span><span class="v">${fmtMoney(net)}</span></div>
      ${/* ДВА ПОРОГА — ДВА РАЗНЫХ БЛОКА, И РАЗНИЦА ВИДНА ДО ЧТЕНИЯ.
           Жёсткий — янтарная плашка с иконкой, как была. Мягкий — без иконки, без
           заливки, приглушённым цветом сводки: подсказка не имеет права выглядеть
           как тревога, иначе через неделю их перестанут различать оба.
           Печатается ровно один из двух: level говорит какой. */
        lastOverlap.level === "hard" ? `<div class="overlap-warn">
        <img src="assets/icons/alert.svg" alt="">
        <div><b>${t("ui.overlapH",{pct:fmtPct1(lastOverlap.pct)})}</b><br>
        ${t("ui.overlapBody",{pct:fmtPct1(lastOverlap.pct), limit:lastOverlap.threshold,
                              payroll:fmtMoney(lastOverlap.payroll)})}
        <span class="warn-src">${t("ui.overlapSource")}</span></div></div>`
        : lastOverlap.level === "soft" ? `<div class="overlap-note">
        <b>${t("ui.overlapNoteH",{pct:fmtPct1(lastOverlap.pct)})}</b><br>
        ${t("ui.overlapNoteBody",{pct:fmtPct1(lastOverlap.pct), note:lastOverlap.note,
                                  payroll:fmtMoney(lastOverlap.payroll)})}
        <span class="warn-src">${t("ui.overlapSource")}</span></div>`
        : ""}
      ${/* ВТОРОЙ ПРЕДОХРАНИТЕЛЬ, ОТДЕЛЬНОЙ ПОЛОСОЙ. Свести оба в одну полосу
           нельзя: они про разные деньги (проверяемая экономия против прогноза) и
           лечатся разными полями. Полоса та же по виду — один смысл, один вид. */
        (rg && !rg.ok) ? `<div class="overlap-warn">
        <img src="assets/icons/alert.svg" alt="">
        <div><b>${t("ui.revWarnH",{pct:fmtPct1(rg.pct)})}</b><br>
        ${t("ui.revWarnBody",{pct:fmtPct1(rg.pct), limit:rg.threshold,
                              projected:fmtMoney(rg.projectedYear),
                              pool:fmtMoney(rg.poolYear), parts:revPoolParts(rg)})}</div></div>` : ""}
      <div class="verdict${neg?" neg":""}">
        ${neg?"":'<img src="assets/icons/badge-check.svg" alt="">'}
        <span>${neg ? t("ui.verdictNeg",{v:fmtMoney(Math.abs(net))})
                    : t("ui.verdictPos",{v:fmtMoney(net)})}</span>
      </div>
      ${/* ОКУПАЕМОСТЬ СТОИТ ПОСЛЕ ВЕРДИКТА, А НЕ РЯДОМ С ЧАСАМИ: это величина про
           затраты первого года, и её место — там, где затраты уже названы.
           Заблокированная печатает причину и кнопку, ведущую в шаг 4, а не число. */
        cap.paybackBlocked === "unquoted" ? `<div class="overlap-note">
        <b>${t("ui.payBlockedH")}</b><br>
        ${t("ui.payBlockedBody", {n: cap.unquoted})}
        <button type="button" class="svc-jump svc-jump--navy" data-svc-jump
          aria-label="${t("ui.svcJumpAria")}">${t("ui.svcJump")}</button></div>`
        : cap.paybackBlocked === "nosaving" ? `<div class="fullrow"><span
            style="font-size:12.5px;color:var(--b24-on-navy-soft)">${t("ui.payNoSaving")}</span><span></span></div>`
        : `<div class="fullrow"><span>${t("ui.capPayback")}</span>
             <span class="v">${fmtPayback(cap.paybackMonths)}</span></div>
           <div class="fot-meaning">${t("ui.payNote")}</div>`}
      <div class="fot-meaning">${sensitivityText(cap)}</div>
      ${qual?`<div class="qual">${t("qual.7")}</div>`:""}
      <div class="fullrow" style="margin-top:var(--b24-s3)">
        <span style="font-size:12.5px;color:var(--b24-on-navy-soft)">${t("ui.summaryInfo",copyVars())}</span>
      </div>
    </div>`;
}

/* ПРЕДУПРЕЖДЕНИЕ О РАСХОЖДЕНИИ. Показывает факт и даёт кнопку, но ничего не
   запрещает: выбор сценариев не блокируется, цель не подменяется сама.
   Аргумент — модель, а не глобальное состояние: состав выбранных сценариев и
   доля итога уже посчитаны там, и второй раз их считать здесь нельзя, иначе
   экран и отчёт разъедутся. Модель может быть не передана (первый рендер до
   recompute) — тогда просто прячем блок. */
/* КОНТАКТЫ ПАРТНЁРА ПЕРЕД СКАЧИВАНИЕМ. Отдельная функция, а не проверка внутри
   обработчика кнопки: предупреждение должно стоять на экране ДО нажатия, иначе
   партнёр узнаёт о проблеме, когда PDF уже у него. Ничего не блокирует.
   Условий два, и они про разное: подпись (имя или компания) и канал связи.
   Отсутствие любого из них делает документ бесполезным для клиента, поэтому
   считаются оба, а в тексте перечисляется то, чего не хватает. */
function renderPartnerWarning(){
  const box = document.getElementById("pdf-warn-pt");
  if(!box) return;
  const has = k => !!String(partner[k] || "").trim();
  const noName    = !has("person") && !has("company");
  const noContact = !has("email") && !has("phone") && !has("site");
  if(!noName && !noContact){ box.hidden = true; return; }
  const what = [];
  if(noName)    what.push(t("ui.ptWarnName"));
  if(noContact) what.push(t("ui.ptWarnContact"));
  document.getElementById("pdf-warn-pt-h").textContent = t("ui.ptWarnH");
  document.getElementById("pdf-warn-pt-b").textContent =
    t("ui.ptWarnBody", {what: what.join(", ")});
  box.hidden = false;
}

function renderAgentWarning(model){
  const box = document.getElementById("warn-agents");
  if(!box) return;
  const g = model && model.any ? model.agentGate : null;
  if(!g || !g.ids.length){ box.hidden = true; return; }
  const plan = planPair().map.to;
  document.getElementById("warn-agents-h").textContent =
    g.ids.length === 1 ? t("ui.agentWarnH1", {plan})
                       : t("ui.agentWarnH", {n: g.ids.length, plan});
  /* Список — узлами, а не innerHTML: названия приходят из I18N, но собирать
     разметку из строк здесь незачем, а textContent снимает вопрос экранирования
     на будущее, когда появится немецкий перевод. */
  const ul = document.getElementById("warn-agents-list");
  ul.textContent = "";
  g.titles.forEach(x => { const li = document.createElement("li"); li.textContent = x; ul.appendChild(li); });
  document.getElementById("warn-agents-body").textContent =
    t("ui.agentWarnBody", {min: g.minPlan, fot: fmtMoney(g.fotYear), plan});
  const btn = document.getElementById("warn-agents-fix");
  btn.textContent = t("ui.agentWarnFix", {min: g.minPlan});
  box.hidden = false;
}

function renderTransition(model){
  const P = planPair();
  const from = P.from, vibe = P.vibe;
  document.getElementById("warn-eur").hidden = true;
  renderAgentWarning(model);

  /* Цена «до» известна всегда: либо строка выбранного тира, либо ноль у клиента
     без Битрикс24. Ветки «цены нет» больше нет.
     Строка Monthly раньше пряталась там, где источник её не публиковал (Enterprise
     с публичного сайта). В официальной выгрузке monthly есть у всех пятнадцати
     тиров, поэтому условие снято — прятать больше нечего. У «нет Битрикс24»
     monthly равен нулю, и это тоже настоящая цифра. */
  const fromPrice =
    `<div class="tr-price">${fmtMoney(from.annual)}</div>
     <div class="tr-per">${t("ui.perPlanMonth")}</div>
     <div class="tr-rows">
       <div><span>${t("ui.monthly")}</span><b>${fmtMoney(from.monthly)}</b></div>
       <div><span>${t("ui.annualTotal")}</span><b>${fmtMoney(from.annual*12)}</b></div>
     </div>`;

  document.getElementById("tr-grid").innerHTML = `
    <div class="tr-col">
      <div class="tr-k">${t("ui.from")}</div>
      <div class="tr-name">${from.name}</div>
      ${fromPrice}
    </div>
    <div class="tr-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    <div class="tr-col to">
      <div class="tr-k">${t("ui.to")}</div>
      <div class="tr-name">${vibe.plan}</div>
      <div class="tr-price">${fmtMoney(vibe.annual)}</div>
      <div class="tr-per">${t("ui.perPlanMonth")}</div>
      <div class="tr-rows">
        <div><span>${t("ui.monthly")}</span><b>${fmtMoney(vibe.monthly)}</b></div>
        <div><span>${t("ui.annualTotal")}</span><b>${fmtMoney(vibe.annualTotal)}</b></div>
      </div>
    </div>`;

  /* Разница считается всегда — для любой из 15x16 пар. */
  const diffEl = document.getElementById("diff-rows");
  {
    const dPerMonth = P.diff.perMonth;
    const dPerYear  = dPerMonth * 12;
    /* Одна точка, где решается знак: «+ N больше», «− N меньше» или «та же цена».
       Печатать «+ -$220» нельзя ни в одном из трёх мест, где разница видна. */
    const box = (v, moreKey, lessKey) => {
      if(v === 0) return `<div class="gap-box"><div class="gap-n">${fmtMoney(0)}</div>
        <div class="gap-l">${t("ui.diffSame")}</div></div>`;
      const up = v > 0;
      return `<div class="gap-box"><div class="gap-n">${up ? "+" : "\u2212"} ${fmtMoney(Math.abs(v))}</div>
        <div class="gap-l">${t(up ? moreKey : lessKey)}</div></div>`;
    };
    diffEl.innerHTML =
        box(dPerMonth, "ui.diffPerMonth", "ui.diffLessPerMonth")
      + box(dPerYear,  "ui.diffPerYear",  "ui.diffLessPerYear")
      + `
      ${from.kind==="none"?`<div class="gap-box gap-box--wide">
        <div class="gap-l">${t("ui.pairNoteNone")}</div></div>`:""}`;
  }

}

/* ---- report export: serialise the model for scripts/build-report.mjs ----
   Carries RAW, unrounded figures. The report rounds on display, exactly as the
   screen does, so both surfaces show the same number. Do not round here.
   `display` carries the strings the screen is showing right now; the parity test
   (scripts/check-parity.mjs) asserts the report renders the same ones. */
function reportState(){
  const m = lastModel || computeModel();
  /* Подписи полей одного набора значений. Один и тот же формат нужен и базовому
     набору, и каждому сегменту — поэтому вынесено. */
  const fieldsOf = (sc, vals) => sc.fields
    .filter(f=>!f.revOnly || SHOW_REVENUE)
    .map(f=>({label: t(`sc.${sc.id}.f.${f.k}`),
              /* ПРИЗНАК «ЭТО ЦИФРА КЛИЕНТА» едет в отчёт, а полная родословная —
                 нет, и это решение. Клиенту на странице входных данных нужны две
                 вещи: какие числа его собственные (их он подтверждает или
                 заменяет) и что вендорских бенчмарков здесь нет вовсе. Тип
                 происхождения каждого из сорока восьми полей ему не нужен —
                 он нужен ПАРТНЁРУ, и живёт на экране. */
              client: f.org === "client",
              /* ТИП ПРОИСХОЖДЕНИЯ СТРОКОЙ. Лист допущений (P16) печатает его
                 столбцом: финансист, которого не было на встрече, обязан видеть не
                 только что мы ввели, но и на чём это стоит. Полная формулировка
                 остаётся на экране у партнёра — в документ идёт тип. */
              origin: orgOf(f) ? t(orgOf(f).pill) : null,
              value: f.suf==="share"
                ? fmtPct(vals[f.k])
                : (f.suf==="money" ? fmtMoney(vals[f.k])
                                   /* у полей, считающих людей и клиентов, единицы нет —
                                      печатаем голое число, а не число с висящим пробелом */
                                   : (u => fmtInt(vals[f.k]) + (u ? " " + u : ""))(t(SUF[f.suf])))}));
  const items = m.items.map(it=>{
    const sc = it.sc;
    return {
      id: sc.id,
      title: t(`sc.${sc.id}.title`),
      role: t(`sc.${sc.id}.role`),
      driver: sc.driver,
      coverage: sc.cov ? covOf(sc) : null,
      fotMonth: it.fot,          // raw
      fotYear: it.fot * 12,      // raw
      /* ЧАСЫ ПО СЦЕНАРИЮ. Отчёт их не печатает — сумма едет в capacity, — но без
         них check-golden не может закрепить часы КАЖДОГО сценария, а именно это
         единственная защита от расхождения часов с деньгами: два объявления
         рядом с формулой, и разъехаться они могут только молча. */
      hours: it.hours,           // raw
      rev: sc.effect.includes("rev") ? it.rev : 0,
      revLabel: sc.effect.includes("rev") ? t(sc.revLabel || "ui.revDefault") : null,
      service: it.service,                  // null = not quoted
      /* ЧТО ЭТОТ СЦЕНАРИЙ ДАЁТ — ФОТ, ВЫРУЧКУ ИЛИ И ТО И ДРУГОЕ.
         Отчёту это нужно, чтобы не печатать «$0» там, где экономии ФОТ не бывает
         в принципе: у сценария с эффектом только на выручку ноль в колонке
         экономии читается как «ничего не даёт». На экране в шаге 4 там давно
         прочерк (paintServices), отчёты про это не знали. Признак — состав
         effect, а НЕ равенство нулю: сценарий с эффектом на ФОТ и честным нулём
         на входных данных обязан печатать $0, а не прочерк. */
      hasFot: sc.effect.includes("fot"),
      hasRev: sc.effect.includes("rev"),
      /* НУЖЕН ЛИ ЭТОМУ СЦЕНАРИЮ AI-АГЕНТ. Признак самого сценария, не зависящий
         от выбранной цели: помечать строку или нет, решает отчёт, сверяясь с
         agentGate.planHasAgents. */
      needsAgent: !!sc.agent,
      fields: fieldsOf(sc, state[sc.id].values),
      /* СЕГМЕНТЫ ЕДУТ В ОБА ОТЧЁТА. Итог их и раньше учитывал (computeScenario
         суммирует базовый набор и все сегменты), а страница «The numbers we
         entered» показывала только базовый — то есть клиенту предлагалось
         проверить сумму по неполному списку входных данных. Здесь лежат наборы
         полей ДОБАВЛЕННЫХ сегментов, по одному массиву на сегмент; базовый —
         по-прежнему в fields. Пустой массив = сегментов нет. */
      segments: (state[sc.id].segments || []).map(sv=>fieldsOf(sc, sv)),
    };
  });
  const svc = m.svc;
  const {map, vibe} = m.plan;
  const PP = m.plan.pair;         /* та же пара, что посчитала модель */
  const T = m.totals;
  return {
    lang: LANG, currency: CUR, showRevenue: SHOW_REVENUE,
    generatedFor: partner.company || "",
    /* includes partner.logo — a data URI or an absolute URL. The report shows it
       beside the Bitrix24 lockup as a separate mark. */
    partner: {...partner},
    /* contractDays убран вместе с константой: договорных дней, отличных от рабочих,
       в модели больше нет. contractHours теперь производная от daysMonth. */
    economics: {daysMonth, dayHours: C.DAY_HOURS,
                contractHours: contractHours(), burdenPct},
    /* МОЩНОСТЬ ЕДЕТ ВМЕСТЕ С ДАННЫМИ. Сырые величины плюс ГОТОВЫЕ строки: отчёт
       ничего не считает и единицу окупаемости не выбирает — иначе экран показал бы
       недели, а бумага месяцы. Причина блокировки едет признаком, а не текстом:
       формулировку собирает отчёт из своих слов, а решение «показывать или нет»
       принято здесь, один раз, для обеих поверхностей. */
    capacity: {
      hoursMonth: m.capacity.hoursMonth,          // raw
      hoursYear: m.capacity.hoursYear,            // raw
      fte: m.capacity.fte,                        // raw
      hoursPerEmployeeYear: m.capacity.hoursPerEmployeeYear,
      hoursPerEmployeeMonth: contractHours(),
      paybackMonths: m.capacity.paybackMonths,    // raw; null = не показывается
      paybackBlocked: m.capacity.paybackBlocked,  // null | "unquoted" | "nosaving" | "none"
      unquoted: m.capacity.unquoted,
      atFloor: m.capacity.atFloor,
      floorFotYear: m.capacity.floorFotYear,
      floorHoursYear: m.capacity.floorHoursYear,
      sensitivityText: sensitivityText(m.capacity),
      cashNote: t("ui.capCashNote"),
    },
    /* РЕЖИМ РЕАЛИЗАЦИИ ЕДЕТ ВМЕСТЕ С ДАННЫМИ, и текст едет ГОТОВЫМ — тем же
       порядком, что оба предупреждения. Клиент обязан видеть, на каком допущении
       построен расчёт, а формулировка обязана быть одна на экране и в документе.
       Множитель кладём числом рядом с именем: отчёту он не нужен для расчёта
       (он ничего не считает), но без него состояние нельзя проверить глазами.
       Состояния, снятые до этой правки, блока не несут — печатать им нечего. */
    realisation: {
      id: realisationId,
      k: realisation(),
      mode: t("ui.realMode." + realisationId),
      case: t("ui.realCase." + realisationId),
      pct: realisationPct(),
      isDefault: realisationId === REALISATION_DEF,
      text: t("ui.realReport", copyVars()),
    },
    /* The credibility guard travels WITH the data, so the warning cannot be lost
       between the screen and the PDF. */
    overlap: {
      /* level несёт КАКОЙ из двух порогов сработал; ok оставлен, по нему
         разбивается лист отчёта и работает check-parity. Оба порога едут числами:
         отчёт их не знает и знать не должен, но без них состояние нельзя
         проверить глазами. */
      level: m.overlap.level,
      ok: m.overlap.ok,
      pct: m.overlap.pct,                  // raw; formatted on display
      note: C.OVERLAP_NOTE_PCT,
      threshold: C.OVERLAP_WARN_PCT,
      payrollMonth: m.overlap.payroll,     // raw
      /* Строка о происхождении диапазона едет ВСЕГДА, когда сработал любой из
         порогов: она относится к самому утверждению о диапазоне, а не к силе
         предупреждения. */
      source: m.overlap.ok ? null : t("ui.overlapSource"),
      /* ТЕКСТ МЯГКОГО ЗАМЕЧАНИЯ ЕДЕТ ГОТОВЫМ — как у предохранителя по выручке:
         формулировка одна на экран и на документ. Жёсткое предупреждение отчёт
         по-прежнему собирает у себя (так было и так остаётся: его формулировку
         эта правка не трогает), поэтому здесь у него только исходные величины. */
      noteText: m.overlap.level === "soft"
        ? t("ui.overlapNoteReport", {pct: fmtPct1(m.overlap.pct),
                                     note: C.OVERLAP_NOTE_PCT,
                                     payroll: fmtMoney(m.overlap.payroll)})
        : null,
      text: m.overlap.level === "hard"
        ? t("ui.overlapReport", {pct: fmtPct1(m.overlap.pct), limit: C.OVERLAP_WARN_PCT})
        : null,
    },
    /* ПРЕДОХРАНИТЕЛЬ НА ВЫРУЧКУ едет тем же порядком, что и overlap: сырые
       числа плюс готовый текст, чтобы формулировка была одна на два носителя и
       предупреждение не потерялось между экраном и PDF. */
    revGuard: {
      ok: m.revGuard.ok,
      measured: m.revGuard.measured,
      pct: m.revGuard.pct,                      // raw; formatted on display
      threshold: m.revGuard.threshold,
      poolYear: m.revGuard.poolYear,            // raw
      poolTargetYear: m.revGuard.poolTargetYear,
      poolBaseYear: m.revGuard.poolBaseYear,
      projectedYear: m.revGuard.projectedYear,  // raw
      text: m.revGuard.ok ? null
        : t("ui.revWarnReport", {pct: fmtPct1(m.revGuard.pct), limit: m.revGuard.threshold,
                                 projected: fmtMoney(m.revGuard.projectedYear),
                                 pool: fmtMoney(m.revGuard.poolYear),
                                 parts: revPoolParts(m.revGuard)}),
    },
    /* РАСХОЖДЕНИЕ ПО АГЕНТАМ ЕДЕТ ВМЕСТЕ С ДАННЫМИ — по той же причине, что и
       overlap: раскрытие нельзя потерять между экраном и PDF. Готовый текст
       кладём здесь же, чтобы формулировка была одна на два носителя. */
    agentGate: {
      planHasAgents: m.agentGate.planHasAgents,
      minPlan: m.agentGate.minPlan,
      ids: m.agentGate.ids,
      titles: m.agentGate.titles,
      fotMonth: m.agentGate.fotMonth,        // raw
      fotYear: m.agentGate.fotYear,          // raw
      rowNote: t("ui.agentReportNote", {plan: m.agentGate.minPlan}),
    },
    /* Список исключённых по ошибке ввода едет вместе с данными: сборка отчёта
       обязана отказаться, а не решать это по своим догадкам. */
    invalid: (m.invalid || []).map(x => ({id: x.id, title: x.title})),
    /* ОБЩИЕ ДОПУЩЕНИЯ РАСЧЁТА — то, что действует на ВСЕ сценарии сразу и до
       правки P16 в документе было размазано: длина месяца пряталась в блоке
       оснований, режим реализации — в подписи строки итога, численность и оклад
       не печатались вовсе. Финансисту, которого не было на встрече, нужно ровно
       это: на каких общих величинах стоит вся сумма.
       Собирается здесь, а не в отчёте: отчёт величин не выводит. */
    assumptions: [
      {label: t("co.empCount"),  value: fmtInt(company.empCount),
       origin: t("org.pill.client")},
      {label: t("co.empSal"),    value: fmtMoney(company.empSal),
       origin: t("org.pill.ours")},
      {label: t("ui.days"),      value: fmtInt(daysMonth),
       origin: t("org.pill.ours")},
      {label: t("ui.paidHours"), value: fmtInt(contractHours()),
       origin: t("org.pill.derived")},
      {label: t("ui.burden"),    value: fmtInt(burdenPct) + "%",
       origin: t("org.pill.ours")},
      {label: t("ui.realLabel"), value: t("ui.realMode." + realisationId) + " · " + realisationPct() + "%",
       origin: t("org.pill.ours")},
    ],
    /* ГОТОВАЯ СТРОКА ПРО ПРОИСХОЖДЕНИЕ — как и оба предупреждения, собирается
