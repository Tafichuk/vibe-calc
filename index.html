const BASE_TITLE = document.title;

function reportToPdf(){
  pdfSay(null);
  const model = computeModel();
  if(!model.any){ pdfSay("ui.pdfNoScenarios"); return; }

  const st = reportState();
  const {html, hits, missing, blocked} = buildReport(st, {assets: reportAssets()});

  if(blocked && blocked.length){
    pdfSay("ui.pdfRefusedInvalid", {what: blocked.length});
    return;
  }
  if(missing && missing.length){
    pdfSay("ui.pdfRefusedGate", {what: missing.join(", ")});
    return;
  }
  if(hits.length){
    pdfSay("ui.pdfRefused", {what: hits.join(", ")});
    return;
  }

  const frame = document.createElement("iframe");
  frame.setAttribute("aria-hidden", "true");
  frame.title = "Report for the client";
  frame.style.cssText = "position:fixed; left:-10000px; top:0; width:210mm; height:297mm; border:0;";
  document.body.appendChild(frame);

  const doc = frame.contentDocument;
  doc.open(); doc.write(html); doc.close();

  document.title = doc.title || BASE_TITLE;
  const restoreTitle = () => { document.title = BASE_TITLE; };
  frame.contentWindow.addEventListener("afterprint", restoreTitle, {once:true});
  setTimeout(restoreTitle, 120000);

  const waitStyles = () => new Promise(res => {
    const link = doc.querySelector('link[rel="stylesheet"]');
    if(!link || link.sheet) return res();
    let done = false;
    const finish = () => { if(!done){ done = true; res(); } };
    link.addEventListener("load", finish, {once:true});
    link.addEventListener("error", finish, {once:true});
    setTimeout(finish, 8000);
  });
  const waitImages = () => Promise.all([...doc.images].map(img =>
    img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })));

  const print = async () => {
    await waitStyles();
    await waitImages();
    try { await frame.contentWindow.document.fonts.ready; } catch(e){}
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    try {
      frame.contentWindow.focus();
      frame.contentWindow.print();
      restoreTitle();
    } catch(e){
      const w = window.open("", "_blank");
      if(w){ w.document.open(); w.document.write(html); w.document.close(); }
    }
    setTimeout(() => frame.remove(), 120000);
  };
  if(doc.readyState === "complete") print(); else frame.onload = print;
}

function applyLoadedState(st){
  const R = st.restore && st.restore.version === 1 ? st.restore : null;

  const co = (R && R.company) || st.company;
  if(co) Object.keys(company).forEach(k=>{ if(co[k] != null) company[k] = co[k]; });

  const days = R ? R.daysMonth : (st.economics && st.economics.daysMonth);
  const burd = R ? R.burdenPct : (st.economics && st.economics.burdenPct);
  if(days) daysMonth = days;
  if(burd != null) burdenPct = burd;

  const pt = (R && R.partner) || st.partner;
  if(pt) PARTNER_FIELDS.forEach(k=>{ if(pt[k] != null) partner[k] = pt[k]; });
  savePartner();

  scenarios.forEach(sc=>{ state[sc.id].selected = false; state[sc.id].segments = []; });
  const svc = {};
  const rows = R ? R.scenarios : (st.items || []);
  rows.forEach(row=>{
    const sc = scenarios.find(x=>x.id === row.id);
    if(!sc) return;
    const stt = state[sc.id];
    stt.selected = true;
    if(row.coverage != null) stt.coverage = row.coverage;
    if(row.values)   stt.values   = {...stt.values, ...row.values};
    if(row.dirty)    stt.dirty    = {...row.dirty};
    if(row.segments) stt.segments = row.segments.map(seg=>({...seg}));
    if(row.service != null) svc[String(sc.id)] = row.service;
  });
  try{ localStorage.setItem(SVC_LS, JSON.stringify(svc)); }catch(e){}

  if(R && R.plan){
    essPlan     = normEssPlan(R.plan.essPlan) || essPlan;
    tgtPlanName = R.plan.tgtPlanName || tgtPlanName;
    tgtAuto     = !!R.plan.tgtAuto;
  } else if(st.plan){
    const fromName = String(st.plan.from || "");
    essPlan = fromName === t("ui.planNone") ? NO_B24 : (normEssPlan(fromName) || essPlan);
    if(st.plan.to && (PRICING.vibePlus[CUR]||[]).some(v=>v.plan === st.plan.to)){
      tgtPlanName = st.plan.to;
      const m = mapFor(essPlan);
      tgtAuto = !!(m && m.to === st.plan.to);
    }
  }

  const rev = R ? R.showRevenue : st.showRevenue;
  if(rev != null){
    SHOW_REVENUE = !!rev;
    const cb = document.getElementById("show-rev"); if(cb) cb.checked = SHOW_REVENUE;
  }
  const rid = R ? R.realisation : st.realisation;
  realisationId = REALISATION.some(r=>r.id === rid) ? rid : REALISATION_DEF;
  paintRealisation();
  document.getElementById("burden").value = String(burdenPct);
  document.getElementById("days").value = String(daysMonth);

  rerenderAll();
  buildServices();
  recompute();
  return !!R;
}

function loadStateFile(input){
  const f = input.files && input.files[0];
  const msg = document.getElementById("load-msg");
  const show = (key, params) => { if(msg){ msg.textContent = t(key, params); msg.hidden = false;
                                            msg.classList.toggle("logo-err", key === "ui.loadBad"); } };
  if(!f) return;
  const fr = new FileReader();
  fr.onerror = () => { show("ui.loadBad", {why: "file could not be read"}); input.value = ""; };
  fr.onload = () => {
    let st;
    try { st = JSON.parse(String(fr.result)); }
    catch(e){ show("ui.loadBad", {why: "not valid JSON"}); input.value = ""; return; }
    if(!st || !Array.isArray(st.items) || !st.company){
      show("ui.loadBad", {why: "no scenarios or company block"}); input.value = ""; return;
    }
    const problem = stateVersionProblem(st);
    if(problem){ show("ui.loadBad", {why: t(problem)}); input.value = ""; return; }
    const full = applyLoadedState(st);
    show(full ? "ui.loadOk" : "ui.loadOkPartial",
         {n: (st.restore ? st.restore.scenarios.length : st.items.length),
          plan: (st.plan && st.plan.to) || "—"});
    input.value = "";
  };
  fr.readAsText(f);
}

const LINK_V = 1;
const STATE_V = 1;
const LINK_PREFIX = "s" + LINK_V + ".";
const LINK_WARN_LEN = 1800;

const b64urlEnc = bytes => {
  let s = ""; for(const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
};
const b64urlDec = str => {
  const s = atob(str.replace(/-/g,"+").replace(/_/g,"/"));
  const out = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) out[i] = s.charCodeAt(i);
  return out;
};
const hasZip = typeof CompressionStream === "function" && typeof DecompressionStream === "function";
async function zip(str){
  const bytes = new TextEncoder().encode(str);
  if(!hasZip) return {bytes, zipped:false};
  const cs = new CompressionStream("deflate-raw");
  const w = cs.writable.getWriter(); w.write(bytes); w.close();
  const buf = await new Response(cs.readable).arrayBuffer();
  return {bytes: new Uint8Array(buf), zipped:true};
}
async function unzip(bytes){
  if(!hasZip) return new TextDecoder().decode(bytes);
  try{
    const ds = new DecompressionStream("deflate-raw");
    const w = ds.writable.getWriter(); w.write(bytes); w.close();
    const buf = await new Response(ds.readable).arrayBuffer();
    return new TextDecoder().decode(buf);
  }catch(e){
    return new TextDecoder().decode(bytes);
  }
}

function linkPayload({withPartner}){
  const r = JSON.parse(JSON.stringify(reportState().restore));
  delete r.partner.logo;
  delete r.partner.logoInk;
  if(!withPartner){
    delete r.partner;
    r.scenarios.forEach(sc=> delete sc.service);
  }
  return {restore: r};
}
async function buildLink({withPartner}){
  const json = JSON.stringify(linkPayload({withPartner}));
  const {bytes} = await zip(json);
  const base = location.href.split("#")[0];
  return base + "#" + LINK_PREFIX + b64urlEnc(bytes);
}

function stateVersionProblem(st){
  const r = st && st.restore;
  if(!r) return null;
  if(typeof r.version !== "number") return "ui.stateNoVersion";
  if(r.version > STATE_V) return "ui.stateNewer";
  if(r.version < STATE_V) return "ui.stateOlder";
  return null;
}

function fillPlanSelects(){
  const grouped = (list, label, selected) => {
    const small = list.filter(v => !(seatsOf(v.plan) > SELECT_GROUP_SEATS));
    const big   = list.filter(v =>   seatsOf(v.plan) > SELECT_GROUP_SEATS);
    const opt = v => `<option value="${v.plan}"${v.plan===selected?" selected":""}>${label(v)}</option>`;
    return `<optgroup label="${t("ui.grpMatched")}">${small.map(opt).join("")}</optgroup>`
         + `<optgroup label="${t("ui.grpEnterprise")}">${big.map(opt).join("")}</optgroup>`;
  };

  const cur = document.getElementById("ess-sel");
  if(cur){
    const list = essentialsList();
    cur.innerHTML =
      grouped(list, r => r.seats ? `${r.plan} — ${t("ui.seatsUpTo", {n: fmtInt(r.seats)})}` : r.plan, essPlan)
      + `<option value="${NO_B24}"${essPlan===NO_B24?" selected":""}>${t("ui.planNone")}</option>`;
  }
  const q = document.getElementById("q-plan");
  if(q){
    const list = essentialsList();
    q.innerHTML =
      grouped(list, r => r.seats ? `${r.plan} — ${t("ui.seatsUpTo", {n: fmtInt(r.seats)})}` : r.plan, essPlan)
      + `<option value="${NO_B24}"${essPlan===NO_B24?" selected":""}>${t("ui.planNone")}</option>`;
  }
  const tgt = document.getElementById("tgt-sel");
  if(tgt){
    resolveTarget();
    tgt.innerHTML = grouped(PRICING.vibePlus[CUR] || [],
                            v => `${v.plan} — ${fmtMoney(v.annual)}`, tgtPlanName);
  }
  const hint = document.getElementById("tgt-hint");
  if(hint){
    hint.innerHTML = tgtAuto
      ? t("ui.tgtAuto")
      : `${t("ui.tgtManual")} <button type="button" class="svc-jump" id="tgt-reset">${t("ui.tgtReset")}</button>`;
  }
}

const LOGO_MAX_PX     = 600;
const LOGO_STORE_MAX  = 200 * 1024;
const LOGO_INPUT_MAX  = 12 * 1024 * 1024;
const b64Bytes = uri => Math.round((uri.length - (uri.indexOf(",") + 1)) * 3 / 4);
const kbText = b => b < 10240 ? (b / 1024).toFixed(1) : String(Math.round(b / 1024));

function shrinkImage(img){
  const long = Math.max(img.naturalWidth, img.naturalHeight);
  const k = long > LOGO_MAX_PX ? LOGO_MAX_PX / long : 1;
  const w = Math.max(1, Math.round(img.naturalWidth  * k));
  const h = Math.max(1, Math.round(img.naturalHeight * k));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const cx = c.getContext("2d");
  cx.imageSmoothingQuality = "high";
  cx.drawImage(img, 0, 0, w, h);
  let smallest = null;
  for (const [type, q] of [["image/png", undefined], ["image/webp", 0.92],
                           ["image/webp", 0.85], ["image/webp", 0.75]]) {
    let uri;
    try { uri = c.toDataURL(type, q); } catch(e){ continue; }
    if (uri.indexOf("data:" + type) !== 0) continue;
    const bytes = b64Bytes(uri);
    if (!smallest || bytes < smallest.bytes) smallest = {uri, bytes, w};
    if (bytes <= LOGO_STORE_MAX) return {uri, bytes, w, fits: true};
  }
  return smallest ? {...smallest, fits: false} : null;
}

function storeLogo(uri, info){
  partner.logo = uri;
  const url = document.getElementById("pt-logo");
  if(url) url.value = "";
  const kept = savePartner();
  applyPartnerLogo();
  const p = {px: info.px, kb: kbText(info.bytes)};
  if(kept && info.px == null && !info.resized){
    logoSay("pt.logoReadySvg", {kb: p.kb});
    return;
  }
  if(!kept)              logoSay("pt.logoStoreFull", null, true);
  else if(info.forStorage) logoSay("pt.logoShrunk", p);
  else if(info.resized)    logoSay("pt.logoScaled", p);
  else                     logoSay("pt.logoReady",  p);
}

function handleLogoFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const ext = (f.name.split(".").pop() || "file").toLowerCase();
  const done = () => { input.value = ""; };

  const isSvg = f.type === "image/svg+xml" || ext === "svg";
  if(!/^image\//.test(f.type) && !isSvg){
    logoSay("pt.logoNotImage", {type: f.type || ext}, true);
    return done();
  }
  if(f.size > LOGO_INPUT_MAX){
    logoSay("pt.logoHuge", {mb: (f.size/1048576).toFixed(1),
                            maxmb: Math.round(LOGO_INPUT_MAX/1048576)}, true);
    return done();
  }

  const fr = new FileReader();
  fr.onerror = () => { logoSay("pt.logoBroken", {ext}, true); done(); };
  fr.onload = () => {
    const uri = String(fr.result);
    if(isSvg){
      const bytes = b64Bytes(uri);
      if(bytes > LOGO_STORE_MAX){
        logoSay("pt.logoSvgTooBig", {kb: kbText(bytes),
                                     max: Math.round(LOGO_STORE_MAX/1024)}, true);
        return done();
      }
      storeLogo(uri, {px: null, bytes, resized: false, forStorage: false});
      return done();
    }
    const img = new Image();
    img.onerror = () => { logoSay("pt.logoBroken", {ext}, true); done(); };
    img.onload = () => {
      const asIs = b64Bytes(uri);
      if(img.naturalWidth <= LOGO_MAX_PX && img.naturalHeight <= LOGO_MAX_PX
         && asIs <= LOGO_STORE_MAX){
        storeLogo(uri, {px: img.naturalWidth, bytes: asIs,
                        resized: false, forStorage: false});
        return done();
      }
      const small = shrinkImage(img);
      if(!small){ logoSay("pt.logoBroken", {ext}, true); return done(); }
      if(!small.fits){
        logoSay("pt.logoStillTooBig", {px: small.w, kb: kbText(small.bytes),
                                       max: Math.round(LOGO_STORE_MAX/1024)}, true);
        return done();
      }
      storeLogo(small.uri, {px: small.w, bytes: small.bytes, resized: true,
                            forStorage: asIs > LOGO_STORE_MAX});
      done();
    };
    img.src = uri;
  };
  fr.readAsDataURL(f);
}

const LOGO_LIGHT_L = 0.55;
let logoInkFor = null;

function measureLogoInk(src, done){
  if(!src){ done(null); return; }
  const img = new Image();
  img.onerror = () => done(null);
  img.onload = () => {
    try{
      const BOX = 64;
      const k = Math.min(BOX / img.naturalWidth, BOX / img.naturalHeight) || 1;
      const w = Math.max(1, Math.round(img.naturalWidth  * Math.min(k, 1)));
      const h = Math.max(1, Math.round(img.naturalHeight * Math.min(k, 1)));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const cx = c.getContext("2d", {willReadFrequently:true});
      cx.drawImage(img, 0, 0, w, h);
      const d = cx.getImageData(0, 0, w, h).data;
      const lin = v => { v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
      let lum = 0, alpha = 0;
      for(let i = 0; i < d.length; i += 4){
        const a = d[i+3] / 255;
        if(a < 0.1) continue;
        lum += a * (0.2126*lin(d[i]) + 0.7152*lin(d[i+1]) + 0.0722*lin(d[i+2]));
        alpha += a;
      }
      if(alpha < 1){ done(null); return; }
      done(lum / alpha > LOGO_LIGHT_L ? "light" : "dark");
    }catch(e){ done(null); }
  };
  img.crossOrigin = "anonymous";
  img.src = src;
}

const BRIEF_UNIT = {
  ppl:"brief.u.ppl", clients:"brief.u.clients", money:"brief.u.money",
  share:"brief.u.share", min:"brief.u.min", calls:"brief.u.calls",
  enq:"brief.u.enq", bookings:"brief.u.bookings", docs:"brief.u.docs",
  meetings:"brief.u.meetings",
};
const briefAsk = f => { const o = orgOf(f); return !!(o && o.ask); };

function briefItems(){
  const out = [];
  if(!scenarios.some(sc=>state[sc.id].selected)) return out;
  COMPANY.forEach(c=>{
    if(!briefAsk(c)) return;
    if(c.k !== "empCount"
       && !(AUTOFILL[c.k] || []).some(([id]) => state[id] && state[id].selected)) return;
    out.push({addr:"co-" + c.k, comp:c.k, suf:"ppl"});
  });
  scenarios.forEach(sc=>{
    if(!state[sc.id].selected) return;
    if(!sc.effect.includes("fot") && !SHOW_REVENUE) return;
    sc.fields.forEach(f=>{
      if(!briefAsk(f)) return;
      if(f.revOnly && !SHOW_REVENUE) return;
      out.push({addr:sc.id + "-" + f.k, sc:sc.id, fk:f.k, suf:f.suf});
    });
  });
  return out;
}
const briefQ    = it => t("brief.q." + it.addr);
const briefLbl  = it => it.comp ? t("co." + it.comp) : t("sc." + it.sc + ".f." + it.fk);
const briefUnit = it => t(BRIEF_UNIT[it.suf], {cur: sufText("money")});
const briefSel = it => "#card-" + it.sc + ' .num-in[data-k="' + it.fk + '"]:not([data-seg])';
const briefInput = it => it.comp
  ? document.getElementById("co-" + it.comp)
  : document.querySelector(briefSel(it));

const BRIEF_COLS = 78;
function briefWrap(text, indent){
  const words = text.split(/\s+/).filter(Boolean);
  const out = [];
  let line = "";
  for(const w of words){
    const cand = line ? line + " " + w : w;
    if(line && (out.length ? indent.length : 0) + cand.length > BRIEF_COLS){
      out.push(line); line = w;
    } else line = cand;
  }
  if(line) out.push(line);
  return out.map((l,i)=> (i ? indent : "") + l).join("\n");
}
function briefFingerprint(items){
  let hash = 0x811c9dc5;
  const src = items.map(it => it.addr).join(",");
  for(let i = 0; i < src.length; i++){
    hash ^= src.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193) >>> 0;
  }
  return hash.toString(36).toUpperCase().padStart(5, "0").slice(-5);
}
const BRIEF_REF_RE = /AVC-([A-Z0-9]{5})/i;

function briefOmitted(){
  const out = [];
  scenarios.forEach(sc=>{
    if(!state[sc.id].selected) return;
    if(sc.effect.includes("fot") || SHOW_REVENUE) return;
    sc.fields.forEach(f=>{
      if(!briefAsk(f)) return;
      if(f.revOnly && !SHOW_REVENUE) return;
      out.push(t(`sc.${sc.id}.f.${f.k}`));
    });
  });
  return out;
}

function briefText(items){
  const qs = items.map((it,i)=>{
    const head = (i+1) + ". " + briefQ(it) + " (" + briefUnit(it) + ")";
    const ind = " ".repeat(String(i+1).length + 2);
    return briefWrap(head, ind) + "\n" + ind + t("brief.answerTag");
  });
  return [t("brief.hello"), "",
          briefWrap(t("brief.intro", {n: items.length}), ""), "",
          qs.join("\n\n"), "",
          briefWrap(t("brief.outro"), ""), "",
          t("brief.ref", {code: briefFingerprint(items)})].join("\n");
}

function briefMax(){
  let n = 0;
  COMPANY.forEach(c=>{ if(briefAsk(c)) n++; });
  scenarios.forEach(sc=>sc.fields.forEach(f=>{ if(briefAsk(f)) n++; }));
  return n;
}
function briefParse(text, items){
  const tag = t("brief.answerTag").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const tagRe = new RegExp(tag + "(.*)$", "i");
  const ceiling = briefMax();
  const got = {}, rawAns = {}, unknown = [], numberless = [], mentions = new Set();
  const want = briefFingerprint(items);
  const found = String(text).match(BRIEF_REF_RE);
  const ref = found ? found[1].toUpperCase() : null;
  let cur = null;
  String(text).split(/\r?\n/).forEach(raw=>{
    const line = raw.replace(/^[\s>|]+/, "");
    let rest = null;
    const head = line.match(/^(\d+)\s*[.)\]:\-–—]\s*(.*)$/);
    if(head){
      const n = +head[1];
      if(n < 1 || n > ceiling){ cur = null; return; }
      if(n > items.length){ unknown.push(n); cur = null; return; }
      cur = n; rest = head[2];
    } else {
      const m = line.match(tagRe);
      if(m && cur != null) rest = m[1];
    }
    if(rest == null){
      const men = line.match(/\b(?:question|questions|q\.?|вопрос\w*)\s*#?\s*(\d{1,2})\b|#\s*(\d{1,2})\b/i);
      if(men){
        const n = +(men[1] || men[2]);
        if(n >= 1 && n <= items.length) mentions.add(n);
      }
      return;
    }
    const nums = rest.match(/\d[\d\s.,]*/g) || [];
    if(!nums.length){ numberless.push(rest.trim().slice(0, 26)); return; }
    (got[cur] = got[cur] || []).push(...nums.map(parseNum));
    (rawAns[cur] = rawAns[cur] || []).push(rest.trim());
  });
  const rows = items.map((it,i)=>{
    const seen = [...new Set((got[i+1] || []).map(x=>Math.round(x*1e6)/1e6))];
    return {it, n:i+1, seen, raw: (rawAns[i+1] || []).join(" "),
            value: seen.length === 1 ? seen[0] : null,
            status: seen.length === 0 ? "none" : seen.length === 1 ? "ok" : "many"};
  });
  const ours = CUR === "EUR" ? "EUR" : "USD";
  const other = ours === "USD" ? /(?:€|\bEUR\b|\bPLN\b|zł|\bGBP\b|£|\bCHF\b|\bCZK\b)/i
                               : /(?:\$|\bUSD\b|\bPLN\b|zł|\bGBP\b|£|\bCHF\b|\bCZK\b)/i;
  const currency = rows.filter(r => r.it.suf === "money" && r.status === "ok" && other.test(r.raw))
                       .map(r => ({n: r.n, token: (r.raw.match(other) || [""])[0] }));
  return {rows, unknown, mentions: [...mentions].sort((a,b)=>a-b), numberless, currency,
          ref, refWant: want};
}

const briefShow = r => r.it.suf === "money" ? fmtMoney(r.value)
                     : r.it.suf === "share" ? groupFmt(String(r.value)) + "%"
                     : groupFmt(String(r.value)) + (t(SUF[r.it.suf]) ? " " + t(SUF[r.it.suf]) : "");

let briefRead = null;

function briefRender(){
  const rev = document.getElementById("br-rev");
  const msg = document.getElementById("br-msg");
  const fill = document.getElementById("br-fill");
  const notes = document.getElementById("br-notes");
  const notesBody = document.getElementById("br-notes-body");
  const res = briefRead;
  rev.hidden = true; rev.innerHTML = ""; fill.hidden = true;
  notes.hidden = true; notesBody.textContent = "";
  msg.hidden = false;
  if(!res){ msg.hidden = true; return; }
  if(res.ref && res.ref !== res.refWant){
    msg.textContent = t("ui.brRefMismatch", {got: "AVC-" + res.ref, want: "AVC-" + res.refWant});
    return;
  }
  if(res.unknown.length){
    msg.textContent = t("ui.brStale", {n: fmtInt(Math.max(...res.unknown)),
                                       have: fmtInt(res.rows.length)});
    return;
  }
  const ok = res.rows.filter(r=>r.status === "ok").length;
  if(!ok){
    msg.textContent = res.numberless.length
      ? t("ui.brNoDigits", {sample: "“" + res.numberless.slice(0,2).join("”, “") + "”"})
      : t("ui.brNothing");
    return;
  }
  msg.textContent = res.rows.length === 1 && ok === 1
    ? t("ui.brRead11")
    : t("ui.brRead1", {ok: fmtInt(ok), n: fmtInt(res.rows.length)});
  const warn = [];
  if(!res.ref) warn.push(t("ui.brRefMissing"));
  if(res.mentions.length)
    warn.push(t("ui.brCorrection", {list: res.mentions.join(", ")}));
  if(res.currency.length)
    warn.push(t("ui.brCurrency", {list: res.currency.map(c=>c.n).join(", "),
                                  theirs: res.currency[0].token.toUpperCase(),
                                  ours: CUR}));
  if(warn.length){
    notesBody.textContent = warn.join(" ");
    notes.hidden = false;
  }
  const cell = (cls, text) => {
    const s = document.createElement("span");
    s.className = cls; s.textContent = text; return s;
  };
  res.rows.forEach(r=>{
    rev.append(cell("n", r.n + "."), cell("q", briefLbl(r.it)),
      r.status === "ok"   ? cell("v", briefShow(r))
    : r.status === "many" ? cell("v v--many", t("ui.brMany"))
    :                       cell("v v--none", t("ui.brNone")));
  });
  rev.hidden = false;
  fill.hidden = false;
}

function briefFill(){
  if(!briefRead || briefRead.unknown.length) return 0;
  if(briefRead.ref && briefRead.ref !== briefRead.refWant) return 0;
  let n = 0;
  briefRead.rows.filter(r=>r.status === "ok").forEach(r=>{
    const inp = briefInput(r.it);
    if(!inp) return;
    inp.value = groupFmt(String(r.value));
    inp.dispatchEvent(new Event("input", {bubbles:true}));
    n++;
  });
  return n;
}

async function restoreFromHash(){
  const h = String(location.hash || "").replace(/^#/, "");
  if(!h) return;
  const msg = document.getElementById("load-msg");
  const show = (key, params, bad) => { if(msg){ msg.textContent = t(key, params); msg.hidden = false;
                                                msg.classList.toggle("logo-err", !!bad); } };
  const m = /^s(\d+)\.(.*)$/.exec(h);
  if(!m) return;
  if(!m[2]){ show("ui.linkBad", {why: "the link carries no data — it was cut"}, true); return; }
  if(+m[1] !== LINK_V){
    show("ui.linkBad", {why: `link format v${m[1]}, this calculator reads v${LINK_V}`}, true); return;
  }
  let st;
  try { st = JSON.parse(await unzip(b64urlDec(m[2]))); }
  catch(e){ show("ui.linkBad", {why: "the packed data is damaged or truncated"}, true); return; }
  const problem = stateVersionProblem(st);
  if(problem){ show("ui.linkBad", {why: t(problem)}, true); return; }
  const full = applyLoadedState(st);
  const n = st.restore ? st.restore.scenarios.length : 0;
  show(full ? "ui.linkRestored" : "ui.linkRestoredPartial",
       {n: fmtInt(n), plan: (st.restore && st.restore.plan && st.restore.plan.tgtPlanName) || "—"});
}
