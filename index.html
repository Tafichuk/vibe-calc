<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Value Calculator — Bitrix24 Vibe+</title>
<link rel="stylesheet" href="css/brand-ext.css">
<style>
/* =============================================================================
   1. DESIGN TOKENS — copied VERBATIM from the partner kit
   assets/bitrix24-kit.css :root block (github.com/rabenok2105/bitrix24-partner-style)
   The kit itself is print-first (.page = A4 210x297mm, @page rules), so it is NOT
   linked wholesale — that would force page geometry onto a web app. Only the token
   block travels. Kit is never edited; update by re-copying this block after a pull.
   Form components and state colors live in css/brand-ext.css (linked above).
   ========================================================================== */
@font-face{ font-family:'Montserrat'; font-weight:100 900; font-style:normal;
  src:url("assets/fonts/Montserrat-VariableFont_wght.ttf") format('truetype-variations');
  font-display:swap; }

:root{
  /* official corporate palette */
  --b24-cyan:#2FC7F7; --b24-blue:#409EEF; --b24-deep:#0066A1; --b24-green:#BDF300;
  --b24-grad-brand:linear-gradient(135deg,#2FC7F7 0%,#409EEF 100%);
  --b24-deep-2:#004E7C;
  /* partner program palette */
  --b24p-deep:#063883; --b24p-light:#EFFBFF; --b24p-green:#BDF300;
  --b24p-deep-2:#04213F; --b24p-deep-hi:#0A63A6;
  /* signature partner gradient — radial glow, never a flat navy */
  --b24-grad-partner-navy:radial-gradient(130% 130% at 45% 30%,#0A63A6 0%,#005E98 28%,#00457C 54%,#063159 78%,#04213F 100%);
  --b24-grad-partner-light:linear-gradient(160deg,#F6FDFF 0%,#EFFBFF 55%,#DBF2FC 100%);
  --b24-lime:var(--b24-green); --b24-lime-ink:var(--b24-deep);
  /* surfaces */
  --b24-page-cool:#F4FAFE; --b24-page-sky:#DCF2FE; --b24-card:#E9F5FD;
  --b24-card-2:#DDEEFB; --b24-white:#FFFFFF; --b24-line:#C8E6F6; --b24-dashed:#6EC0EC;
  /* text */
  --b24-text:#143A57; --b24-text-mute:#5E86A3; --b24-on-navy:#FFFFFF; --b24-on-navy-soft:#B9E2F7;
  /* radii */
  --b24-r-card:22px; --b24-r-inner:16px; --b24-r-tile:14px; --b24-r-pill:999px;
  /* spacing */
  --b24-s1:4px; --b24-s2:8px; --b24-s3:12px; --b24-s4:16px; --b24-s5:20px;
  --b24-s6:24px; --b24-s8:32px; --b24-s10:40px; --b24-s12:48px; --b24-s16:64px;
  /* shadows */
  --b24-shadow-card:0 10px 30px rgba(0,102,161,.12);
  --b24-shadow-navy:0 14px 34px rgba(0,78,124,.30);
  /* type */
  --b24-font-display:'Montserrat',system-ui,'Segoe UI',Arial,sans-serif;
  --b24-font-body:'Montserrat',system-ui,'Segoe UI',Arial,sans-serif;
}

/* =============================================================================
   2. WEB LAYOUT — ours. The kit has no web/form layer (brand-spec.md §6).
   ========================================================================== */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:var(--b24-font-body); color:var(--b24-text);
  background:var(--b24-page-cool); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 var(--b24-s5)}

/* focus ring — visible for keyboard users everywhere (brand-spec §6.2) */
:focus-visible{outline:3px solid var(--b24-cyan); outline-offset:2px; border-radius:6px}

/* ---- header ---- */
.hdr{position:sticky; top:0; z-index:40; background:rgba(255,255,255,.92);
  backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--b24-line)}
.hdr-in{display:flex; align-items:center; gap:var(--b24-s5); padding:var(--b24-s3) 0}
.hdr-logo img{height:34px; width:auto; display:block}
.hdr-sp{flex:1}
.switch{display:inline-flex; background:var(--b24-card); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-pill); padding:3px}
.switch button{
  appearance:none; border:0; background:transparent; cursor:pointer;
  font:600 13px/1 var(--b24-font-body); color:var(--b24-text-mute);
  padding:8px 14px; border-radius:var(--b24-r-pill);
}
.switch button[aria-pressed="true"]{background:var(--b24-white); color:var(--b24p-deep);
  box-shadow:0 1px 3px rgba(0,102,161,.18)}
.sw-lab{font:600 12px/1 var(--b24-font-body); color:var(--b24-text-mute);
  text-transform:uppercase; letter-spacing:.06em; margin-right:var(--b24-s2)}

/* ---- hero: navy sheet, signature radial gradient only ---- */
.hero{background:var(--b24-grad-partner-navy); color:var(--b24-on-navy);
  padding:var(--b24-s16) 0 var(--b24-s12)}
.hero h1{font:800 clamp(28px,4vw,44px)/1.15 var(--b24-font-display); margin:0 0 var(--b24-s4);
  letter-spacing:-.01em; max-width:20ch}
.hero p{margin:0; color:var(--b24-on-navy-soft); font-size:17px; max-width:62ch}
.hero-pills{display:flex; flex-wrap:wrap; gap:var(--b24-s2); margin-top:var(--b24-s6)}
.pill{display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.24); color:var(--b24-on-navy);
  border-radius:var(--b24-r-pill); padding:7px 14px; font-size:13.5px; font-weight:500}
.pill img{width:16px; height:16px}

/* ---- sections ---- */
section{padding:var(--b24-s12) 0}
.sec-h{font:700 13px/1 var(--b24-font-body); text-transform:uppercase; letter-spacing:.1em;
  color:var(--b24-deep); margin:0 0 var(--b24-s3)}
/* The original singles out the VibeCode group with an orange sheet (#d47320) — a
   colour that is not in the Bitrix24 partner palette. Same emphasis, on-brand:
   the kit's green as a PLATE with deep-blue ink (green is never used as text). */
.sec-h--accent{display:inline-block; background:var(--b24-green);
  color:var(--b24-lime-ink); border-radius:var(--b24-r-pill); padding:6px 14px}
h2{font:700 clamp(20px,2.4vw,28px)/1.2 var(--b24-font-display); margin:0 0 var(--b24-s6);
  color:var(--b24p-deep)}
.note-line{font-size:13.5px; color:var(--b24-text); margin:0 0 var(--b24-s6); max-width:80ch}

/* ---- cards ---- */
.card{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); box-shadow:var(--b24-shadow-card); padding:var(--b24-s6)}
.grid-co{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:var(--b24-s4)}

/* ---- form field ---- */
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:13px; font-weight:600; color:var(--b24-text)}
.field .hint{font-size:12px; color:var(--b24-text)}
.in-wrap{position:relative; display:flex; align-items:center}
.in-wrap input{width:100%}
.in-wrap .suf{position:absolute; right:14px; font-size:12.5px; color:var(--b24-text-mute);
  pointer-events:none; font-weight:600}
.in-wrap input{padding-right:64px}
.field .err{display:none; font-size:12px; color:var(--b24x-error-ink); font-weight:600}
.field.invalid .err{display:block}
.est{display:inline-block; background:var(--b24-card); color:var(--b24-deep);
  border-radius:var(--b24-r-pill); padding:2px 8px; font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:.05em; margin-left:6px; vertical-align:1px}

.rev-toggle{display:flex; align-items:center; gap:10px; cursor:pointer;
  font-size:13px; font-weight:600; color:var(--b24-text)}
.rev-toggle input{width:20px; height:20px; accent-color:var(--b24-deep); cursor:pointer}
.btn-primary{appearance:none; border:0; cursor:pointer; background:var(--b24p-deep);
  color:var(--b24-white); border-radius:var(--b24-r-pill); padding:13px 26px;
  font:700 14px var(--b24-font-body)}
.btn-primary:hover{background:var(--b24p-deep-hi)}
.svc-in{width:130px; text-align:right}
.svc-in::placeholder{font-size:12px; font-weight:500}
.cov-row{display:flex; gap:var(--b24-s5); align-items:flex-start; flex-wrap:wrap;
  background:var(--b24-page-cool); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-inner); padding:var(--b24-s4); margin-top:var(--b24-s4)}
.cov-hint{margin:0; font-size:12.5px; color:var(--b24-text); flex:1; min-width:240px}
.cov-hint--none{background:var(--b24-page-cool); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-inner); padding:var(--b24-s3) var(--b24-s4);
  margin-top:var(--b24-s4)}
.cov-in{width:90px; text-align:right}
/* credibility guard — amber, never red: red is reserved for input validation */
.overlap-warn{grid-column:1/-1; display:flex; gap:var(--b24-s3); align-items:flex-start;
  background:var(--b24x-warning-surface); color:var(--b24x-warning-ink);
  border:1px solid currentColor; border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-top:var(--b24-s4); font-size:13.5px}
.overlap-warn img{width:20px; height:20px; flex:0 0 auto; margin-top:1px}
.hdr .switch[hidden], .hdr .sw-lab[hidden]{display:none}

/* ---- scenario card ---- */
.sc{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); box-shadow:var(--b24-shadow-card);
  margin-bottom:var(--b24-s5); overflow:hidden}
.sc-top{display:flex; gap:var(--b24-s4); padding:var(--b24-s5) var(--b24-s6);
  align-items:flex-start; cursor:pointer}
.sc-top:hover{background:var(--b24-page-cool)}

/* SELECTED state. The original rings the card in its group colour; those four colours
   are not in the partner palette, so the same signal is built from kit tokens only:
   a 2px cyan ring (same 2px the original uses), a tinted head, and the number badge
   flipping to the green plate. Green is a background here, never ink. */
.sc.on{box-shadow:0 0 0 2px var(--b24-cyan), var(--b24-shadow-card)}
.sc.on .sc-top{background:var(--b24-card)}
.sc.on .sc-top:hover{background:var(--b24-card-2)}
.sc-num{flex:0 0 auto; min-width:26px; height:26px; padding:0 7px; border-radius:var(--b24-r-pill);
  background:var(--b24-card); color:var(--b24-deep); font:800 13px/26px var(--b24-font-display);
  text-align:center; margin-top:1px}
.sc.on .sc-num{background:var(--b24-green); color:var(--b24-lime-ink)}
.sc-cb{flex:0 0 auto; margin-top:3px; width:22px; height:22px; accent-color:var(--b24-deep)}
.sc-ttl{flex:1}
.sc-ttl h3{margin:0 0 4px; font:700 17px/1.3 var(--b24-font-display); color:var(--b24p-deep)}
.sc-ttl p{margin:0; font-size:13.5px; color:var(--b24-text)}
.sc-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--b24-s3)}
.tag{background:var(--b24-card); color:var(--b24-deep); border-radius:var(--b24-r-pill);
  padding:3px 10px; font-size:11.5px; font-weight:700}
.tag--lime{background:var(--b24-green); color:var(--b24-lime-ink)}
.sc-body{display:none; padding:0 var(--b24-s6) var(--b24-s6); border-top:1px solid var(--b24-line)}
.sc.on .sc-body{display:block}
.sc-note{background:var(--b24-card); border-radius:var(--b24-r-inner);
  padding:var(--b24-s3) var(--b24-s4); font-size:12.5px; margin:var(--b24-s4) 0 0}
.sc-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:var(--b24-s4); margin-top:var(--b24-s5)}
.seg{border:1px dashed var(--b24-dashed); border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-top:var(--b24-s4)}
.seg-h{font-size:12px; font-weight:700; color:var(--b24-deep); text-transform:uppercase;
  letter-spacing:.06em; margin-bottom:var(--b24-s3)}
.btn-add{appearance:none; background:transparent; border:1px dashed var(--b24-dashed);
  color:var(--b24-deep); border-radius:var(--b24-r-pill); padding:8px 16px;
  font:600 13px var(--b24-font-body); cursor:pointer; margin-top:var(--b24-s4)}
.btn-add:hover{background:var(--b24-card)}

/* ---- scenario result ---- */
.res{margin-top:var(--b24-s5); border-top:1px solid var(--b24-line); padding-top:var(--b24-s4)}
.res-row{display:flex; justify-content:space-between; gap:var(--b24-s4);
  padding:7px 0; font-size:13.5px; border-bottom:1px solid var(--b24-page-cool)}
.res-row:last-child{border-bottom:0}
.res-row .lbl{color:var(--b24-text)}
.res-row .val{font-weight:700; color:var(--b24p-deep); white-space:nowrap}
.res-row .val.rev{color:var(--b24-deep)}
.bd{background:var(--b24-page-cool); border-radius:var(--b24-r-inner);
  padding:var(--b24-s3) var(--b24-s4); font-size:12.5px; margin-bottom:var(--b24-s3)}
.bd div{display:flex; justify-content:space-between; gap:var(--b24-s4); padding:2px 0}
.int-in{width:120px; text-align:right}
.info-btn{appearance:none; background:transparent; border:0; cursor:pointer; padding:2px;
  color:var(--b24-deep); width:22px; height:22px; vertical-align:-5px}
.info-btn svg{width:16px; height:16px}

/* ---- summary ---- */
.sum{background:var(--b24-grad-partner-navy); color:var(--b24-on-navy);
  border-radius:var(--b24-r-card); padding:var(--b24-s8); box-shadow:var(--b24-shadow-navy)}
.sum h2{color:var(--b24-on-navy); margin-bottom:var(--b24-s5)}
.sum-grid{display:grid; grid-template-columns:1fr auto auto; gap:10px var(--b24-s6); align-items:center}
.sum-grid .h{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--b24-on-navy-soft); text-align:right}
.sum-grid .h:first-child{text-align:left}
.sum-grid .lbl{font-size:14px}
.sum-grid .num{text-align:right; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums}
.sum-line{grid-column:1/-1; height:1px; background:rgba(255,255,255,.22); margin:var(--b24-s3) 0}
.fullrow{grid-column:1/-1; display:flex; justify-content:space-between; gap:var(--b24-s4);
  font-size:14px; align-items:baseline}
.fullrow .v{font-weight:700; white-space:nowrap}
.fullrow.net{font-size:17px; font-weight:800}
.verdict{grid-column:1/-1; display:flex; gap:var(--b24-s3); align-items:flex-start;
  background:var(--b24-green); color:var(--b24-lime-ink); border-radius:var(--b24-r-inner);
  padding:var(--b24-s4); margin-top:var(--b24-s4); font-size:14px; font-weight:600}
.verdict img{width:20px; height:20px; flex:0 0 auto; margin-top:1px}
/* negative case: never a red number — neutral surface, wording carries it */
.verdict.neg{background:rgba(255,255,255,.14); color:var(--b24-on-navy);
  border:1px solid rgba(255,255,255,.28)}
.sum .empty{color:var(--b24-on-navy-soft); font-size:14px}
.qual{grid-column:1/-1; font-size:13px; color:var(--b24-on-navy-soft); margin-top:var(--b24-s3)}

/* ---- vibe+ transition ---- */
.tr-grid{display:grid; grid-template-columns:1fr auto 1fr; gap:var(--b24-s5); align-items:stretch}
.tr-col{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); padding:var(--b24-s5)}
.tr-col.to{background:var(--b24-grad-partner-light); border-color:var(--b24-dashed)}
.tr-k{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--b24-text-mute); margin-bottom:6px}
.tr-name{font:700 18px/1.25 var(--b24-font-display); color:var(--b24p-deep); margin-bottom:var(--b24-s3)}
.tr-price{font:800 26px/1 var(--b24-font-display); color:var(--b24p-deep);
  font-variant-numeric:tabular-nums}
.tr-per{font-size:12.5px; color:var(--b24-text-mute); margin-top:4px}
.tr-arrow{display:flex; align-items:center; justify-content:center; color:var(--b24-deep)}
.tr-arrow svg{width:30px; height:30px}
.tr-rows{margin-top:var(--b24-s4); border-top:1px solid var(--b24-line); padding-top:var(--b24-s3)}
.tr-rows div{display:flex; justify-content:space-between; gap:var(--b24-s4); font-size:13px; padding:3px 0}
.tr-rows b{color:var(--b24p-deep)}
.partner-only{display:inline-flex; align-items:center; gap:6px; background:var(--b24-green);
  color:var(--b24-lime-ink); border-radius:var(--b24-r-pill); padding:3px 10px;
  font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em}
.gap-card{background:var(--b24-white); border:1px solid var(--b24-line);
  border-radius:var(--b24-r-card); padding:var(--b24-s5); margin-top:var(--b24-s5)}
.gap-rows{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:var(--b24-s4); margin-top:var(--b24-s4)}
.gap-box{background:var(--b24-page-cool); border-radius:var(--b24-r-inner); padding:var(--b24-s4)}
.gap-n{font:800 24px/1 var(--b24-font-display); color:var(--b24p-deep)}
.gap-l{font-size:12.5px; color:var(--b24-text); margin-top:6px}
.ai-list{list-style:none; margin:var(--b24-s4) 0 0; padding:0; display:grid; gap:10px}
.ai-list li{display:flex; gap:10px; align-items:flex-start; font-size:13.5px}
.ai-list img{width:18px; height:18px; flex:0 0 auto; margin-top:2px}

/* ---- warning strip (missing data / stub language) ---- */
.warn{background:var(--b24x-warning-surface); color:var(--b24x-warning-ink);
  border:1px solid currentColor; border-radius:var(--b24-r-inner);
  padding:var(--b24-s3) var(--b24-s4); font-size:13px; font-weight:600;
  display:flex; gap:10px; align-items:flex-start; margin-bottom:var(--b24-s5)}
.warn img{width:18px; height:18px; flex:0 0 auto; margin-top:1px}
.warn[hidden]{display:none}

/* ---- sticky nav bar ---- */
.navbar{position:sticky; bottom:0; z-index:30; background:var(--b24-grad-partner-navy);
  color:var(--b24-on-navy); box-shadow:0 -8px 24px rgba(0,78,124,.24)}
.navbar-in{display:flex; align-items:center; gap:var(--b24-s5); padding:var(--b24-s4) 0;
  flex-wrap:wrap}
.navbar .cnt{font-size:13px; color:var(--b24-on-navy-soft); font-weight:600}
.navbar .tot{font-size:14px; font-weight:700}
/* green is a PLATE, never ink (brand-spec §5.1): #BDF300 background + deep-blue text */
.navbar .tot b{background:var(--b24-green); color:var(--b24-lime-ink);
  border-radius:var(--b24-r-pill); padding:3px 10px; margin-left:2px;
  font-variant-numeric:tabular-nums; display:inline-block}

/* ---- modal ---- */
.ov{position:fixed; inset:0; background:rgba(4,33,63,.55); display:flex;
  align-items:center; justify-content:center; padding:var(--b24-s5); z-index:60}
.ov[hidden]{display:none}
.mdl{background:var(--b24-white); border-radius:var(--b24-r-card); max-width:560px;
  width:100%; padding:var(--b24-s8); position:relative; max-height:85vh; overflow:auto}
.mdl h3{margin:0 0 var(--b24-s3); font:700 20px var(--b24-font-display); color:var(--b24p-deep)}
.mdl p{margin:0; font-size:14px}
.mdl-x{position:absolute; top:12px; right:12px; appearance:none; background:var(--b24-card);
  border:0; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:20px;
  color:var(--b24-deep); line-height:1}

.foot{padding:var(--b24-s8) 0; font-size:12.5px; color:var(--b24-text)}
.foot img{height:26px; margin-bottom:var(--b24-s3); display:block}

@media (max-width:820px){
  .tr-grid{grid-template-columns:1fr}
  .tr-arrow{transform:rotate(90deg)}
  .sum-grid{grid-template-columns:1fr auto}
  .sum-grid .h.year,.sum-grid .num.year{display:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="hdr-logo" href="#top"><img src="assets/logo-partner-h.png" alt="Bitrix24 Partners"></a>
    <div class="hdr-sp"></div>
    <span class="sw-lab" data-i18n="ui.lang"></span>
    <div class="switch" id="sw-lang" role="group">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
    </div>
    <span class="sw-lab" data-i18n="ui.cur"></span>
    <div class="switch" id="sw-cur" role="group">
      <button type="button" data-cur="EUR" aria-pressed="true">EUR</button>
      <button type="button" data-cur="USD" aria-pressed="false">USD</button>
    </div>
  </div>
</header>

<div class="hero" id="top">
  <div class="wrap">
    <h1 data-i18n="ui.heroTitle"></h1>
    <p data-i18n="ui.heroSub"></p>
    <div class="hero-pills" id="hero-pills"></div>

  // Working days per month — user-editable. The Russian production calendar
  // (22 days / 176 hours) is gone: it is a legal artefact of one country.
  // PUBLIC HOLIDAYS ARE DELIBERATELY NOT MODELLED. In Germany they are set per
  // Bundesland — Bavaria has 13, Berlin 10, and Corpus Christi or Reformation Day
  // apply in some Länder and not others. There is no single national calendar to
  // encode, and inventing an average would make the figure look researched when it
  // is not. The partner sets the number for the client's actual location instead.
  DAYS_MONTH:    21,
  DAY_HOURS:     8,     // length of a working day
  // CONTRACTED hours per month — what the employee is PAID for. Fixed reference,
  // deliberately NOT the editable DAYS_MONTH. These are two different quantities:
  //   CONTRACT_DAYS  = days the salary covers      -> drives the hourly cost
  //   daysMonth      = days the tool is actually used -> drives daily scenarios
  // Tying the hourly cost to the editable field made the two cancel each other out
  // (saved hours rose with days, the hourly rate fell by the same factor), so editing
  // "working days" moved almost nothing. See docs/CALC_MODEL.md.
  CONTRACT_DAYS: 21,
  BURDEN_PCT:    30,    // employer payroll burden, % on top of gross — NEUTRAL DEFAULT,
                        // country-dependent, user-editable. Replaces the RU 1.4 multiplier.
  MEETING_GAIN:  0.15,  // meetings shorter / fewer participants (scenario 6)
  BASE_UPLIFT:   0.10,  // baseline efficiency uplift for all staff (scenario 7)

  // 25% of payroll is ~10 hours per employee per week removed across the entire

  // block — the partner may have a defensible case and must stay in control.
  OVERLAP_WARN_PCT: 25,
};

/* Live, user-editable economics. */
let daysMonth = C.DAYS_MONTH;
let burdenPct = C.BURDEN_PCT;

const dayScale = () => daysMonth / C.CONTRACT_DAYS;

const hoursMonth = () => daysMonth * C.DAY_HOURS;

/* SCOPE (customer decision, phase 4): EN + USD only.
   The I18N structure and the currency switcher stay in the code — they are hidden in
   the UI, not deleted, so re-enabling a language or a currency is a one-line change
   (SHOW_LANG_SWITCH / SHOW_CUR_SWITCH). German stays as-is and is not developed. */
const SHOW_LANG_SWITCH = false;
const SHOW_CUR_SWITCH  = false;
let LANG = "en", CUR = "USD";
const t = (k, p) => {
  let s = (I18N[LANG] && I18N[LANG][k]) != null ? I18N[LANG][k] : I18N.en[k];
  if (s == null) return k;
  if (p) for (const key in p) s = s.split("{" + key + "}").join(p[key]);
  return s;
};
/* constants that appear inside copy — one place, injected as placeholders */
const copyVars = () => ({
  days:     daysMonth,
  contract: contractHours(),
  hours: hoursMonth(),
  dayh:  C.DAY_HOURS,
  gain:  Math.round(C.MEETING_GAIN * 100) + "%",
  base:  Math.round(C.BASE_UPLIFT * 100) + "%",
});

/* =============================================================================
   NUMBER AND MONEY FORMATTING — locale driven, never hardcoded
   ========================================================================== */
const localeOf = () => (LANG === "de" ? "de-DE" : "en-US");
const fmtMoney = n => new Intl.NumberFormat(localeOf(), {
  style:"currency", currency:CUR, maximumFractionDigits:0
}).format(Math.round(n || 0));
const fmtInt = n => new Intl.NumberFormat(localeOf()).format(Math.round(n || 0));
const fmtPct = v => new Intl.NumberFormat(localeOf(), {maximumFractionDigits:1})
  .format(Math.round(v * 1000) / 10) + " %";
/* already-a-percentage formatter (fmtPct takes a 0..1 share) */
const fmtPct1 = v => new Intl.NumberFormat(localeOf(), {maximumFractionDigits:1})
  .format(Math.round(v * 10) / 10) + " %";
let lastOverlap = {ok:true, pct:0, payroll:0};
/* the most recent computeModel() result — the one source every surface reads */
let lastModel = null;

function groupFmt(s){
  s = String(s).replace(/\s/g,"").replace(",",".").replace(/[^\d.]/g,"");
  if(s === "") return "";
  const p = s.split(".");
  let i = p[0].replace(/^0+(?=\d)/,""); if(i === "") i = "0";
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return p.length > 1 ? i + "." + p[1] : i;
}
function parseNum(s){
  s = String(s).replace(/[\s ]/g,"").replace(",",".").replace(/[^\d.]/g,"");
  const n = parseFloat(s);
  return isNaN(n) || n < 0 ? 0 : n;
}
function onNumInput(inp){
  const old = inp.value, sel = inp.selectionStart;
  const before = old.slice(0, sel).replace(/[^\d]/g,"").length;
  const f = groupFmt(old);
  inp.value = f;
  let c = 0, pos = 0;
  if(before > 0){ for(; pos < f.length; pos++){ if(/\d/.test(f[pos])) c++; if(c >= before){ pos++; break; } } }
  try{ inp.setSelectionRange(pos, pos); }catch(e){}
  return parseNum(f);
}

/* =============================================================================
   SCENARIOS — all 11, formulas per INVENTORY.md, display order from the source
   (1, 4, 5, 9, 2, 10, 11, 12, 3, 6, 7 — not id order).
   Salary and fee defaults are NEUTRAL ESTIMATES, flagged in the UI. They are
   not conversions of the RU figures.
   ========================================================================== */
const SUF = {ppl:"suf.ppl", pcs:"suf.pcs", min:"suf.min", share:"suf.share", money:"suf.money"};

const scenarios = [
  { id:1, group:"crm", driver:"daily", cov:{src:"mgrCount", target:"mgr", def:100}, link:"https://helpdesk.bitrix24.com/open/18799442/",
    effect:["fot","rev"],
    fields:[
      {k:"mgr",  def:1,     suf:"ppl"},
      {k:"sal",  def:4000,  suf:"money", est:true},
      {k:"calls",def:20,    suf:"pcs"},
      {k:"time", def:10,    suf:"min"},
      {k:"plan", def:40000, suf:"money", est:true, revOnly:true},
      {k:"coef", def:0.3,   suf:"share", revOnly:true},
    ],
    compute:v=>{
      const savedMinDay = v.calls * v.time;
      const savedHoursMonth = savedMinDay * daysMonth / 60;
      const fot = savedHoursMonth * costHour(v.sal) * v.mgr;
      const freedShare = (savedMinDay / 60) / C.DAY_HOURS;
      const rev = freedShare * v.plan * v.coef * v.mgr;
      return {fot, rev};
    }},

  { id:4, group:"crm", driver:"share", cov:{src:"ropCount", target:"rop", def:100}, link:"https://helpdesk.bitrix24.com/open/23240682/",
    effect:["fot"],
    fields:[
      {k:"rop",  def:1,    suf:"ppl"},
      {k:"sal",  def:6500, suf:"money", est:true},
      {k:"share",def:0.10, suf:"share"},
    ],
    compute:v=>({fot: v.sal * burdenMult() * v.share * v.rop, rev:0})},

  { id:5, group:"crm", driver:"monthly", link:"https://helpdesk.bitrix24.com/open/25376986/",
    effect:["rev"], revLabel:"ui.revBase", segments:true,
    fields:[
      {k:"base", def:1000, suf:"pcs"},
      {k:"check",def:2000, suf:"money", est:true},
      {k:"conv", def:0.10, suf:"share"},
    ],
    compute:v=>({fot:0, rev: v.base * v.conv * v.check})},

  { id:9, group:"agents", driver:"daily", cov:{src:"empCount", target:"mgr", def:20}, link:null, note:true,
    effect:["fot"],
    fields:[

    compute:v=>{

  { id:2, group:"agents", driver:"daily", link:null,

  { id:10, group:"agents", driver:"daily", cov:{src:"empCount", target:"emp", def:30}, link:"https://helpdesk.bitrix24.com/open/27455370/", note:true,
    effect:["fot"],
    fields:[
      {k:"emp",  def:50,   suf:"ppl",   src:"empCount"},
      {k:"sal",  def:4000, suf:"money", src:"empSal", est:true},
      {k:"q",    def:3,    suf:"pcs"},
      {k:"t",    def:10,   suf:"min"},
      {k:"share",def:0.7,  suf:"share"},
    ],
    compute:v=>{
      const h = v.q * v.t * v.share * daysMonth / 60;
      return {fot: h * costHour(v.sal) * v.emp, rev:0};
    }},

  { id:11, group:"agents", driver:"daily", cov:{src:"empCount", target:"emp", def:25}, link:null, note:true,
    effect:["fot"],
    fields:[
      {k:"emp",   def:50,   suf:"ppl",   src:"empCount"},
      {k:"empSal",def:4000, suf:"money", src:"empSal", est:true},
      {k:"empMin",def:20,   suf:"min"},
      {k:"mgr",   def:5,    suf:"ppl"},
      {k:"mgrSal",def:6500, suf:"money", est:true},
      {k:"mgrMin",def:30,   suf:"min"},
    ],
    compute:v=>{
      const A = v.empMin * daysMonth / 60 * costHour(v.empSal) * v.emp;
      const B = v.mgrMin * daysMonth / 60 * costHour(v.mgrSal) * v.mgr;
      return {fot:A+B, rev:0, breakdown:[["bd.11.a",A],["bd.11.b",B]]};
    }},

  { id:12, group:"agents", driver:"monthly", link:null,
    effect:["fot"],
    fields:[
      {k:"visits",def:800,  suf:"pcs"},
      {k:"perRec",def:2,    suf:"pcs"},
      {k:"time",  def:3,    suf:"min"},
      {k:"admSal",def:2600, suf:"money", est:true},
    ],
    compute:v=>{
      const h = v.visits * v.perRec * v.time / 60;
      return {fot: h * costHour(v.admSal), rev:0};
    }},

  { id:3, group:"other", driver:"daily", cov:{src:"empCount", target:"emp", def:12}, link:null,
    effect:["fot"],
    fields:[
      {k:"emp", def:5,    suf:"ppl",   src:"empCount"},
      {k:"sal", def:4000, suf:"money", src:"empSal", est:true},
      {k:"docs",def:5,    suf:"pcs"},
      {k:"time",def:20,   suf:"min"},
    ],
    compute:v=>{
      const h = v.docs * v.time * daysMonth / 60;
      return {fot: h * costHour(v.sal) * v.emp, rev:0};
    }},

  { id:6, group:"other", driver:"monthly", link:"https://helpdesk.bitrix24.com/open/23529044/",
    effect:["fot"],
    fields:[
      {k:"meet",def:8,    suf:"pcs"},
      {k:"dur", def:60,   suf:"min"},
      {k:"part",def:6,    suf:"ppl"},
      {k:"psal",def:4000, suf:"money", est:true},
      {k:"asal",def:3000, suf:"money", est:true},
    ],
    compute:v=>{
      const cmP = costMinute(v.psal), cmA = costMinute(v.asal);
      const A = v.meet * v.dur * C.MEETING_GAIN * v.part * cmP;
      const B = v.meet * v.dur * (v.part * C.MEETING_GAIN) * cmP;
      const Cc = v.meet * v.dur * cmA;
      return {fot:A+B+Cc, rev:0,
        breakdown:[["bd.6.a",A],["bd.6.b",B],["bd.6.c",Cc]]};
    }},

  { id:7, group:"vibe", driver:"share", cov:{src:"empCount", target:"emp", def:30}, link:"https://vibecode.bitrix24.com/quickstart",
    effect:["fot"], qualitative:"qual.7",
    fields:[
      {k:"emp",  def:10,   suf:"ppl",   src:"empCount"},
      {k:"share",def:0.10, suf:"share"},
      {k:"simp", def:0.30, suf:"share"},
      {k:"sal",  def:4000, suf:"money", src:"empSal", est:true},
    ],
    compute:v=>{
      const init = Math.round(v.emp * v.share);
      const non  = Math.max(0, v.emp - init);
      const full = v.sal * burdenMult();
      const fot  = non * full * C.BASE_UPLIFT + init * full * v.simp;
      return {fot, rev:0, breakdown:[["bd.7.init", init, "int"]]};
    }},
];

/* =============================================================================
   PARTNER SERVICE COST — "cost of my services", per scenario.
   Filled BY HAND by the partner in front of the client. There are no defaults:
   a made-up figure quoted to a client is worse than a blank.
   NOT QUOTED (null) is a distinct state from QUOTED AS ZERO (0):
     - null is skipped by the sum and by the average
     - 0 is a real quote ("I do this one for free") and counts in both
   svcCost() returns null when the partner has not priced the scenario.
   ========================================================================== */
const SVC_LS = "vibecalc_services_v1";
const svcLoad = () => { try{ return JSON.parse(localStorage.getItem(SVC_LS)) || {}; }catch(e){ return {}; } };
const svcSave = (id, raw) => {
  const o = svcLoad();
  if(raw === "" || raw == null) delete o[id];   // cleared -> back to NOT QUOTED
  else o[id] = raw;
  try{ localStorage.setItem(SVC_LS, JSON.stringify(o)); }catch(e){}
};
function svcCost(sc){
  const raw = svcLoad()[sc.id];
  if(raw === undefined || raw === "") return null;   // not quoted
  const n = parseNum(String(raw));
  return isNaN(n) ? null : n;
}
/* Aggregate over SELECTED scenarios only. Empty fields never become zeros. */
function svcTotals(){
  let sum = 0, quoted = 0, unquoted = 0;
  scenarios.forEach(sc=>{
    if(!state[sc.id].selected) return;
    const v = svcCost(sc);
    if(v === null) unquoted++; else { sum += v; quoted++; }
  });
  return {sum, quoted, unquoted, avg: quoted ? sum / quoted : null};
}

/* =============================================================================
   COVERAGE — the fix for double counting.
   The source pushed the FULL headcount into every employee-driven scenario, so the
   same working day was sold several times over (67% of payroll on stock defaults).
   Coverage is the share of staff a scenario genuinely touches; AUTOFILL now supplies
   headcount x coverage instead of headcount.
   Defaults are deliberately CONSERVATIVE and flagged as estimates in the UI:
     100%  id1 / id4  — role-scoped already (the sales team IS the sales team)
      30%  id10 knowledge base, id7 Vibecode/CoWork — broad but never universal
      25%  id11 personal assistant — rolled out to a subset
      20%  id9  chat-driven Bitrix24 — an early-adopter habit
      12%  id3  document generation — only the people who actually draft documents
   Scenarios 2, 5, 6 and 12 have NO coverage: their driver is not a share of staff but
   an absolute monthly volume the partner types in directly (support specialists,
   customer base, meetings, bookings). Scaling those twice would be wrong.
   ========================================================================== */
const covOf = sc => sc.cov ? (state[sc.id].coverage ?? sc.cov.def) : 100;

/* company autofill map — targets unchanged from the source; the VALUE is now scaled */
const AUTOFILL = {
  empCount:[[9,"mgr"],[10,"emp"],[11,"emp"],[3,"emp"],[7,"emp"]],
  empSal:  [[9,"sal"],[10,"sal"],[11,"empSal"],[3,"sal"],[7,"sal"]],
  mgrCount:[[1,"mgr"]],
  mgrSal:  [[1,"sal"]],
  ropCount:[[4,"rop"]],
  ropSal:  [[4,"sal"]],
};
const COMPANY = [
  {k:"empCount", def:50},   {k:"empSal", def:4000, est:true},
  {k:"mgrCount", def:5},    {k:"mgrSal", def:4000, est:true},
  {k:"ropCount", def:1},    {k:"ropSal", def:6500, est:true},
];
const company = {};

/* scenario state */
const state = {};
scenarios.forEach(sc=>{
  const v = {}; sc.fields.forEach(f=> v[f.k] = f.def);
  state[sc.id] = {selected:false, values:v, dirty:{}, segments:[],
                  coverage: sc.cov ? sc.cov.def : null};
});

const ICON_I = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';

/* =============================================================================
   RENDER
   ========================================================================== */
const sufText = key => key === "money" ? (CUR === "EUR" ? "€" : "$") : t(SUF[key]);

function buildCompany(){
  const g = document.getElementById("co-grid");
  g.innerHTML = COMPANY.map(c=>`
    <div class="field">
      <label for="co-${c.k}">${t("co."+c.k)}${c.est?`<span class="est">${t("ui.estimate")}</span>`:""}</label>
      <div class="in-wrap">
        <input class="b24x-input comp-in" id="co-${c.k}" data-comp="${c.k}"
               type="text" inputmode="decimal" value="${groupFmt(String(company[c.k]))}">
        <span class="suf">${c.k.endsWith("Sal") ? sufText("money") : sufText("ppl")}</span>
      </div>
    </div>`).join("");
  g.querySelectorAll(".comp-in").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      company[inp.dataset.comp] = onNumInput(inp);
      applyCompany(inp.dataset.comp);
      recompute();
    });
  });
}
/* Headcount keys get scaled by the scenario's coverage; salary keys never do. */
const isHeadcountKey = k => /Count$/.test(k);

function applyCompany(key){
  (AUTOFILL[key] || []).forEach(([id,fk])=>{
    if(!state[id] || state[id].dirty[fk]) return;
    const sc = scenarios.find(s=>s.id===id);
    let val = company[key];
    // scale only the headcount this scenario's coverage governs
    if(isHeadcountKey(key) && sc && sc.cov && sc.cov.src === key && sc.cov.target === fk){
      val = Math.max(0, Math.round(val * covOf(sc) / 100));
    }
    state[id].values[fk] = val;
    const el = document.querySelector(`#card-${id} .num-in[data-k="${fk}"]`);
    if(el) el.value = groupFmt(String(val));
  });
  /* the company headcount is quoted inside the coverage sentence — keep it in step */
  scenarios.forEach(sc=>{ if(sc.cov && sc.cov.src === key) refreshCovHint(sc); });
}
/* The sentence next to the coverage field ("...costed for N people"). It lives in
   .sc-body, which recompute() does not rewrite, so it must be refreshed by hand
   whenever the headcount behind it changes — otherwise it goes stale next to a
   correct number, which reads as a broken calculator. */
const covHintText = sc => t("ui.coverageHint", {
  src: t("co." + sc.cov.src),
  n:   fmtInt(company[sc.cov.src] || 0),
  got: fmtInt(state[sc.id].values[sc.cov.target] || 0),
});
function refreshCovHint(sc){
  if(!sc.cov) return;
  const el = document.getElementById("covhint-" + sc.id);
  if(el) el.innerHTML = covHintText(sc);
}

/* Re-derive one scenario's autofilled headcount after its coverage changes. */
function applyCoverage(sc){
  if(!sc.cov) return;
  const {src, target} = sc.cov;
  if(state[sc.id].dirty[target]){ refreshCovHint(sc); return; }  // typed by hand — keep it
  const val = Math.max(0, Math.round((company[src] || 0) * covOf(sc) / 100));
  state[sc.id].values[target] = val;
  const el = document.querySelector(`#card-${sc.id} .num-in[data-k="${target}"]`);
  if(el) el.value = groupFmt(String(val));
  refreshCovHint(sc);
}

function fieldHtml(sc, f, vals, segIdx){
  const val = vals[f.k];
  const disp = f.suf === "share" ? String(Math.round(val*1000)/10) : groupFmt(String(val));
  const seg = segIdx == null ? "" : ` data-seg="${segIdx}"`;
  return `
  <div class="field" data-field="${f.k}">
    <label>${t(`sc.${sc.id}.f.${f.k}`)}${f.est?`<span class="est">${t("ui.estimate")}</span>`:""}</label>
    <div class="in-wrap">
      <input class="b24x-input num-in" data-k="${f.k}"${seg} type="text" inputmode="decimal" value="${disp}">
      <span class="suf">${sufText(f.suf)}</span>
    </div>
    <span class="err"></span>
  </div>`;
}

function buildScenarios(){
  const groups = [["crm","ui.grpCrm"],["agents","ui.grpAgents"],
                  ["other","ui.grpOther"],["vibe","ui.grpVibe"]];
  const host = document.getElementById("groups");

    ${scenarios.filter(s=>s.group===g).map(sc=>scHtml(sc)).join("")}
  `).join("");
  wireScenarios();
}

/* Continuous 1..11 numbering, as in the original (`const num = idx + 1`): the index is
   taken over the whole scenarios array, not per group. Because the groups render in the
   same order the array is written in, the numbers still read straight down the page. */
const scNum = sc => scenarios.indexOf(sc) + 1;

function scHtml(sc){

  // revOnly fields feed the revenue projection only — hide them while it is off,
  // otherwise the partner is asked for numbers that change nothing (source semantics:

    </div>

          <label for="cov-${sc.id}">${t("ui.coverage")}<span class="est">${t("ui.estimate")}</span></label>
          <div class="in-wrap">
            <input class="b24x-input cov-in" id="cov-${sc.id}" data-cov="${sc.id}"
                   type="text" inputmode="decimal" value="${covOf(sc)}">
            <span class="suf">%</span>
          </div>
        </div>
        <p class="cov-hint" id="covhint-${sc.id}">${covHintText(sc)}</p>
      </div>`:`
      <p class="cov-hint cov-hint--none">${t("ui.coverageNone")}</p>`}
      <div class="sc-grid">${vis.map(f=>fieldHtml(sc,f,st.values,null)).join("")}</div>
      <div id="segs-${sc.id}">${(st.segments||[]).map((sv,i)=>`
        <div class="seg"><div class="seg-h">${t("ui.segN",{n:i+2})}</div>
          <div class="sc-grid">${vis.map(f=>fieldHtml(sc,f,sv,i)).join("")}</div>
        </div>`).join("")}</div>
      ${sc.segments?`<button class="btn-add" data-addseg="${sc.id}">${t("ui.addSeg")}</button>`:""}

function wireScenarios(){
  document.querySelectorAll("[data-toggle]").forEach(top=>{
    const id = +top.dataset.toggle;
    const cb = top.querySelector(".sc-cb");
    const card = document.getElementById("card-"+id);
    const sync = ()=>{ state[id].selected = cb.checked; card.classList.toggle("on", cb.checked); recompute(); };
    cb.addEventListener("click", e=> e.stopPropagation());
    cb.addEventListener("change", sync);
    top.addEventListener("click", ()=>{ cb.checked = !cb.checked; sync(); });
    card.classList.toggle("on", cb.checked);
  });
  document.querySelectorAll(".num-in").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const card = inp.closest(".sc"); const id = +card.id.slice(5);
      const k = inp.dataset.k, segIdx = inp.dataset.seg;
      const raw = onNumInput(inp);
      const sc = scenarios.find(s=>s.id===id);
      const f = sc.fields.find(x=>x.k===k);
      const val = f.suf === "share" ? raw/100 : raw;
      if(segIdx == null){ state[id].values[k] = val; state[id].dirty[k] = true; }
      else { state[id].segments[+segIdx][k] = val; }
      recompute();
    });
  });
  document.querySelectorAll("[data-addseg]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const id = +b.dataset.addseg, sc = scenarios.find(s=>s.id===id);
      const v = {}; sc.fields.forEach(f=> v[f.k] = f.def);
      state[id].segments.push(v);
      buildScenarios(); recompute();
    });
  });
  /* coverage: re-derives the autofilled headcount, then a full recompute.
     The input lives in .sc-body, which recompute() does NOT rewrite (it only
     rewrites #res-N), so typing here is safe. */
  document.querySelectorAll(".cov-in").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const id = +inp.dataset.cov;
      const sc = scenarios.find(s=>s.id===id);
      let n = onNumInput(inp);
      if(n > 100) n = 100;                  // coverage is a share, not a multiplier
      state[id].coverage = n;
      applyCoverage(sc);
      recompute();
    });
  });
}

/* ---- compute ---- */
function computeScenario(sc, st){
  const sets = [st.values].concat(st.segments || []);
  let fot = 0, rev = 0, breakdown = null;
  sets.forEach(vals=>{
    const r = sc.compute(vals);
    fot += r.fot; rev += (r.rev || 0);
    if(r.breakdown){
      if(!breakdown) breakdown = r.breakdown.map(b=>[b[0], b[1], b[2]]);
      else r.breakdown.forEach((b,j)=>{ if(breakdown[j]) breakdown[j][1] += b[1]; });
    }
  });
  return {fot, rev, breakdown};
}

/* =============================================================================
   THE SINGLE CALCULATION PATH — computeModel()
   Every surface (screen, client report, partner report) displays THIS result.
   Nothing else is allowed to sum, derive or re-derive a figure.

   ROUNDING RULE, and it is the whole point of this function:
   nothing in here rounds. Per-scenario results, the sums, the yearly figures,
   the first-year cost and the net all stay full-precision. Rounding happens
   exactly ONCE, in the formatters (fmtMoney / fmtInt / fmtPct), at the moment a
   number is shown to a human.

   Why it matters: the screen used to sum raw values while the report rounded each
   scenario first and summed the rounded ones. Same formulas, different order of
   rounding, and the two disagreed by $2 on the demo set (scenario 1 yields
   $10,833.33). Round an intermediate and every total built on it inherits the
   error. So: intermediates stay exact, only the display rounds.
   ========================================================================== */
function computeModel(){
  const items = [];
  let fot = 0, rev = 0, pot = 0, any = false, qual = false;

  scenarios.forEach(sc=>{
    const st = state[sc.id];
    if(!st.selected) return;
    const r = computeScenario(sc, st);
    any = true;
    if(sc.qualitative) qual = true;
    fot += r.fot;                                          // raw, never rounded
    if(sc.revLabel === "ui.revBase") pot += r.rev; else rev += r.rev;
    items.push({sc, fot:r.fot, rev:r.rev, breakdown:r.breakdown, service:svcCost(sc)});
  });

  const svc = svcTotals();
  const {map, vibe} = targetPlan();
  const essList = PRICING.essentials[CUR];
  const ess = essList ? essList.find(x=>x.plan===essPlan) : null;

  const subscriptionYear = vibe ? vibe.annualTotal : 0;
  const fotYear        = fot * 12;
  const firstYearCost  = subscriptionYear + svc.sum;
  const netFirstYear   = fotYear - firstYearCost;

  const payroll = (company.empCount || 0) * (company.empSal || 0) * burdenMult();
  const pct = payroll ? (fot / payroll * 100) : 0;

  return {
    any, qual, n: items.length, items, svc,
    plan: {from: essPlan, map, vibe, ess},
    totals: {
      fotMonth: fot, fotYear,
      revMonth: rev, revYear: rev * 12,
      potMonth: pot, potYear: pot * 12,
      serviceSum: svc.sum, subscriptionYear, firstYearCost, netFirstYear,
    },
    overlap: {
      ok: any ? pct <= C.OVERLAP_WARN_PCT : true,
      pct: any ? pct : 0,
      payroll, threshold: C.OVERLAP_WARN_PCT,
    },
  };
}

function recompute(){
  const model = computeModel();
  const byId = {};
  model.items.forEach(it=> byId[it.sc.id] = it);

  scenarios.forEach(sc=>{
    const st = state[sc.id];
    const card = document.getElementById("card-"+sc.id);
    const res = document.getElementById("res-"+sc.id);
    if(!card || !res) return;

    card.querySelectorAll(".field").forEach(f=>f.classList.remove("invalid"));
    const errs = sc.validate ? sc.validate(st.values) : null;
    if(errs) Object.entries(errs).forEach(([k,msgKey])=>{
      const f = card.querySelector(`.field[data-field="${k}"]`);
      if(f){ f.classList.add("invalid"); f.querySelector(".err").textContent = t(msgKey);
             const i = f.querySelector("input"); if(i) i.setAttribute("aria-invalid","true"); }
    });
    if(!errs) card.querySelectorAll("input[aria-invalid]").forEach(i=>i.removeAttribute("aria-invalid"));

    if(!st.selected){ res.innerHTML = ""; return; }

    const r = byId[sc.id];        // from the model — the card does not recompute
    let html = "";
    if(r.breakdown){
      html += '<div class="bd">' + r.breakdown.map(b=>{
        const isInt = b[2] === "int";
        return `<span></span><div><span>${t(b[0], copyVars())}</span><b>${isInt?fmtInt(b[1]):fmtMoney(b[1])}</b></div>`;
      }).join("") + "</div>";
    }
    if(sc.effect.includes("fot")){
      html += row(t("ui.fotMonth"), fmtMoney(r.fot));
      html += row(t("ui.fotYear"),  fmtMoney(r.fot*12));
    }
    if(sc.effect.includes("rev") && SHOW_REVENUE){
      const rl = t(sc.revLabel || "ui.revDefault");
      html += row(rl + ", " + t("ui.month").toLowerCase(), fmtMoney(r.rev), "rev");
      html += row(rl + ", " + t("ui.year").toLowerCase(),  fmtMoney(r.rev*12), "rev");
    }
    const sv = r.service;
    html += `<div class="res-row"><span class="lbl">${t("ui.svcLabel")}
      <button class="info-btn" data-info="svc-${sc.id}" aria-label="${t("ui.aboutSvc")}">${ICON_I}</button></span>
      <span class="val"><input class="b24x-input svc-in" data-svc="${sc.id}" type="text"
        inputmode="decimal" placeholder="${t("ui.notQuoted")}"
        value="${sv === null ? "" : groupFmt(String(sv))}"> ${sufText("money")}</span></div>`;
    html += `<div class="res-row"><span class="lbl">${t("ui.howCalc")}
      <button class="info-btn" data-info="${sc.id}" aria-label="${t("ui.howCalc")}">${ICON_I}</button></span><span></span></div>`;
    res.innerHTML = html;
  });

  paintTotals(model);
}

/* Totals only — never touches the scenario cards. Used by the partner service-cost
   input, which lives INSIDE #res-N: a full recompute() rewrites that block and would
   destroy the field mid-keystroke (the phase-2 bug; INVENTORY.md §e).
   This is a RENDER variant, not a second calculation: both call computeModel(). */
function refreshTotals(){
  paintTotals(computeModel());
}

/* The credibility guard is computed inside computeModel() (overlap.*): total monthly
   payroll saving as a share of the whole monthly payroll cost, on the same basis the
   scenarios are costed on. Above C.OVERLAP_WARN_PCT the scenarios almost certainly
   count the same working day twice. We warn and explain; we never block or clamp. */

function paintTotals(model){
  lastModel = model;
  lastOverlap = model.overlap;
  renderSummary(model);
  renderTransition();
  renderPartnerPanel(model);
  const n = model.n;
  document.getElementById("nav-cnt").textContent = n
    ? t("ui.selected", {n, total:scenarios.length}) : t("ui.nothing");
  const extra = SHOW_REVENUE ? model.totals.revMonth + model.totals.potMonth : 0;
  document.getElementById("nav-tot").innerHTML = n
    ? t("ui.navTotal",{v:fmtMoney(model.totals.fotMonth)})
      + (extra>0 ? t("ui.navPot",{v:fmtMoney(extra)}) : "")
    : "";
}
const row = (l,v,cls) => `<div class="res-row"><span class="lbl">${l}</span><span class="val ${cls||""}">${v}</span></div>`;

/* ---- report export: serialise the model for scripts/build-report.mjs ----
   Carries RAW, unrounded figures. The report rounds on display, exactly as the
   screen does, so both surfaces show the same number. Do not round here.
   `display` carries the strings the screen is showing right now; the parity test
   (scripts/check-parity.mjs) asserts the report renders the same ones. */
function reportState(){
  const m = lastModel || computeModel();
  const items = m.items.map(it=>{
    const sc = it.sc;
    return {
      id: sc.id,
      title: t(`sc.${sc.id}.title`),
      role: t(`sc.${sc.id}.role`),
      driver: sc.driver,
      coverage: sc.cov ? covOf(sc) : null,
      fotMonth: it.fot,          // raw
      fotYear: it.fot * 12,      // raw
      rev: sc.effect.includes("rev") ? it.rev : 0,
      revLabel: sc.effect.includes("rev") ? t(sc.revLabel || "ui.revDefault") : null,
      service: it.service,                  // null = not quoted
      fields: sc.fields
        .filter(f=>!f.revOnly || SHOW_REVENUE)
        .map(f=>({label: t(`sc.${sc.id}.f.${f.k}`),
                  value: f.suf==="share"
                    ? fmtPct(state[sc.id].values[f.k])
                    : (f.suf==="money" ? fmtMoney(state[sc.id].values[f.k])
                                       : fmtInt(state[sc.id].values[f.k]) + " " + t(SUF[f.suf]))})),
    };
  });
  const svc = m.svc;
  const {map, vibe, ess} = m.plan;
  const T = m.totals;
  return {
    lang: LANG, currency: CUR, showRevenue: SHOW_REVENUE,
    generatedFor: partner.company || "",
    partner: {...partner},
    economics: {daysMonth, dayHours: C.DAY_HOURS, contractDays: C.CONTRACT_DAYS,
                contractHours: contractHours(), burdenPct},
    /* The credibility guard travels WITH the data, so the warning cannot be lost
       between the screen and the PDF. */
    overlap: {
      ok: m.overlap.ok,
      pct: m.overlap.pct,                  // raw; formatted on display
      threshold: C.OVERLAP_WARN_PCT,
      payrollMonth: m.overlap.payroll,     // raw
      text: m.overlap.ok ? null
        : t("ui.overlapReport", {pct: fmtPct1(m.overlap.pct), limit: C.OVERLAP_WARN_PCT}),
    },
    company: {...company},
    items,
    totals: {
      fotMonth: T.fotMonth, fotYear: T.fotYear,
      revMonth: T.revMonth, potMonth: T.potMonth,
      serviceSum: svc.sum, serviceQuoted: svc.quoted, serviceUnquoted: svc.unquoted,
      subscriptionYear: T.subscriptionYear,
      firstYearCost: T.firstYearCost,
      netFirstYear: T.netFirstYear,
    },
    /* What the SCREEN currently renders for these quantities. The parity test
       compares the report's rendering against these exact strings. */
    display: {
      fotMonth:        fmtMoney(T.fotMonth),
      fotYear:         fmtMoney(T.fotYear),
      serviceSum:      fmtMoney(svc.sum),
      subscriptionYear:fmtMoney(T.subscriptionYear),
      firstYearCost:   fmtMoney(T.firstYearCost),
      netFirstYear:    fmtMoney(T.netFirstYear),
      planFromAnnual:  ess ? fmtMoney(ess.annual) : null,
      planToAnnual:    fmtMoney(vibe.annual),
      planToAnnualTotal: fmtMoney(vibe.annualTotal),
      diffPerUserMonth: ess ? fmtMoney(vibe.annual - ess.annual) : null,
      overlapPct:      fmtPct1(m.overlap.pct),
      perScenario: items.map(i=>({id:i.id, fotMonth: fmtMoney(i.fotMonth),
                                  fotYear: fmtMoney(i.fotYear)})),
    },
    plan: {
      from: essPlan,
      fromAnnualPerMonth: ess ? ess.annual : null,
      fromMonthly: ess ? ess.monthly : null,
      to: map.to,
      toAnnualPerMonth: vibe.annual, toMonthly: vibe.monthly, toAnnualTotal: vibe.annualTotal,
      effectiveFrom: PRICING.effectiveFrom, grandfatheredUntil: PRICING.grandfatheredUntil,
    },
    aiAllowance: [t("ai.essentials"), t("ai.basic"), t("ai.standard")],
  };
}
function downloadState(){
  const blob = new Blob([JSON.stringify(reportState(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "calc-state.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---- info modal ---- */
document.getElementById("ov-x").addEventListener("click", ()=> document.getElementById("ov").hidden = true);
document.getElementById("ov").addEventListener("click", e=>{ if(e.target.id==="ov") e.currentTarget.hidden = true; });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") document.getElementById("ov").hidden = true; });
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-info]"); if(!b) return;
  e.stopPropagation();
  const key = b.dataset.info;
  let title = t("ui.howCalc"), body = "";
  if(key === "svc-summary"){ title = t("ui.aboutSvc"); body = t("ui.svcSummaryInfo"); }
  else if(String(key).startsWith("svc-")){
    const id = key.slice(4);
    title = t("ui.aboutSvc") + " · " + t(`sc.${id}.title`);
    body = t(`int.${id}`);
  } else {
    title = t("ui.howCalc") + " · " + t(`sc.${key}.title`);
    body = t(`info.${key}`, copyVars());
  }
  document.getElementById("ov-t").textContent = title;
  document.getElementById("ov-b").textContent = body;
  document.getElementById("ov").hidden = false;
});

/* Partner service-cost field — delegated so it survives re-render.
   MUST call refreshTotals(), never recompute(): the field lives inside #res-N
   and a full recompute rewrites that block, eating the keystroke (phase-2 bug).
   An empty field is saved as "not quoted", not as 0. */
document.addEventListener("input", e=>{
  const el = e.target;
  if(!el.classList || !el.classList.contains("svc-in")) return;
  if(el.value.trim() === ""){ svcSave(el.dataset.svc, ""); }
  else { svcSave(el.dataset.svc, onNumInput(el)); }
  refreshTotals();   // NOT recompute() — see refreshTotals()
});

/* ---- i18n / currency application. Values are NOT reset: state is the source
   of truth and inputs are repopulated from it. ---- */
function applyStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.innerHTML = t(el.dataset.i18n, copyVars());
  });
  document.getElementById("warn-de").hidden = (LANG !== "de");
  /* EN + USD scope: switchers stay in the DOM and keep working, just hidden. */
  document.querySelector('[data-i18n="ui.lang"]').hidden = !SHOW_LANG_SWITCH;
  document.getElementById("sw-lang").hidden = !SHOW_LANG_SWITCH;
  document.querySelector('[data-i18n="ui.cur"]').hidden = !SHOW_CUR_SWITCH;
  document.getElementById("sw-cur").hidden = !SHOW_CUR_SWITCH;
  document.getElementById("hero-pills").innerHTML = ["pil.1","pil.2","pil.3"]
    .map(k=>`<span class="pill"><img src="assets/icons/check-white.svg" alt="">${t(k)}</span>`).join("");
  document.getElementById("ai-list").innerHTML = ["ai.essentials","ai.basic","ai.standard"]
    .map(k=>`<li><img src="assets/icons/badge-check.svg" alt="">${t(k)}</li>`).join("");
  document.getElementById("foot-dates").textContent =
    t("ui.effectiveFrom", {date:PRICING.effectiveFrom, grand:PRICING.grandfatheredUntil});
  const sel = document.getElementById("ess-sel");
  sel.innerHTML = PRICING.migration.map(m=>
    `<option value="${m.from}" ${m.from===essPlan?"selected":""}>${m.from}</option>`).join("");
}
/* Partner contact block — values live in `partner`, so a language or currency
   switch repaints labels without clearing what the partner typed. */
const PARTNER_FIELDS = ["company","person","email","phone","site"];
const PT_LS = "vibecalc_partner_v1";
const partner = {};
function buildPartner(){
  const g = document.getElementById("pt-grid");
  if(!g) return;
  g.innerHTML = PARTNER_FIELDS.map(k=>`
    <div class="field">
      <label for="pt-${k}">${t("pt."+k)}</label>
      <div class="in-wrap">
        <input class="b24x-input pt-in" id="pt-${k}" data-pt="${k}"
               type="${k==="email"?"email":k==="site"?"url":"text"}"
               value="${(partner[k]||"").replace(/"/g,"&quot;")}">
      </div>
    </div>`).join("");
  g.querySelectorAll(".pt-in").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      partner[inp.dataset.pt] = inp.value;
      try{ localStorage.setItem(PT_LS, JSON.stringify(partner)); }catch(e){}
    });
  });
}

function rerenderAll(){
  applyStatic(); buildCompany(); buildPartner(); buildScenarios(); recompute();
}

document.querySelectorAll("#sw-lang button").forEach(b=>{
  b.addEventListener("click", ()=>{
    LANG = b.dataset.lang;
    document.querySelectorAll("#sw-lang button").forEach(x=>
      x.setAttribute("aria-pressed", String(x === b)));
    rerenderAll();
  });
});
document.querySelectorAll("#sw-cur button").forEach(b=>{
  b.addEventListener("click", ()=>{
    CUR = b.dataset.cur;
    document.querySelectorAll("#sw-cur button").forEach(x=>
      x.setAttribute("aria-pressed", String(x === b)));
    rerenderAll();
  });
});
document.getElementById("ess-sel").addEventListener("change", e=>{
  essPlan = e.target.value; recompute();
});
document.getElementById("burden").addEventListener("input", e=>{
  burdenPct = onNumInput(e.target); recompute();
});
document.getElementById("days").addEventListener("input", e=>{
  const n = onNumInput(e.target);
  daysMonth = n > 0 ? n : C.DAYS_MONTH;   // 0 days would divide by zero
  recompute();
});
document.getElementById("show-rev").addEventListener("change", e=>{
  SHOW_REVENUE = e.target.checked;
  buildScenarios();   // revOnly fields appear/disappear with the switch
  recompute();
});
document.getElementById("dl-state").addEventListener("click", downloadState);

/* ---- boot ---- */
COMPANY.forEach(c=> company[c.k] = c.def);
PARTNER_FIELDS.forEach(k=> partner[k] = "");
try{ Object.assign(partner, JSON.parse(localStorage.getItem(PT_LS)) || {}); }catch(e){}
document.getElementById("burden").value = String(C.BURDEN_PCT);
document.getElementById("days").value = String(C.DAYS_MONTH);
document.getElementById("show-rev").checked = SHOW_REVENUE;
applyStatic();
buildCompany();
buildPartner();
Object.keys(AUTOFILL).forEach(applyCompany);
scenarios.forEach(applyCoverage);   // headcount x coverage, before the first render
buildScenarios();
/* NOTHING is selected on first load — same as the original.
   This is the author's first line of defence against double counting: the partner
   must consciously pick each scenario, so the opening screen never shows a total
   nobody chose. Do not pre-select scenarios here. */
recompute();
</script>
